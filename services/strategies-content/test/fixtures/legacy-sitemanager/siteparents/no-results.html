<script type="text/javascript">
	$(document).ready(function(){	
		$('#parentSearch').on('keypress',function(e){
			if(e.which == 13) {
				var pval = $(this).val();
				$('#parentSearchSubmit').trigger('click');
				setTimeout(function(){						
				$('#parentSearch').focus();	
				},'250')	
				return false;
		  	}
		})
	})
