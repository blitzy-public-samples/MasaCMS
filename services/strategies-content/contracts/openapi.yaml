      type: object
      required: [saved, errors, redirect]
      additionalProperties: false
      properties:
        saved:
          type: boolean
        errors:
          type: object
          description: The legacy error struct, keyed as legacy keys it.
          additionalProperties:
            type: string
        redirect:
          description: The legacy redirect, in parameter order, for `adminUrl`; null re-renders the form with `errors`.
          oneOf:
            - type: object
              required: [circuit, action, params]
              additionalProperties: false
              properties:
                circuit:
                  type: string
                action:
                  type: string
                params:
                  type: array
                  items:
                    type: array
                    prefixItems:
                      - type: string
                      - type: string
                    minItems: 2
                    maxItems: 2
            - type: 'null'
        data:
          type: object
          additionalProperties: true
    SignedUrl:
      type: object
      description: A download URL valid for 900 s; a v4 signed Cloud Storage URL in the cloud, a path-only HMAC URL under `/opt2/files/content-files/` locally.
      required: [url, expiresAt]
      additionalProperties: false
      properties:
        url:
          type: string
          minLength: 1
        expiresAt:
          type: string
          format: date-time
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,3})?Z$
    HeaderPrompts:
