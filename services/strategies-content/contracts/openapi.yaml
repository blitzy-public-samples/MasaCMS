      type: object
      required: [contentID, siteID, userID, rate]
      additionalProperties: true
      properties:
        contentID:
          type: string
        siteID:
          type: string
        userID:
          type: string
          description: Rater id as the client posts it; legacy does not check it.
        rate:
          type: string
