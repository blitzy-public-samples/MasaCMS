openapi: 3.1.0
info:
  title: strategies-content
  version: 1.0.0
  description: 'API of the OPT-2 strategies-content service: content, versions, approvals, change sets, categories, comments, feeds, files and forms; a breaking change takes a /v2/ prefix. Path templates map to Fastify routes as `{name}` to `:name`, a final parameter marked `x-opt2-wildcard` to a trailing `*`, and each route also serves its trailing-slash form and HEAD.'
  license:
    name: GPL-2.0-only
    identifier: GPL-2.0-only
  x-source-sha: 696383140578f8dea3ece26f80cd7bfb370ddf0f
servers:
  - url: http://127.0.0.1:8114
    description: local
x-opt2-calls: [identity]
x-opt2-entity-access:
  content:
    read: public
    write: [s2, site-admin, 'm:000']
    writeByType:
      Form: [s2, site-admin, 'm:004']
      Component: [s2, site-admin, 'm:003']
      Variation: [s2, site-admin, 'm:099']
    nodePermission: [author, editor]
  contentnav:
    read: public
    write: [s2, site-admin, 'm:000']
    writeByType:
      Form: [s2, site-admin, 'm:004']
      Component: [s2, site-admin, 'm:003']
      Variation: [s2, site-admin, 'm:099']
    nodePermission: [author, editor]
  comment:
    read: public
    write: [s2, site-admin, 'm:015']
  category:
    read: public
    write: [s2, site-admin, 'm:010']
  contentCategoryAssign:
    read: public
    write: [s2, site-admin, 'm:000']
  file:
    read: [s2, site-admin, 'm:000']
    write: [s2, site-admin, 'm:000']
  fileMetaData:
    read: [s2, site-admin, 'm:000']
    write: [s2, site-admin, 'm:000']
  changesetCategoryAssignment:
    read: [s2, site-admin, 'm:000']
    write: [s2, site-admin, 'm:000']
  stats:
    read: [s2, site-admin, 'm:000']
    write: [s2, site-admin, 'm:000']
  variationTargeting:
    read: [s2, site-admin, 'm:000']
    write: [s2, site-admin, 'm:000']
    requiresConfig: variations
  changeset:
    read: [s2, site-admin, 'm:014']
    write: [s2, site-admin, 'm:014']
  feed:
    read: [s2, site-admin, 'm:011']
    write: [s2, site-admin, 'm:011']
x-opt2-excluded:
  - key: 'api:file.save{upload=image}'
    reason: Halted under EX-FILE-RENDITION; legacy writes the renditions inside write windows.
  - key: 'rest:file.save{upload=image}'
    reason: Halted under EX-FILE-RENDITION; legacy writes the renditions inside write windows.
  - key: 'admin:carch.update{upload=image}'
    reason: Halted under EX-FILE-RENDITION.
  - key: 'admin:carch.multifileupload{upload=image}'
    reason: Halted under EX-FILE-RENDITION.
  - key: 'admin:carch.cropimage'
    reason: Halted under EX-FILE-RENDITION; rewrites renditions with the ColdFusion image engine.
  - key: 'admin:carch.flipimage'
    reason: Halted under EX-FILE-RENDITION; rewrites renditions with the ColdFusion image engine.
  - key: 'admin:carch.rotateimage'
    reason: Halted under EX-FILE-RENDITION; rewrites renditions with the ColdFusion image engine.
  - key: 'admin:carch.update{approved=1}'
    reason: Withheld; writes the decision-list table tcontenteventreminders.
  - key: 'admin:carch.update{notify}'
    reason: Withheld; writes the decision-list table tcontenteventreminders.
  - key: 'admin:carch.updateobjectparams{approved=1}'
    reason: Withheld; writes the decision-list table tcontenteventreminders.
  - key: 'admin:cchangesets.publish'
    reason: Withheld; writes the decision-list table tcontenteventreminders.
  - key: 'admin:cfeed.import2'
    reason: Withheld; writes the decision-list table tcontenteventreminders.
  - key: 'admin:carch.importcomponent'
    reason: Withheld; writes decision-list tables.
  - key: 'admin:carch.importcontent'
    reason: Withheld; writes decision-list tables.
  - key: 'admin:carch.copy'
    reason: Withheld; its write set spans identity and strategies-content.
  - key: 'admin:carch.variationtargeting{notify}'
    reason: Withheld; its write set spans identity and strategies-content.
  - key: 'admin:carch.export'
    reason: Legacy-served bundle engine.
  - key: 'admin:carch.exportcontent'
    reason: Legacy-served bundle engine.
  - key: 'admin:carch.exportcomponent'
    reason: Legacy-served bundle engine.
  - key: 'admin:carch.import'
    reason: Legacy-served bundle engine.
  - key: 'admin:carch.emailtest'
    reason: Legacy-served; owned by communications.
  - key: 'admin:cfilemanager.default'
    reason: Legacy-served; browses the legacy web-root filesystem.
  - key: 'admin:razuna.*'
    reason: Legacy-served; trazunasettings is on the decision list.
  - key: 'admin:scaffold.*'
    reason: Legacy-served scaffolder.
  - key: 'admin:cplugins.*'
    reason: Legacy-served plugin runtime.
  - key: 'api:filebrowser.~*'
    reason: Legacy-served; browses the legacy web-root filesystem.
  - key: 'rest:filebrowser.~*'
    reason: Legacy-served; browses the legacy web-root filesystem.
  - key: 'asset:upload'
    reason: Legacy-served; writes the legacy web-root filesystem.
  - key: 'asset:render'
    reason: Legacy-served; reads the legacy web-root filesystem.
  - key: 'api:processasyncobject'
    reason: Stays on legacy; renders CFML display objects.
  - key: 'api:swagger'
    reason: Legacy-served; generated from CFML bean metadata.
  - key: 'api:submitform'
    reason: Retired; jsonApiUtility defines no submitForm function.
  - key: 'cfc:/core/modules/v1/comments/ajax/commentsproxy.cfc?method=rendercommentspage'
    reason: Legacy-served; renders CFML.
  - key: 'page:saverate'
    reason: Legacy-served page render.
  - key: 'admin:carch.displayobjectmodal'
    reason: Legacy-served; includes theme and module display-object CFML.
  - key: 'admin:carch.frontendconfigurator'
    reason: Legacy-served; reads the CFML display-object registry and plugin display objects.
  - key: 'admin:carch.loadrepomanager'
    reason: Legacy-served; legacy answers the ColdFusion FW/1 viewNotFound 500 page, as the pin has no view for it.
x-opt2-web-only-actions:
  - action: carch.edittext
    reason: Static compact view; web renders it without service data.
