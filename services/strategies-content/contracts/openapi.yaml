  /v1/sites/{siteid}/content/tree:
    parameters:
      - $ref: '#/components/parameters/SiteIdPath'
    get:
      operationId: getSiteManagerTree
      summary: Reads the Site Manager tree level under a node.
      description: 'Runs carch `list()` and the `list.cfm` view''s own logic over the request `rc` (the declared parameters plus `params`). `params.keywords` is present only when the request URL carries `keywords` (`url.keywords`). For the content modules (`…000`, `…003`, `…004`, `…099`) the view''s in-view sort write runs when `rc.orderperm` allows it (`orderperm`, `sorted`, `orderid`, `saveSort`, `startrow`), and its `session.flatViewArgs` updates are kept by this service. `rc` holds `topid` (after the empty-result fallback), `rsTop` (the `getList` rows) and `siteConfig` (`customTagGroups`, `scaffolding`, `dataCollection`, `hasLockableNodes`). For the content modules it also holds `sortBy` and `sortDirection` (as the view leaves them), `crumbdata` (`getCrumbList(topid)` rows with `siteid`), `copyContentID`, `copySiteID`, `copyAll` and, once copy info was saved, `copyModuleID`, `flatViewArgs` (the session site''s struct), `modulePerms` (`getPerm(<module id>)` verdicts keyed by the components and forms module ids) and `variations` (configBean `variations`). For `LEGACY` it holds `perm` (`getPerm(moduleid)`), `nextN` (`getNextN` struct), a `perm` verdict (`getPerm(contentid)`) on each `rsTop` row, `categoryCount`, `categories` (the category tree: `categoryID`, `name`, `isOpen`, `hasKids`, `children`) and, for compact display, `useLayoutManager`.'
      tags: [content]
      x-opt2-transport: service
      x-opt2-requires: [s2, site-admin, 'm:000']
      x-opt2-legacy-actions: [carch.list]
      security: [{userToken: [], invocationCredential: []}]
      parameters:
        - name: topid
          in: query
          required: false
          description: Node whose children are listed.
          schema:
            type: string
        - name: moduleid
          in: query
          required: false
          schema:
            type: string
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
        - name: sortDirection
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: One-based page of the level.
          schema:
            $ref: '#/components/schemas/DigitString'
        - $ref: '#/components/parameters/RawParams'
      responses:
        '200':
          $ref: '#/components/responses/AdminView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
