        entityname:
          type: string
        siteid:
          type: string
        csrf_token:
          type: string
        csrf_token_expires:
          type: string
    LegacyCallJsonBody:
      type: object
      description: JSON API parameters and entity values in a JSON body; values merge unchanged, so they may be objects and arrays.
      additionalProperties: true
      properties:
        method:
          type: string
        entityname:
          type: string
        siteid:
          type: string
        csrf_token:
          type: string
        csrf_token_expires:
          type: string
        data:
          description: 'validate input: an object or its JSON text, null reading as `{}`; booleans and non-JSON text answer 400, and other values `invalid`.'
        validations:
          description: 'validate rules: an object such as `{properties: {name: [{required: true}]}}` or its JSON text, null reading as `{}`; booleans and non-JSON text answer 400, and other values `invalid`.'
