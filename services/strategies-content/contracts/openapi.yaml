      description: What the legacy controller and view compute for the screen.
      required: [rc]
      additionalProperties: false
      properties:
        rc:
          type: object
          description: Values under their legacy `rc` names; queries as arrays of rows keyed by column, beans as their `getAllValues()` struct.
          additionalProperties: true
