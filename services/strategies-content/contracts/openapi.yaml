  /internal/v1/migration/objects:
    post:
      operationId: migrationPutObject
      summary: Stores one legacy file-store object in `content-files`, once per SHA-256.
      tags: [migration]
      x-opt2-transport: service
      x-opt2-requires: [platform.migration]
      security: [{invocationCredential: []}]
      parameters:
        - name: tenantId
          in: query
          required: true
          description: Tenant of the file; the umbrella tenant for a pooled file.
          schema:
            type: string
            format: uuid
        - name: fileId
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/CfId'
        - name: variant
          in: query
          required: true
          description: Rendition suffix found in the legacy store, such as `_small`, or empty for the original.
          schema:
            type: string
            pattern: ^(_[^/\\\u0000-\u001F\u007F]+)?$
        - name: ext
          in: query
          required: true
          description: Extension after the stored name's last dot; the key holds it lower-cased.
          schema:
            type: string
            minLength: 1
            pattern: ^[A-Za-z0-9]+$
        - name: contentType
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: sha256
          in: query
          required: true
          description: Lowercase hex SHA-256 of the body.
          schema:
            type: string
            pattern: ^[0-9a-f]{64}$
      requestBody:
        required: true
        description: The object bytes.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: The stored object; `created` is false when the same hash was already stored.
          headers:
            X-Opt2-Write-Position:
              $ref: '#/components/headers/XOpt2WritePosition'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileObject'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: Invalid parameters, or a body whose SHA-256 differs from `sha256` (`badRequest`).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      operationId: migrationGetObject
      summary: Reads the bytes of one stored `content-files` object, for the reverse projection to the legacy file store.
      tags: [migration]
      x-opt2-transport: service
      x-opt2-requires: [platform.migration]
      security: [{invocationCredential: []}]
      parameters:
        - name: key
          in: query
          required: true
          description: Object key `<tenantId>/<fileId><variant>.<ext>` of a `content.file_object` row; the tenant is its first segment.
          schema:
            type: string
            pattern: ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}/[A-Za-z0-9-]{35}(_[^/\\\u0000-\u001F\u007F]+)?\.[A-Za-z0-9]+$
      responses:
        '200':
          description: The stored bytes, whatever the object's content type.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
          description: The tenant has no `content.file_object` row or stored object under the key.
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      operationId: migrationDeleteObject
      summary: Deletes one stored `content-files` object and its `content.file_object` row, for a legacy file the change feed found removed.
      tags: [migration]
      x-opt2-transport: service
      x-opt2-requires: [platform.migration]
      security: [{invocationCredential: []}]
      parameters:
        - name: key
          in: query
          required: true
          description: Object key `<tenantId>/<fileId><variant>.<ext>`; the tenant is its first segment.
          schema:
            type: string
            pattern: ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}/[A-Za-z0-9-]{35}(_[^/\\\u0000-\u001F\u007F]+)?\.[A-Za-z0-9]+$
      responses:
        '200':
          description: Nothing is stored under the key any more; `deleted` is false when the tenant recorded no object under it.
          headers:
            X-Opt2-Write-Position:
