      description: Counts of distinct content ids among the user's drafts of the last three months, submissions, approvals and expiring content in the token site, and of versions awaiting approval in its unpublished change sets (0 without Change Sets and Site Manager module access).
      required: [drafts, submissions, approvals, expires, pendingChangesets]
      additionalProperties: false
      properties:
        drafts:
          type: integer
          minimum: 0
        submissions:
          type: integer
          minimum: 0
        approvals:
          type: integer
          minimum: 0
        expires:
          type: integer
          minimum: 0
        pendingChangesets:
          type: integer
          minimum: 0
