    AdminNotFound:
      description: The addressed record does not exist.
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyError'
    RawUnavailable:
      description: 'Legacy-shaped 503: the error envelope, or the admin error page.'
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyUnavailable'
        text/html;charset=UTF-8:
          schema:
            $ref: '#/components/schemas/LegacyErrorPage'
  schemas:
    CfId:
      type: string
      description: ColdFusion `createUUID()` id.
      minLength: 35
      maxLength: 35
      pattern: ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{16}$
    DigitString:
      type: string
      description: Non-negative decimal integer without leading zeros.
      pattern: ^(0|[1-9][0-9]{0,14})$
    LocalTimestamp:
      type: string
      description: Wall-clock time in the legacy server's zone, without an offset.
      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}$
      examples:
        - 2026-06-30T09:15:00.000
    WallClock:
      type: string
      description: Wall-clock time without a zone, `YYYY-MM-DD HH:MM[:SS[.fff]]` with a space or `T`.
      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}[ T][0-9]{2}:[0-9]{2}(:[0-9]{2}(\.[0-9]+)?)?$
    FormValue:
      description: One form field as a CFML scope holds it; JSON callers may send numbers and booleans.
      type:
        - string
        - number
        - boolean
    LegacyId:
      type: string
      description: 'Legacy id of up to 35 characters: a CF UUID, or a 35-digit sentinel such as the home node `00000000000000000000000000000000001`.'
      minLength: 1
      maxLength: 35
    LegacyEnvelope:
      type: object
      description: Legacy JSON API success envelope; `params` is absent under `suppressAPIParams`, and `data` keys move to the top level when `useDataNamespace` is false.
      required: [apiversion, method]
      additionalProperties: true
      properties:
        apiversion:
          type: string
          const: v1
        method:
          type: string
        params:
          type: object
        data:
          $ref: '#/components/schemas/JsonApiData'
        layout:
          description: The shunter layout, copied from `data.layout` when `data.shunter` is true.
    FullCalendarEvents:
      type: array
      description: '`findCalendarItems` events in FullCalendar format, sent without the envelope (contentCalendarUtilityBean.cfc `fullCalendarFormat`).'
      items:
        type: object
        required: [allday, end, id, start, title, url]
        additionalProperties: false
        properties:
          allday:
            type: boolean
            description: True when the item starts at hour 0.
          end:
            type: string
            description: '`displaystop`: `yyyy-mm-dd` at 00:00 or 23:59, else ISO 8601 with the server offset; empty when null.'
          id:
            type: string
            description: The content id.
          start:
            type: string
            description: '`displaystart`, formatted as `end` is.'
          title:
            type: string
            description: The menu title.
          url:
            type: string
            description: The item's complete URL.
    LegacyError:
      type: object
      description: Legacy JSON API error envelope; types map to status and code as authorization 401, invalidAccessToken and accessTokenExpired 401 invalid_token, disabled, invalidParameters, invalidEntityCall, invalidMethodCall, badRequest and invalidTokens 400 invalid_request, server_error 500.
      required: [apiversion, method, error]
      additionalProperties: true
      properties:
        apiversion:
          type: string
          const: v1
        method:
          type: string
        params:
          type: object
        error:
          type: object
          required: [message, code]
          additionalProperties: true
          properties:
            message:
              type: string
            code:
              type: string
              enum:
                - invalid_request
                - invalid_token
                - server_error
    LegacyUnavailable:
      type: object
      description: Legacy JSON API `server_error` envelope sent with status 503.
      required: [apiversion, method, error]
      additionalProperties: false
      properties:
        apiversion:
          type: string
          const: v1
        method:
          type: string
        params:
          type: object
        error:
          type: object
          required: [message, code]
          additionalProperties: false
          properties:
            message:
              type: string
              const: Unhandled Exception
            code:
              type: string
              const: server_error
    JsonApiData:
      description: An entity, a collection, or a method result.
      anyOf:
        - $ref: '#/components/schemas/JsonApiCollection'
        - $ref: '#/components/schemas/ContentEntity'
        - $ref: '#/components/schemas/ContentNavEntity'
        - $ref: '#/components/schemas/CommentEntity'
