    get:
      operationId: getLocalContentFile
      summary: Serves a content file of the local storage adapter through its signed URL.
      description: The signature is the credential; the cloud adapter issues no such URLs, so it answers 404.
      tags: [files]
      x-opt2-transport: service
      x-opt2-public: true
      security: []
      parameters:
        - name: expires
          in: query
          required: true
          description: Expiry in epoch seconds.
          schema:
            type: integer
            minimum: 0
        - name: sig
          in: query
          required: true
          description: Lowercase hex HMAC-SHA256 over the bucket, key, expiry and any disposition.
          schema:
            type: string
            pattern: ^[0-9a-f]{64}$
        - name: disposition
          in: query
          required: false
          description: Signed Content-Disposition of the download.
          schema:
            type: string
      responses:
        '200':
          description: The object bytes under their stored content type.
          headers:
            Content-Disposition:
              description: The signed `disposition`, when the URL carries one.
              schema:
                type: string
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/Forbidden'
          description: The signature is malformed, wrong or expired.
        '404':
          $ref: '#/components/responses/AdminNotFound'
          description: No object is stored under the key, or the storage adapter is not local.
