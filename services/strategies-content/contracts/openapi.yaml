tags:
  - name: legacy-api
    description: Masa JSON, AJAX, REST, feed and remote-CFC routes this service serves once cut over.
  - name: files
    description: File byte streams and signed downloads.
  - name: content
    description: Site Manager, content edit, history and form responses.
  - name: changesets
    description: Change sets.
  - name: comments
    description: Comment moderation.
  - name: categories
    description: Categories.
  - name: feeds
    description: Collections and remote feed imports.
  - name: approval-chains
    description: Approval chains.
  - name: forms
    description: Form import.
  - name: raw
    description: Legacy fragment, JSON and download responses relayed unchanged by web.
  - name: internal
    description: Calls from other services.
  - name: migration
    description: Owner endpoints the migration service calls.
  - name: events
    description: Pub/Sub push deliveries.
  - name: tasks
    description: Cloud Tasks deliveries and queue control.
  - name: health
    description: Liveness probe.
