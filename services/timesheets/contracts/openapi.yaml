# SYNTHETIC: timesheets - no Masa equivalent; legacy oracle in legacy-fixtures/
openapi: 3.1.0
info:
  title: timesheets
  version: 1.0.0
  description: 'SYNTHETIC: timesheets - no Masa equivalent; legacy oracle in legacy-fixtures/'
  x-source-sha: 696383140578f8dea3ece26f80cd7bfb370ddf0f
servers:
  - url: http://127.0.0.1:8118
    description: Local service
x-opt2-calls: [identity, reporting]
tags:
  - name: fixture
    description: Fixture routes, answered as `legacy-fixtures/cfml/modules/timesheets.cfc` answers them.
  - name: v1
    description: JSON API of the OPT-2 timesheets screens and reporting; a breaking change takes a /v2/ prefix.
  - name: internal
    description: Service-to-service reads of reporting's export runs.
  - name: events
    description: Pub/Sub push deliveries of the consumed topics.
  - name: migration
    description: Migration-kit endpoints of the owned units.
  - name: platform
    description: Platform health probe.
paths:
