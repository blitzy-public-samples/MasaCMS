            pattern: '^(0|[1-9][0-9]*):(0|[1-9][0-9]*)$'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: One page of changes with their legacy projections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/migration/position:
    get:
      operationId: migrationPosition
      summary: Reports the current write position and the outbox and inbox drain counts.
      tags: [migration]
      x-opt2-transport: service
      x-opt2-requires:
        - platform.migration
      security: [{invocationCredential: []}]
      parameters:
        - name: eventIds
          in: query
          required: false
          description: Comma-separated event ids whose inbox receipts are reported.
          schema:
            type: string
        - name: publishedTopics
          in: query
          required: false
          description: Comma-separated topics whose published outbox events are listed in `published`.
          schema:
            type: string
      responses:
        '200':
          description: The owner's position.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/migration/watermark:
    get:
      operationId: migrationWatermarkGet
      summary: Lists feed watermarks, optionally for one legacy table or direction.
      tags: [migration]
      x-opt2-transport: service
      x-opt2-requires:
        - platform.migration
      security: [{invocationCredential: []}]
      parameters:
        - name: legacyTable
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: direction
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/WatermarkDirection'
      responses:
        '200':
          description: Watermarks ordered by legacy table and direction.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WatermarkRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: migrationWatermarkPost
      summary: Records the feed watermark of one legacy table and direction.
      tags: [migration]
      x-opt2-transport: service
      x-opt2-requires:
        - platform.migration
      security: [{invocationCredential: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatermarkInput'
      responses:
        '200':
          description: The stored watermark.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatermarkRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/migration/gate:
    post:
      operationId: migrationGate
      summary: Closes, re-phases, opens or reads the unit gates of this owner.
      tags: [migration]
      x-opt2-transport: service
      x-opt2-requires:
        - platform.migration
      security: [{invocationCredential: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GateRequest'
      responses:
        '200':
          description: The gates after the operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Another holder owns a gate, so the compare-and-set was refused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GateConflict'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
          description: The gates could not close within the wait budget.
  /internal/v1/events/identity.programs-sites.site.changed.v1:
    post:
      operationId: pushSiteChanged
      summary: Receives push deliveries of `programs-sites.site.changed.v1` into identity's tenant registry.
      tags: [events]
      x-opt2-transport: pubsub-push
      x-opt2-requires:
        - service:pubsub-invoker
      security: [{pubsubPushOidc: []}, {localPushKey: []}]
      parameters:
        - $ref: '#/components/parameters/PushKey'
      requestBody:
        required: true
        description: Message data is an event envelope whose payload follows `services/programs-sites/contracts/events/programs-sites.site.changed.v1.json`.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushBody'
      responses:
        '204':
          description: Acknowledged; the delivery was applied, already applied, or dead-lettered.
        '400':
          description: Not a push body; a nack.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
          description: Processing failed; a nack, redelivered by Pub/Sub.
        '503':
          $ref: '#/components/responses/Unavailable'
          description: A unit gate or the database is unavailable; a nack, redelivered by Pub/Sub.
  /internal/v1/events/identity.people.person.changed.v1:
    post:
      operationId: pushPersonChanged
      summary: Receives push deliveries of `people.person.changed.v1` into identity's person contact projection.
      tags: [events]
      x-opt2-transport: pubsub-push
      x-opt2-requires:
        - service:pubsub-invoker
      security: [{pubsubPushOidc: []}, {localPushKey: []}]
      parameters:
        - $ref: '#/components/parameters/PushKey'
      requestBody:
        required: true
        description: Message data is an event envelope whose payload follows `services/people/contracts/events/people.person.changed.v1.json`.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushBody'
      responses:
        '204':
          description: Acknowledged; the delivery was applied, already applied, stale, or dead-lettered.
        '400':
          description: Not a push body; a nack.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
          description: Processing failed; a nack, redelivered by Pub/Sub.
        '503':
          $ref: '#/components/responses/Unavailable'
          description: A unit gate or the database is unavailable; a nack, redelivered by Pub/Sub.
  /internal/v1/outbox/sweep:
    post:
      operationId: outboxSweep
      summary: Creates the next sweep task, then publishes every unpublished outbox row per registry tenant.
      tags: [tasks]
      x-opt2-transport: cloud-tasks
      x-opt2-requires:
        - service:tasks-invoker
      security: [{tasksInvokerOidc: []}]
      parameters:
        - $ref: '#/components/parameters/CloudTasksTaskName'
        - $ref: '#/components/parameters/CloudTasksQueueName'
        - $ref: '#/components/parameters/CloudTasksRetryCount'
        - $ref: '#/components/parameters/CloudTasksExecutionCount'
        - $ref: '#/components/parameters/CloudTasksEta'
      requestBody:
        $ref: '#/components/requestBodies/SystemTask'
      responses:
        '200':
          description: The sweep totals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SweepResult'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: A malformed task body, or one carrying a tenant.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
          description: The sweep failed, so Cloud Tasks retries this task.
        '503':
          $ref: '#/components/responses/Unavailable'
          description: The successor task could not be created, so Cloud Tasks retries this one.
  /internal/v1/task-queues/{queue}/pause:
    parameters:
      - $ref: '#/components/parameters/Queue'
    post:
      operationId: pauseTaskQueue
      summary: Pauses dispatch from a queue this service creates tasks on.
      tags: [tasks]
      x-opt2-transport: service
      x-opt2-requires:
        - platform.migration
        - platform.operator
      security: [{invocationCredential: []}]
      responses:
        '200':
          $ref: '#/components/responses/QueueControlled'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: The queue is not one this service creates tasks on.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/task-queues/{queue}/resume:
    parameters:
      - $ref: '#/components/parameters/Queue'
    post:
      operationId: resumeTaskQueue
      summary: Resumes dispatch from a queue this service creates tasks on.
      tags: [tasks]
      x-opt2-transport: service
      x-opt2-requires:
        - platform.migration
        - platform.operator
      security: [{invocationCredential: []}]
      responses:
        '200':
          $ref: '#/components/responses/QueueControlled'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: The queue is not one this service creates tasks on.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/task-queues/{queue}/ensure:
    parameters:
      - $ref: '#/components/parameters/Queue'
    post:
      operationId: ensureTaskQueue
      summary: Ensures a recurring chain this service creates has a live task.
      tags: [tasks]
      x-opt2-transport: service
      x-opt2-requires:
        - platform.migration
        - platform.operator
      security: [{invocationCredential: []}]
      responses:
        '200':
          $ref: '#/components/responses/QueueControlled'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: The queue is not a recurring chain this service creates.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'

components:
  securitySchemes:
    userToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Site-scoped user token in `Authorization`, minted by identity and attached by the gateway.
    invocationCredential:
      type: apiKey
      in: header
      name: X-Serverless-Authorization
      description: Caller's invocation credential; a Google-signed ID token in the cloud, a local service token locally.
    pubsubPushOidc:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC token of `pubsub-invoker` in `Authorization`, addressed to the push endpoint.
    localPushKey:
      type: apiKey
      in: query
      name: key
      description: Local emulator push key, compared in constant time.
    tasksInvokerOidc:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC token of `tasks-invoker` in `Authorization` in the cloud; a local `tasks-invoker` service token locally.
  headers:
    Generator:
      description: Legacy generator header.
      schema:
        type: string
        const: Masa CMS 7.6.1
    StrictTransportSecurity:
      description: Legacy HSTS header.
      schema:
        type: string
        const: max-age=1200
    ETag:
      description: Uppercase hex SHA-256 of the exact body, unquoted, as ColdFusion `hash()` computes it.
      schema:
        type: string
        pattern: '^[0-9A-F]{64}$'
    AccessControlAllowOrigin:
      description: The request `Origin`, echoed when its host is a site domain, a domain alias or a sub-domain of one.
      schema:
        type: string
    AccessControlAllowCredentials:
      description: Sent with an echoed origin.
      schema:
        type: string
        const: 'true'
    WWWAuthenticate:
      description: Challenge legacy sets before the failure; the `invalid_grant_type` value keeps legacy's missing closing quote.
      schema:
        type: string
        examples:
          - Basic
          - 'Bearer error="invalid_access_token"'
          - Bearer
          - 'Bearer error="invalid_client_credentials"'
          - 'Bearer error="invalid_authorization_code"'
          - 'Bearer error="invalid_client_refresh_token"'
          - 'Bearer error="invalid_grant_type'
    XOpt2WritePosition:
      description: Committed write positions `<owner>=<xid>[,<owner>=<xid>…]`; the gateway strips it from client responses.
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]*=[0-9]+(,[a-z0-9][a-z0-9-]*=[0-9]+)*$'
    SetCookie:
      description: Cookies in legacy form, such as the session cookies `CFID`, `CFTOKEN` and `JSESSIONID` or the remember-me `userid` and `userHash`.
      schema:
        type: string
        examples:
          - CFID=1000;path=/;HttpOnly;
    UsersCsvDisposition:
      description: Legacy download disposition.
      schema:
        type: string
        const: attachment;filename=users.csv
  parameters:
    LegacySiteId:
      name: siteid
      in: path
      required: true
      description: Legacy site id, equal to the token's `site` when a user is present (403 otherwise); legacy serves a value that names no site under `default`, and reads a method name here as the method.
      schema:
        type: string
        minLength: 1
        examples:
          - default
    LegacySegment:
      name: segment
      in: path
      required: true
      description: 'Segment after the site id: an identity method (`login`, `logout`, `generateCSRFTokens`, `findCurrentUser`, `validateEmail`) or the entity `group` or `groups`; on REST also `oauth`, `oauth2` or `tokeninfo`.'
      schema:
        type: string
        minLength: 1
        examples:
          - group
    LegacyItem:
      name: item
      in: path
      required: true
      description: A group id, a comma list of ids, `new`, `properties` or `permissions`, or the first value of a path parameter pair; on REST also the segment after `oauth` or `oauth2`, or `tokeninfo`.
      schema:
        type: string
        minLength: 1
    LegacySuffix:
      name: suffix
      in: path
      required: true
      description: '`permissions` after a 35-character group id, or a path parameter; longer path-pair forms resolve the same way on the same Fastify route.'
      schema:
        type: string
        minLength: 1
        examples:
          - permissions
    LegacyMethod:
      name: method
      in: query
      required: false
      description: Method to call, also read from a form or JSON body field; an entity-generic method addresses `entityname`, or the entity of a dotted `group.<method>`.
      schema:
        type: string
        examples:
          - login
          - logout
          - generateCSRFTokens
          - findCurrentUser
          - validateEmail
          - findOne
          - findMany
          - findAll
          - findNew
          - findQuery
          - findProperties
          - findPermissions
          - save
          - validate
          - group.findOne
    LegacyEntityName:
      name: entityname
      in: query
      required: false
      description: Entity an entity-generic `method` addresses; `group` or `groups` for identity.
      schema:
        type: string
        examples:
          - group
    MethodOverrideHeader:
      name: X-HTTP-Method-Override
      in: header
      required: false
      description: Verb legacy resolves the entity operation with in place of the request method.
      schema:
        type: string
        examples:
          - PUT
          - DELETE
    CsrfTokenHeader:
      name: X-csrf_token
      in: header
      required: false
      description: CSRF token, an alternative to the `csrf_token` field.
      schema:
        type: string
    CsrfExpiresHeader:
      name: X-csrf_token_expires
      in: header
      required: false
      description: CSRF token expiry `yyMMddHHnnsslll`, an alternative to the `csrf_token_expires` field.
      schema:
        type: string
    XClientId:
      name: X-client_id
      in: header
      required: false
      description: OAuth client id, an alternative to the `client_id` parameter.
      schema:
        type: string
    XClientIdDash:
      name: X-client-id
      in: header
      required: false
      description: OAuth client id; read after `X-client_id`, so it wins.
      schema:
        type: string
    XClientSecret:
      name: X-client_secret
      in: header
      required: false
      description: OAuth client secret, an alternative to the `client_secret` parameter.
      schema:
        type: string
    XClientSecretDash:
      name: X-client-secret
      in: header
      required: false
      description: OAuth client secret; read after `X-client_secret`, so it wins.
      schema:
        type: string
    XAccessToken:
      name: X-access_token
      in: header
      required: false
      description: OAuth access token, an alternative to the `access_token` parameter.
      schema:
        type: string
    XAccessTokenDash:
      name: X-access-token
      in: header
      required: false
      description: OAuth access token; read after `X-access_token`, so it wins.
      schema:
        type: string
    SiteIdQuery:
      name: siteid
      in: query
      required: false
      description: Legacy site id, equal to the token's `site` (403 otherwise); the token's site when omitted.
      schema:
        type: string
        minLength: 1
        examples:
          - tenant-a
    IsPublicQuery:
      name: ispublic
      in: query
      required: false
      description: '`0` for system groups, `1` for member groups; a non-boolean value reads as 1.'
      schema:
        type: string
        default: '1'
        examples:
          - '0'
          - '1'
    GroupId:
      name: groupId
      in: path
      required: true
      description: Group `UserID`.
      schema:
        $ref: '#/components/schemas/CfUuid'
    UserId:
      name: userId
      in: path
      required: true
      description: User `UserID`.
      schema:
        $ref: '#/components/schemas/CfUuid'
    ContentId:
      name: contentId
      in: path
      required: true
      description: Content node `ContentID`.
      schema:
        type: string
        minLength: 35
        maxLength: 35
    ModuleId:
      name: moduleId
      in: path
      required: true
      description: Module id; core modules are 32 zeros and three digits.
      schema:
        type: string
        minLength: 35
        maxLength: 35
        examples:
          - '00000000000000000000000000000000008'
    ClientId:
      name: clientId
      in: path
      required: true
      description: OAuth `clientid`; the edit screen generates one for a new client.
      schema:
        $ref: '#/components/schemas/CfUuid'
    SessionId:
      name: sid
      in: path
      required: true
      description: Identity session id, the user token's `sid`.
      schema:
        type: string
        minLength: 1
    OperationId:
      name: operationId
      in: path
      required: true
      description: Roster write-protocol operation id, assigned by people.
      schema:
        $ref: '#/components/schemas/CfUuid'
    Queue:
      name: queue
      in: path
      required: true
      description: A queue this service creates tasks on.
      schema:
        type: string
        enum:
          - identity-outbox-sweep
    MigrationTenantId:
      name: tenantId
      in: query
      required: false
      description: Tenant UUID; exactly one of `tenantId` and `siteId` is required.
      schema:
        type: string
        format: uuid
        pattern: '^([0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[1-8][0-9A-Fa-f]{3}-[89ABab][0-9A-Fa-f]{3}-[0-9A-Fa-f]{12}|00000000-0000-0000-0000-000000000000|[Ff]{8}-[Ff]{4}-[Ff]{4}-[Ff]{4}-[Ff]{12})$'
    MigrationSiteId:
      name: siteId
      in: query
      required: false
      description: Legacy site id resolved to its tenant; exactly one of `tenantId` and `siteId` is required.
      schema:
        type: string
        minLength: 1
    PageLimit:
      name: limit
      in: query
      required: false
      description: Page size, 1 to 10000; 1000 when omitted.
      schema:
        $ref: '#/components/schemas/DigitString'
    PushKey:
      name: key
      in: query
      required: false
      description: Local emulator push key; absent in the cloud.
      schema:
        type: string
    CloudTasksTaskName:
      name: X-CloudTasks-TaskName
      in: header
      required: false
      description: Task id; the body's `name` when absent.
      schema:
        type: string
    CloudTasksQueueName:
      name: X-CloudTasks-QueueName
      in: header
      required: false
      description: Queue name; the body's `queue` when absent.
      schema:
        type: string
    CloudTasksRetryCount:
      name: X-CloudTasks-TaskRetryCount
      in: header
      required: false
      schema:
        type: string
        pattern: '^[0-9]+$'
    CloudTasksExecutionCount:
      name: X-CloudTasks-TaskExecutionCount
      in: header
      required: false
      schema:
        type: string
        pattern: '^[0-9]+$'
    CloudTasksEta:
      name: X-CloudTasks-TaskETA
      in: header
      required: false
      description: Scheduled time in epoch seconds.
      schema:
        type: string
  requestBodies:
    LegacyCall:
      required: false
      description: Merged with the query string as legacy merges url, form and a JSON body; later sources win.
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/LegacyCallBody'
        multipart/form-data:
          schema:
            $ref: '#/components/schemas/LegacyCallBody'
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyCallBody'
    CsrfOnly:
      required: false
      description: The CSRF token fields, unless the `X-csrf_token` headers carry them.
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/CsrfFields'
        application/json:
          schema:
            $ref: '#/components/schemas/CsrfFields'
    SystemTask:
      required: true
      description: Task wire body of a tenant-less system task.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SystemTaskWireBody'
  responses:
    LegacyOk:
      description: The method result or group entity in the legacy envelope; a login or logout also writes its legacy cookies.
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AccessControlAllowOrigin'
        Access-Control-Allow-Credentials:
          $ref: '#/components/headers/AccessControlAllowCredentials'
        Set-Cookie:
          $ref: '#/components/headers/SetCookie'
        X-Opt2-Write-Position:
          $ref: '#/components/headers/XOpt2WritePosition'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/IdentityEnvelope'
        application/x-shunter+json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/IdentityEnvelope'
    RestOk:
      description: The legacy envelope, or the bare token object on `oauth2` paths, for `authorization_code` and for `tokeninfo`; other `oauth` grants answer the `getOAuthToken` envelope.
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AccessControlAllowOrigin'
        Access-Control-Allow-Credentials:
          $ref: '#/components/headers/AccessControlAllowCredentials'
        X-Opt2-Write-Position:
          $ref: '#/components/headers/XOpt2WritePosition'
      content:
        application/json;charset=utf-8:
          schema:
            anyOf:
              - $ref: '#/components/schemas/IdentityEnvelope'
              - $ref: '#/components/schemas/OAuthTokenEnvelope'
              - $ref: '#/components/schemas/OAuthTokenResponse'
              - $ref: '#/components/schemas/OAuthTokenInfoResponse'
    LegacyBadRequest:
      description: 'Legacy 400: `invalidParameters` (also tokeninfo outside REST or for an unknown or expired token), `invalidMethodCall`, `invalidEntityCall`, `badRequest` (`validateEmail` outside a valid request) or, on a session-mode save, `invalidTokens`.'
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AccessControlAllowOrigin'
        Access-Control-Allow-Credentials:
          $ref: '#/components/headers/AccessControlAllowCredentials'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyUnauthorized:
      description: 'Legacy 401: `authorization` (`invalid_request`, `Insufficient Account Permissions`), including REST requests without credentials and refused OAuth grants, or `invalidAccessToken` and `accessTokenExpired` (`invalid_token`) for a bad access token.'
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticate'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyForbidden:
      description: A group save whose `data.errors` is non-empty, or a `siteid` other than the token's site.
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json;charset=utf-8:
          schema:
            anyOf:
              - $ref: '#/components/schemas/IdentityEnvelope'
              - $ref: '#/components/schemas/LegacyError'
    LegacyNotFound:
      description: Legacy 404 (`mura404`) in the error envelope.
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyServerError:
      description: 'Legacy 500 `server_error`; a bad or expired refresh token answers it with `WWW-Authenticate: Bearer error="invalid_client_credentials"`, because legacy throws the uncaught type `invalid_token`.'
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticate'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyError'
    Unavailable:
      description: Legacy-shaped 503 after a fail-closed or wait-timeout condition.
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyUnavailable'
    BadRequest:
      description: 'Legacy 400: `invalidParameters`, `badRequest` or `invalidTokens`.'
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyError'
    Unauthorized:
      description: 'Legacy 401: `authorization` without a qualifying credential, or `invalidAccessToken`/`accessTokenExpired` for a bad user token.'
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticate'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyError'
    Forbidden:
      description: The verified identities hold none of the required roles, or a supplied `siteid` differs from the token's site.
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyError'
    NotFound:
      description: Legacy 404 in the error envelope.
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyError'
    ServerError:
      description: Legacy 500 `server_error`.
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyError'
    GroupWritten:
      description: The group after the request; validation errors leave `errors` non-empty and the form re-renders with them.
      headers:
        X-Opt2-Write-Position:
          $ref: '#/components/headers/XOpt2WritePosition'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GroupWriteResult'
    MembershipWritten:
      description: Whether the membership changed; a missing or invalid CSRF token on an add writes nothing.
      headers:
        X-Opt2-Write-Position:
          $ref: '#/components/headers/XOpt2WritePosition'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WriteResult'
    QueueControlled:
      description: The queue's state after the operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QueueControlResult'
    AccountOperationStepped:
      description: The operation's state after the step; repeating a step that already took effect returns the same state.
      headers:
        X-Opt2-Write-Position:
          $ref: '#/components/headers/XOpt2WritePosition'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountOperationStep'
    AccountOperationConflict:
      description: The operation's state does not allow the step, such as a commit after an abort.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountOperation'
  schemas:
    CfUuid:
      type: string
      description: ColdFusion `createUUID()` id; legacy compares ids ignoring case.
      minLength: 35
      maxLength: 35
      pattern: '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{16}$'
    SiteId:
      type: string
      description: Legacy site id.
      minLength: 1
      examples:
        - default
        - tenant-a
    TenantId:
      type: string
      description: Tenant UUID.
      format: uuid
    Xid8:
      type: string
      description: PostgreSQL `xid8` of a committed transaction, in decimal.
      pattern: '^[0-9]+$'
    DigitString:
      type: string
      description: Non-negative decimal integer without leading zeros.
      pattern: '^(0|[1-9][0-9]{0,14})$'
    LocalTimestamp:
      type: string
      description: Wall-clock time in the legacy server's zone, without an offset.
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}$'
      examples:
        - '2026-06-30T09:15:00.000'
    NullableTimestamp:
      oneOf:
        - $ref: '#/components/schemas/LocalTimestamp'
        - type: 'null'
    WallClock:
      type: string
      description: Wall-clock time without a zone, `YYYY-MM-DD HH:MM[:SS[.fff]]` with a space or `T`.
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}[ T][0-9]{2}:[0-9]{2}(:[0-9]{2}(\.[0-9]+)?)?$'
    NullableString:
      type:
        - string
        - 'null'
    NullableInteger:
      type:
        - integer
        - 'null'
    FormValue:
      description: One form field as a CFML scope holds it; JSON callers may send numbers and booleans.
      type:
        - string
        - number
        - boolean
    LegacyEnvelope:
      type: object
      description: Legacy JSON API success envelope; `params` is absent under `suppressAPIParams`, and `data` keys move to the top level when `useDataNamespace` is false.
      required:
        - apiversion
        - method
      additionalProperties: true
      properties:
        apiversion:
          type: string
          const: v1
        method:
          type: string
        params:
          type: object
        data: {}
        layout:
          description: The shunter layout, copied from `data.layout` when `data.shunter` is true.
    LegacyErrorBody:
      type: object
      description: Error of a legacy JSON API catch block; types map to status and code as authorization 401 and invalidAccessToken and accessTokenExpired 401 invalid_token, disabled, invalidParameters, invalidEntityCall, invalidMethodCall, badRequest and invalidTokens 400 invalid_request, and anything else 500 server_error.
      required:
        - message
        - code
      additionalProperties: true
      properties:
        message:
          type: string
          examples:
            - Insufficient Account Permissions
            - Invalid Access Token
            - Access Token Expired
            - The JSON API disabled
            - Invalid parameters
            - Invalid reference to persisted entity
            - Invalid method call
            - Bad Request
            - Invalid CSRF tokens
            - Unhandled Exception
        code:
          type: string
          enum:
            - invalid_request
            - invalid_token
            - server_error
        stacktrace: {}
    LegacyError:
      type: object
      description: Legacy JSON API error envelope.
      required:
        - apiversion
        - method
        - error
      additionalProperties: true
      properties:
        apiversion:
          type: string
          const: v1
        method:
          type: string
        params:
          type: object
        error:
          $ref: '#/components/schemas/LegacyErrorBody'
    LegacyUnavailable:
      type: object
      description: Legacy JSON API `server_error` envelope sent with status 503.
      required:
        - apiversion
        - method
        - error
      additionalProperties: false
      properties:
        apiversion:
          type: string
          const: v1
        method:
          type: string
        params:
          type: object
        error:
          type: object
          required:
            - message
            - code
          additionalProperties: false
          properties:
            message:
              type: string
              const: Unhandled Exception
            code:
              type: string
              const: server_error
    LegacyErrors:
      type: object
      description: Field name to legacy validation message, as the admin views render them.
      additionalProperties:
        type: string
    LegacyCallBody:
      type: object
      description: A JSON API call; method arguments and entity fields are further parameters.
      additionalProperties: true
      properties:
        method:
          type: string
        entityname:
          type: string
        siteid:
          type: string
        csrf_token:
          type: string
        csrf_token_expires:
          type: string
        client_id:
          type: string
        client_secret:
          type: string
        grant_type:
          type: string
          examples:
            - client_credentials
            - password
            - authorization_code
            - refresh_token
        access_token:
          type: string
        refresh_token:
          type: string
        username:
          type: string
        password:
          type: string
          format: password
        code:
          type: string
        redirect_uri:
          type: string
    IdentityEnvelope:
      description: Legacy envelope of an identity method or group operation.
      allOf:
        - $ref: '#/components/schemas/LegacyEnvelope'
        - type: object
          properties:
            data:
              anyOf:
                - $ref: '#/components/schemas/LoginMethodData'
                - $ref: '#/components/schemas/LogoutMethodData'
                - $ref: '#/components/schemas/CsrfTokenPair'
                - $ref: '#/components/schemas/ValidateEmailData'
                - $ref: '#/components/schemas/CurrentUserData'
                - $ref: '#/components/schemas/JsonApiGroupCollection'
                - $ref: '#/components/schemas/JsonApiGroup'
                - $ref: '#/components/schemas/JsonApiEntityMeta'
    LoginMethodData:
      type: object
      description: Result of `login`, which validates CSRF context `login`; `Invalid CSFR Tokens` keeps legacy's spelling.
      required:
        - status
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - success
            - failed
            - Invalid CSFR Tokens
    LogoutMethodData:
      type: object
      description: Result of `logout`.
      required:
        - status
      additionalProperties: false
      properties:
        status:
          type: string
          const: success
    CsrfTokenPair:
      type: object
      description: Result of `generateCSRFTokens` for its `context` argument.
      required:
        - csrf_token
        - csrf_token_expires
      additionalProperties: false
      properties:
        csrf_token:
          type: string
          pattern: '^[0-9A-F]{64}$'
        csrf_token_expires:
          type: string
          description: Expiry `yyMMddHHnnsslll`, three hours after issue.
          pattern: '^[0-9]{15}$'
    ValidateEmailData:
      description: 'Result of `validateEmail`: the BriteVerify response body as legacy re-serializes it, or `{"status": "invalid"}` when it cannot.'
      anyOf:
        - type: string
        - type: object
          required:
            - status
          additionalProperties: false
          properties:
            status:
              type: string
              const: invalid
    CurrentUserData:
      type: object
      description: Result of `findCurrentUser`, the current user as `findOne` serializes it, plus the session's memberships.
      required:
        - memberships
        - membershipids
        - isloggedin
      additionalProperties: true
      properties:
        memberships:
          type: array
          items:
            type: string
        membershipids:
          type: array
          items:
            type: string
        isloggedin:
          type: boolean
    JsonApiGroup:
      type: object
      description: A group as the JSON API serializes it; a save adds `saveErrors` and `errors`.
      additionalProperties: true
      properties:
        id:
          type: string
        userid:
          type: string
        groupname:
          $ref: '#/components/schemas/NullableString'
        siteid:
          type: string
        ispublic:
          type: integer
        entityname:
          type: string
          const: group
        isnew:
          type: integer
          enum:
            - 0
            - 1
        links:
          type: object
          additionalProperties:
            type: string
        saveErrors: {}
        errors:
          $ref: '#/components/schemas/LegacyErrors'
    JsonApiGroupCollection:
      type: object
      description: A paged group collection as the JSON API serializes it.
      required:
        - items
      additionalProperties: true
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/JsonApiGroup'
        links:
          type: object
          additionalProperties:
            type: string
        pageindex:
          type: integer
        itemsperpage:
          type: integer
        totalpages:
          type: integer
        totalitems:
          type: integer
    JsonApiEntityMeta:
      type: object
      description: Result of `findProperties`, `findPermissions` or `validate` on the group entity.
      additionalProperties: true
    OAuthTokenInfo:
      type: object
      description: The session `mura` struct the token carries, without `csrfsecretkey`, `csrfusedtokens`, `isloggedin`, `lastlogin` and `password`; empty when the token holds no session.
      additionalProperties: true
    OAuthTokenResponse:
      type: object
      description: Bare OAuth token object of `oauth2` paths and of the `authorization_code` grant.
      required:
        - token_type
        - access_token
        - expires_in
        - expires_at
        - refresh_token
        - info
      additionalProperties: false
      properties:
        token_type:
          type: string
          const: Bearer
        access_token:
          type: string
        expires_in:
          type: integer
          description: Seconds until expiry.
        expires_at:
          type: integer
          description: Expiry in epoch seconds.
        refresh_token:
          type: string
        info:
          $ref: '#/components/schemas/OAuthTokenInfo'
    OAuthTokenEnvelope:
      type: object
      description: Token envelope of the `password`, `client_credentials` and `refresh_token` grants on `oauth` paths.
      required:
        - apiversion
        - method
        - data
      additionalProperties: false
      properties:
        apiversion:
          type: string
          const: v1
        method:
          type: string
          const: getOAuthToken
        data:
          $ref: '#/components/schemas/OAuthTokenResponse'
    OAuthTokenInfoResponse:
      type: object
      description: Bare `tokeninfo` answer for the `access_token` and `client_id` URL parameters.
      required:
        - token_type
        - access_token
        - expires_in
        - expires_at
        - info
      additionalProperties: false
      properties:
        token_type:
          type: string
          const: Bearer
        access_token:
          type: string
        expires_in:
          type: integer
        expires_at:
          type: integer
        info:
          $ref: '#/components/schemas/OAuthTokenInfo'
    SessionUser:
      type: object
      description: '`session.mura` as legacy holds it, without `password`, `csrfsecretkey` and `csrfusedtokens`; anonymous sessions carry empty values.'
      required:
        - isLoggedIn
        - userID
      additionalProperties: true
      properties:
        isLoggedIn:
          type: boolean
        userID:
          type: string
        username:
          type: string
        siteID:
          type: string
        subtype:
          type: string
        fname:
          type: string
        lname:
          type: string
        email:
          type: string
        remoteID:
          type: string
        company:
          type: string
        lastlogin:
          type: string
        passwordCreated:
          type: string
        memberships:
          type: string
          description: Comma list of membership entries such as `S2`, `S2IsPrivate` or `Admin;<privateUserPoolID>;0`.
        membershipids:
          type: string
          description: Comma list of group ids.
        showTrace:
          type: boolean
    CurrentSession:
      type: object
      required:
        - sessionId
        - epoch
        - user
        - roles
        - mfaPending
        - blockLoginUntil
      additionalProperties: false
      properties:
        sessionId:
          $ref: '#/components/schemas/NullableString'
        epoch:
          $ref: '#/components/schemas/NullableInteger'
        user:
          $ref: '#/components/schemas/SessionUser'
        roles:
          type: array
          description: Roles of the login-time snapshot.
          items:
            type: string
        mfaPending:
          type: boolean
          description: True while an MFA challenge awaits its code.
        blockLoginUntil:
          description: End of the login block after too many strikes.
          $ref: '#/components/schemas/NullableTimestamp'
    SessionSites:
      type: object
      required:
        - sites
      additionalProperties: false
      properties:
        sites:
          type: array
          items:
            type: object
            required:
              - siteID
              - site
            additionalProperties: false
            properties:
              siteID:
                type: string
              site:
                type: string
    AdminSessionState:
      type: object
      description: Admin session-scope values the request set-up and screens keep between requests, under their legacy `session` names.
      additionalProperties: false
      properties:
        siteid:
          type: string
        userFilesPath:
          type: string
        topID:
          type: string
        openSectionList:
          type: string
        moduleid:
          type: string
        keywords:
          type: string
        rb:
          type: string
          description: Resource bundle locale of the admin labels.
        locale:
          type: string
          description: Java locale of dates.
        dateKeyFormat:
          type: string
        localeHasDayParts:
          type: boolean
        dashboardSpan:
          type: integer
        paramArray:
          type: array
          description: Criteria of the users advanced search.
          items:
            type: object
            required:
              - Field
              - Relationship
              - Criteria
              - Condition
            additionalProperties: false
            properties:
              Field:
                type: string
              Relationship:
                type: string
              Criteria:
                type: string
              Condition:
                type: string
        paramCount:
          type: integer
        paramCircuit:
          type: string
        paramCategories:
          type: string
        paramGroups:
          type: string
        inActive:
          type: string
        membersOnly:
          type: string
        visitorStatus:
          type: string
        frontEndProxyLoc:
          type: string
        flash:
          type: object
          description: FW/1 preserved request contexts by preserve key (`session['__fw1<key>']`).
          additionalProperties:
            type: object
            additionalProperties:
              type: string
        nextPreserveKey:
          type: integer
          description: '`session.__fw1NextPreserveKey`.'
    LoginRequest:
      type: object
      description: The admin login form, or the MFA challenge form when `attemptChallenge` is true.
      additionalProperties:
        $ref: '#/components/schemas/FormValue'
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        siteid:
          type: string
        rememberMe:
          $ref: '#/components/schemas/FormValue'
        returnUrl:
          type: string
        contentid:
          type: string
        linkServID:
          type: string
        isAdminLogin:
          $ref: '#/components/schemas/FormValue'
        compactDisplay:
          $ref: '#/components/schemas/FormValue'
        attemptChallenge:
          $ref: '#/components/schemas/FormValue'
        authcode:
          type: string
        rememberdevice:
          $ref: '#/components/schemas/FormValue'
        csrf_token:
          type: string
        csrf_token_expires:
          type: string
    LoginOutcome:
      type: object
      description: '`location` is the exact redirect legacy answers with; `csrf-invalid` leaves the session unchanged and `blocked` is a failure while the strike block holds.'
      required:
        - outcome
        - location
        - epoch
      additionalProperties: false
      properties:
        outcome:
          type: string
          enum:
            - success
            - failed
            - challenge
            - blocked
            - csrf-invalid
        location:
          type: string
          examples:
            - ./
            - ./?muraAction=cLogin.main&display=login&status=failed&rememberMe=0&contentid=&LinkServID=&returnURL=&compactDisplay=false
            - ./?muraAction=clogin.main
        epoch:
          $ref: '#/components/schemas/NullableInteger'
    AdminRedirect:
      type: object
      description: A legacy admin redirect, rendered by the admin URL builder.
      required:
        - action
        - params
      additionalProperties: false
      properties:
        action:
          type: string
          examples:
            - home.redirect
            - cUsers.list
        params:
          type: object
          additionalProperties:
            type: string
    LogoutResult:
      type: object
      required:
        - redirect
      additionalProperties: false
      properties:
        redirect:
          $ref: '#/components/schemas/AdminRedirect'
    CsrfFields:
      type: object
      additionalProperties: true
      properties:
        csrf_token:
          type: string
        csrf_token_expires:
          type: string
    CsrfTokensRequest:
      type: object
      required:
        - contexts
      additionalProperties: false
      properties:
        contexts:
          type: array
          minItems: 1
          items:
            type: string
    CsrfTokenSet:
      type: object
      required:
        - tokens
      additionalProperties: false
      properties:
        tokens:
          type: array
          items:
            type: object
            required:
              - context
              - csrf_token
              - csrf_token_expires
            additionalProperties: false
            properties:
              context:
                type: string
              csrf_token:
                type: string
                pattern: '^[0-9A-F]{64}$'
              csrf_token_expires:
                type: string
                pattern: '^[0-9]{15}$'
    LoginMailRequest:
      type: object
      required:
        - email
      additionalProperties: true
      properties:
        email:
          type: string
        siteid:
          type: string
          description: Site whose user pools are searched and whose name signs the mail; empty for the admin form.
    LoginMailResult:
      type: object
      required:
        - status
      additionalProperties: false
      properties:
        status:
          type: string
          description: The `login.messagesent` message key.
          const: messagesent
    WriteResult:
      type: object
      required:
        - written
      additionalProperties: false
      properties:
        written:
          type: boolean
    GroupListItem:
      type: object
      description: One row of a `cusers.list` group list.
      required:
