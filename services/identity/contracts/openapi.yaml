      additionalProperties: false
      properties:
        siteid:
          type: string
        userFilesPath:
          type: string
        topID:
          type: string
        openSectionList:
          type: string
        moduleid:
          type: string
        keywords:
          type: string
        datakeywords:
          type: string
          description: '`session.datakeywords`, the form data manager''s keyword search (carch datamanager.cfm).'
        filterBy:
          type: string
          description: '`session.filterBy`, the field the form data manager''s keyword search filters (carch datamanager.cfm).'
        rb:
          type: string
          description: Resource bundle locale of the admin labels.
        locale:
          type: string
          description: Java locale of dates.
        dateKeyFormat:
          type: string
        localeHasDayParts:
          type: boolean
        dashboardSpan:
          type: integer
        paramArray:
          type: array
          description: Criteria of the users advanced search.
          items:
            type: object
            required:
              - Field
              - Relationship
              - Criteria
              - Condition
            additionalProperties: false
            properties:
              Field:
                type: string
              Relationship:
                type: string
              Criteria:
                type: string
              Condition:
                type: string
        paramCount:
          type: integer
        paramCircuit:
          type: string
        paramCategories:
          type: string
        paramGroups:
          type: string
        inActive:
          type: string
        membersOnly:
          type: string
        visitorStatus:
          type: string
        frontEndProxyLoc:
          type: string
        flash:
          type: object
          description: FW/1 preserved request contexts by preserve key (`session['__fw1<key>']`).
          additionalProperties:
            type: object
            additionalProperties:
              type: string
        nextPreserveKey:
          type: integer
          description: '`session.__fw1NextPreserveKey`.'
        hasdefaultpassword:
          type: boolean
          readOnly: true
          description: '`session.hasdefaultpassword`, which login sets for `admin`/`admin`; readers test its presence.'
        blockLoginUntil:
          type: string
          pattern: '^(|[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3})$'
          description: '`session.blockLoginUntil`, which login sets: `''''` or the strike block''s end as a local timestamp. saveAdminSessionState ignores it; importSessionAdminState stores legacy''s value.'
        moduleTopIds:
          type: object
          description: '`session[''m<moduleid>''].topid` keyed by the legacy session key `m<moduleid>` (carch `before()`).'
          additionalProperties:
            type: string
        mura:
          type: object
          description: '`session.mura` values set since the last login (e.g. `errors`, `objectInstanceId`) under their legacy names; they overlay the login snapshot''s user struct.'
          additionalProperties: true
        muraBase:
          type: object
          writeOnly: true
          description: 'saveAdminSessionState only (importSessionAdminState refuses it): the `mura` the writer read. Identity then applies only the writer''s changes to `mura` against it to the `mura` stored now, under the locked session row, so a value stored since that read stands: keys set to another value or added, and keys of the base removed, at every depth, keys matched ignoring case and kept in their stored spelling.'
          additionalProperties: true
    AdminSessionStateImport:
      type: object
      description: The admin session-scope values a legacy-served request changed, with the bases of its changed `mura` structs.
      additionalProperties: false
      required:
        - values
      properties:
        values:
          $ref: '#/components/schemas/AdminSessionState'
        muraBases:
          type: object
          description: 'By `mura` key, the struct `op=carry` installed and legacy then changed. Identity applies only legacy''s changes against it to the value it stores now: keys legacy set to another value or added, and keys of the base legacy removed, at every depth, keys matched ignoring case and kept in their stored spelling. A struct `mura` value without a base, and any other value, replaces the stored one.'
          additionalProperties:
            type: object
            additionalProperties: true
    LoginRequest:
      type: object
      description: The admin login form, or the MFA challenge form when `attemptChallenge` is true.
      additionalProperties:
        $ref: '#/components/schemas/FormValue'
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        siteid:
          type: string
        rememberMe:
