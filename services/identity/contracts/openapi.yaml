  /v1/sessions/current:
    get:
      operationId: getCurrentSession
      summary: Reads the user struct and login-time roles of the token's session, or the anonymous struct without a token.
      tags: [sessions]
      x-opt2-transport: service
      x-opt2-public: true
      security: [{invocationCredential: []}, {userToken: [], invocationCredential: []}]
      responses:
        '200':
          description: The session as legacy holds it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/sessions/current/sites:
    get:
      operationId: listCurrentSessionSites
      summary: Lists the sites the session may administer, for the site selector and the admin access gate.
      tags: [sessions]
      x-opt2-transport: service
      x-opt2-public: true
      security: [{userToken: [], invocationCredential: []}]
      responses:
        '200':
          description: The sites, in legacy order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionSites'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/sessions/current/admin-state:
    get:
      operationId: getAdminSessionState
      summary: Reads the admin session-scope values the token's session holds; a session that stored none answers `{}`.
      tags: [sessions]
      x-opt2-transport: service
      x-opt2-public: true
      security: [{userToken: [], invocationCredential: []}]
      responses:
        '200':
          description: The stored values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionState'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: No user token, so there is no session.
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: saveAdminSessionState
      summary: Stores each given admin session value in the token's session, replacing that key whole, except a `mura` given with `muraBase`, of which only its changes against that base are stored; absent keys keep their stored value.
      tags: [sessions]
      x-opt2-transport: service
      x-opt2-public: true
      security: [{userToken: [], invocationCredential: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSessionState'
      responses:
        '200':
          description: The stored values after the merge.
          headers:
            X-Opt2-Write-Position:
              $ref: '#/components/headers/XOpt2WritePosition'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: No user token, so there is no session.
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/sessions/login:
    post:
      operationId: login
      summary: Logs the session in as `clogin.login` does, under CSRF context `login`, or attempts an MFA challenge.
      tags: [sessions]
      x-opt2-transport: service
      x-opt2-public: true
      security: [{invocationCredential: []}, {userToken: [], invocationCredential: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
        - $ref: '#/components/parameters/CsrfExpiresHeader'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: The outcome and the redirect legacy answers with.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
            X-Opt2-Write-Position:
              $ref: '#/components/headers/XOpt2WritePosition'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginOutcome'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
          description: The ACF error legacy answers with for an MFA challenge attempt while no MFA login is pending, or a failed login without `isAdminLogin`, whose site `loginURL` identity does not hold.
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/sessions/logout:
    post:
      operationId: logout
      summary: Ends the token's session and the legacy session it maps to, then redirects to `home.redirect`.
      tags: [sessions]
      x-opt2-transport: service
      x-opt2-public: true
      security: [{invocationCredential: []}, {userToken: [], invocationCredential: []}]
      responses:
        '200':
          description: The redirect legacy answers with.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/csrf/tokens:
    post:
      operationId: issueCsrfTokens
      summary: Issues one CSRF token per context from the token's session secret.
      tags: [csrf]
      x-opt2-transport: service
      x-opt2-public: true
      security: [{invocationCredential: []}, {userToken: [], invocationCredential: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CsrfTokensRequest'
      responses:
        '200':
          description: The tokens, in request order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenSet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: No user token, so there is no session secret.
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/login-mail:
    post:
      operationId: requestLoginMail
      summary: Sends the forgot-password login mail to every account with the address, as the login screen's form does.
      description: The answer is the same whether or not an account matched, as legacy always shows `login.messagesent`; with `autoresetpasswords` each matched password is reset first.
