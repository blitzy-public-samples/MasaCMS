      x-opt2-transport: service
      x-opt2-public: true
      security: [{invocationCredential: []}, {userToken: [], invocationCredential: []}]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginMailRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/LoginMailRequest'
      responses:
        '200':
          description: The message the login screen shows.
          headers:
            X-Opt2-Write-Position:
              $ref: '#/components/headers/XOpt2WritePosition'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginMailResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/groups:
    get:
      operationId: listGroups
      summary: Lists the site's system or member groups with member counts, as `cusers.list` shows them.
      description: A caller holding only `m:008` also needs `m:000` on the site, and is otherwise refused with 403. `ispublic` reads as 1 unless the caller is S2 or site admin.
      tags: [groups]
      x-opt2-transport: service
      x-opt2-requires:
        - s2
        - site-admin
        - m:008
      security: [{userToken: [], invocationCredential: []}]
      parameters:
        - $ref: '#/components/parameters/SiteIdQuery'
        - $ref: '#/components/parameters/IsPublicQuery'
        - $ref: '#/components/parameters/ListOffset'
        - $ref: '#/components/parameters/ListLimit'
      responses:
        '200':
          description: One page of the groups, by `Perm` descending, then group name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: createGroup
      summary: Creates a group as `cusers.update` with `type=1` and `action=Add` does, under the new group id as CSRF context.
      description: A caller holding only `m:008` also needs `m:000` on the site, and is otherwise refused with 403.
      tags: [groups]
      x-opt2-transport: service
      x-opt2-requires:
        - s2
        - site-admin
        - m:008
      security: [{userToken: [], invocationCredential: []}]
      parameters:
        - $ref: '#/components/parameters/FormUserIdQuery'
        - $ref: '#/components/parameters/CsrfTokenHeader'
        - $ref: '#/components/parameters/CsrfExpiresHeader'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GroupCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GroupInput'
          application/json:
            schema:
              $ref: '#/components/schemas/GroupCreate'
      responses:
        '200':
          $ref: '#/components/responses/GroupWritten'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
