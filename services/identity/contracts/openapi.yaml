openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: identity
  version: 1.0.0
  description: 'API of the OPT-2 identity service: login, sessions, the CSRF ledger, groups, memberships, permissions, OAuth and site-scoped tokens; a breaking change takes a /v2/ prefix.'
  license:
    name: GPL-2.0-only
    identifier: GPL-2.0-only
  x-source-sha: 696383140578f8dea3ece26f80cd7bfb370ddf0f
servers:
  - url: http://127.0.0.1:8111
    description: local
x-opt2-calls:
  - people
  - gateway
  - strategies-content
  - programs-sites
tags:
  - name: legacy-api
    description: Masa JSON, AJAX and REST API routes identity serves once cut over.
  - name: sessions
    description: Admin login, logout and the current session.
  - name: csrf
    description: CSRF tokens and the cross-side single-use ledger.
  - name: groups
    description: Groups and group memberships; group deletes, and saves with extended attributes or a photo, stay on legacy because they also write content units.
  - name: permissions
    description: Content-node and module permissions; content-node permission saves stay on legacy because they also write the approval-chain assignment.
  - name: oauth-clients
    description: OAuth clients of the Web Services screen.
  - name: jwks
    description: Public keys of the local token signer.
  - name: internal
    description: Calls from the gateway and other services.
  - name: migration
    description: Owner endpoints the migration service calls.
  - name: events
    description: Pub/Sub push deliveries.
  - name: tasks
    description: Cloud Tasks deliveries and queue control.
  - name: health
    description: Liveness probe.
paths:
  /_api/json/v1/{siteid}:
    parameters:
      - $ref: '#/components/parameters/LegacySiteId'
    get:
      operationId: jsonRootGet
      summary: Calls the identity method or group operation the `method` parameter names through the JSON API. Any path starting `/_api/json/v1` in any letter case, also behind `/index.cfm` or the configured context, is the same route; the bare family path answers as this operation.
      tags: [legacy-api]
      x-opt2-transport: service
      x-opt2-public: true
      x-opt2-fastify-path: [/_api/json/v1*, /index.cfm/_api/json/v1*]
      x-opt2-route-keys: ['api:login', 'api:logout', 'api:generatecsrftokens', 'api:findcurrentuser', 'api:validateemail', 'api:group.findall', 'api:group.findmany', 'api:group.findnew', 'api:group.findone', 'api:group.findpermissions', 'api:group.findproperties', 'api:group.findquery', 'api:group.validate']
      x-opt2-route-keys-excluded:
        - {key: 'api:group.delete', reason: 'Withheld and served by legacy; a group delete writes identity and strategies-content units.'}
        - {key: 'api:group.save', reason: 'Withheld and served by legacy; the save also writes strategies-content files for the File-type extended attributes the group already stores.'}
        - {key: 'api:group.save{extdata}', reason: 'Withheld and served by legacy; a save with extended attributes writes identity and strategies-content units.'}
        - {key: 'api:group.save{photo}', reason: 'Withheld and served by legacy; a save that sets or removes a photo writes identity and strategies-content units.'}
