    AuthenticateRequest:
      type: object
      description: The client request as the gateway received it, before it strips `Authorization`.
      required:
        - method
        - path
        - headers
        - query
      additionalProperties: false
      properties:
        method:
          type: string
        path:
          type: string
        siteId:
          $ref: '#/components/schemas/SiteId'
        headers:
          $ref: '#/components/schemas/HeaderValues'
        query:
          type: object
          additionalProperties: true
        form:
          type: object
          additionalProperties: true
        body: {}
    LegacyHttpResponse:
      type: object
      description: Legacy's answer as the client receives it; `headers` include `Access-Control-Allow-Origin` and `Access-Control-Allow-Credentials` when the request's `Origin` is on the site registry's allow-list.
      required:
        - status
        - headers
        - body
      additionalProperties: false
      properties:
        status:
          type: integer
        headers:
          type: object
          additionalProperties:
            type: string
        body:
          type: string
    AuthenticateResponse:
      type: object
      description: '`authenticated` means credentials logged a session in for this request, `denied` and `answered` carry the legacy answer. This sessionless REST exchange reads no cookies, so `session` and `anonymous` are never returned.'
      required:
        - outcome
        - sessionId
      additionalProperties: false
      properties:
        outcome:
          type: string
          enum:
            - session
            - anonymous
            - authenticated
            - denied
            - answered
        sessionId:
          $ref: '#/components/schemas/NullableString'
        legacyResponse:
          $ref: '#/components/schemas/LegacyHttpResponse'
        consumedParams:
          type: array
          description: For `authenticated`, the request parameter names legacy's credential block consumed. The gateway passes them to the owning service in `X-Opt2-Consumed-Params`, whose route key removes them from params but not from the URL scope.
          items:
            type: string
    LoginSnapshot:
      type: object
      description: The user struct and roles as `loginByQuery` built them at the session's last login.
      required:
        - user
        - roles
      additionalProperties: false
      properties:
        user:
          type: object
          additionalProperties: true
        roles:
          type: array
          items:
            type: string
    LegacySessionDescription:
      type: object
      description: The bridge's `op=describe` output for one legacy session.
      required:
        - user
        - roles
        - csrfSecretKey
        - usedTokens
      additionalProperties: false
      properties:
        user:
          type: object
          additionalProperties: true
        roles:
          type: array
          items:
            type: string
        csrfSecretKey:
          type: string
        usedTokens:
          type: array
          items:
            type: string
    AdoptSessionRequest:
      type: object
      required:
        - legacySessionId
        - siteId
        - describe
      additionalProperties: false
      properties:
        legacySessionId:
          type: string
          minLength: 1
        siteId:
          $ref: '#/components/schemas/SiteId'
        describe:
          $ref: '#/components/schemas/LegacySessionDescription'
    AdoptSessionResponse:
      type: object
      required:
        - sessionId
        - epoch
        - setCookie
      additionalProperties: false
      properties:
        sessionId:
          type: string
        epoch:
          type: integer
          minimum: 0
        setCookie:
          type: array
          description: Set-Cookie values in legacy form, with the legacy cookie names and attributes.
          items:
            type: string
    SessionState:
      type: object
      required:
        - state
        - epoch
        - userId
        - siteId
      additionalProperties: false
      properties:
        state:
          type: string
          enum:
            - active
            - ended
        epoch:
          type: integer
          minimum: 0
        userId:
          type: string
        siteId:
          type: string
    SessionAdminSite:
      type: object
      required:
        - siteId
      additionalProperties: false
      properties:
        siteId:
          type: string
          description: '`session.siteid`, the admin site the session selected; empty when none is stored or the session is unknown or ended.'
    SessionSnapshot:
      type: object
      required:
        - sessionId
        - epoch
        - loginSnapshot
        - csrfSecretKey
        - usedTokens
      additionalProperties: false
      properties:
        sessionId:
          type: string
        epoch:
          type: integer
          minimum: 0
        loginSnapshot:
          $ref: '#/components/schemas/LoginSnapshot'
        csrfSecretKey:
          type: string
        usedTokens:
          type: array
          items:
            type: string
    EndSessionRequest:
      type: object
      required:
        - reason
      additionalProperties: false
      properties:
        reason:
          type: string
          enum:
            - logout
            - legacy-logout
            - expired
    EndSessionResponse:
      type: object
      required:
        - ended
        - epoch
      additionalProperties: false
      properties:
        ended:
          type: boolean
          const: true
        epoch:
          type: integer
          minimum: 0
    CsrfConsumeRequest:
      type: object
      required:
        - sessionId
        - token
        - expires
        - context
      additionalProperties: false
      properties:
        sessionId:
          type: string
          description: Identity session id, the verified user token's `sid`.
        token:
          type: string
        expires:
          type: string
          description: '`yyMMddHHnnsslll` expiry sent with the token.'
        context:
          type: string
          description: The route's legacy `validateCSRFTokens(context=…)` value.
    CsrfConsumeResponse:
      type: object
      description: '`valid` is true only when the token was valid and is now consumed.'
      required:
        - valid
      additionalProperties: false
      properties:
        valid:
          type: boolean
    CsrfClaimRequest:
      type: object
      required:
        - sessionId
        - token
        - expires
        - context
      additionalProperties: false
      properties:
        sessionId:
          type: string
        token:
          type: string
        expires:
          type: string
        context:
          type: string
    CsrfClaimResponse:
      type: object
      description: '`used` means the token was already consumed, so the gateway ensures the legacy ledger holds it and legacy rejects the request itself.'
      required:
        - state
      additionalProperties: false
      properties:
        state:
          type: string
          enum:
            - pending-legacy
            - used
    CsrfSettleRequest:
      type: object
      required:
        - sessionId
        - consumed
        - released
      additionalProperties: false
      properties:
        sessionId:
          type: string
        consumed:
          type: array
          description: Tokens the legacy request added to the session's native ledger.
          items:
            type: string
        released:
          type: array
          description: Pending tokens legacy did not consume, which stay usable.
          items:
            type: string
    CsrfSettleResponse:
      type: object
      required:
        - used
        - released
      additionalProperties: false
      properties:
        used:
          type: integer
          minimum: 0
        released:
          type: integer
          minimum: 0
    AccountFields:
      type: object
      description: The account columns of a `Type=2` `tusers` row; `Password` is the plain value the form posted, hashed by identity.
      required:
        - UserName
        - Perm
        - InActive
        - isPublic
        - Admin
        - remoteID
        - Type
      additionalProperties: false
      properties:
        UserName:
          type: string
        Password:
          type: string
          format: password
        S2:
          type: integer
          enum:
            - 0
            - 1
        Perm:
          type: integer
        InActive:
          type: integer
        isPublic:
          type: integer
        Admin:
          type: integer
        remoteID:
          type: string
        tablist:
          description: Trimmed by identity; empty text or null is stored as NULL. Absent keeps an update's stored value.
          $ref: '#/components/schemas/NullableString'
        Type:
          type: integer
          const: 2
    AccountPrepareRequest:
      type: object
      required:
        - kind
        - siteId
        - account
        - groupIds
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
            - create
            - update
        siteId:
          $ref: '#/components/schemas/SiteId'
        account:
          $ref: '#/components/schemas/AccountFields'
        groupIds:
          type: array
          description: The user's memberships after the change.
          items:
            $ref: '#/components/schemas/CfUuid'
        updateGroups:
          type: boolean
          description: '`userManager.update`''s `updateGroups`; absent means true. False leaves an update''s memberships as stored.'
        originID:
          type: string
          description: '`userManager.update`''s `OriginID`; when not empty, an update replaces only memberships of groups in that site.'
        switchToPublic:
          type: boolean
          description: The posted `switchToPublic` flag `userBean.set` applies; it picks the public user pool before `isPublic`.
        switchToPrivate:
          type: boolean
          description: The posted `switchToPrivate` flag `userBean.set` applies; it picks the private user pool when `switchToPublic` is not set.
    AccountCommitRequest:
      type: object
      description: Optional body of a commit; recovery sends none.
      additionalProperties: false
      properties:
        sessionEffects:
          $ref: '#/components/schemas/AccountSessionEffects'
    AccountSessionEffects:
      type: object
      description: Re-login of the saving user's own session at finish, as legacy's JSON API self-save does; needs the user token whose `sub` is the path user and whose `sid` is `reloginSessionId`.
      required:
        - reloginSessionId
      additionalProperties: false
      properties:
        reloginSessionId:
          type: string
          minLength: 1
          description: Identity session id, the forwarded user token's `sid`.
        person:
          $ref: '#/components/schemas/AccountSessionPerson'
    AccountSessionPerson:
      type: object
      description: The saved person fields the re-login copies into the session snapshot.
      required:
        - fname
        - lname
        - email
        - company
        - subtype
      additionalProperties: false
      properties:
        fname:
          $ref: '#/components/schemas/NullableString'
        lname:
          $ref: '#/components/schemas/NullableString'
        email:
          $ref: '#/components/schemas/NullableString'
        company:
          $ref: '#/components/schemas/NullableString'
        subtype:
          $ref: '#/components/schemas/NullableString'
    AccountOperationState:
      type: string
      enum:
        - prepared
        - committed
        - aborted
        - reverted
        - finished
        - unknown
    AccountOperation:
      type: object
      required:
        - operationId
        - userId
        - state
      additionalProperties: false
      properties:
        operationId:
          $ref: '#/components/schemas/CfUuid'
        userId:
          $ref: '#/components/schemas/CfUuid'
        kind:
          type: string
          enum:
            - create
            - update
        state:
          $ref: '#/components/schemas/AccountOperationState'
        before:
          description: Account values and memberships recorded at prepare; null for a create.
          oneOf:
            - type: object
              required:
                - account
                - groupIds
              additionalProperties: false
              properties:
                account:
                  type: object
                  additionalProperties: true
                groupIds:
                  type: array
                  items:
                    $ref: '#/components/schemas/CfUuid'
            - type: 'null'
    AccountCommitResult:
      type: object
      required:
        - operationId
        - userId
        - state
        - writePosition
        - account
        - groupIds
      additionalProperties: false
      properties:
        operationId:
          $ref: '#/components/schemas/CfUuid'
        userId:
          $ref: '#/components/schemas/CfUuid'
        state:
          type: string
          const: committed
        writePosition:
          $ref: '#/components/schemas/Xid8'
        account:
          $ref: '#/components/schemas/AccountRecord'
        groupIds:
          type: array
          description: The committed memberships whose group exists, by group name, as `readMembershipIDs` reads them.
          items:
            $ref: '#/components/schemas/CfUuid'
    AccountOperationStep:
      type: object
      required:
        - operationId
        - userId
        - state
      additionalProperties: false
      properties:
        operationId:
          $ref: '#/components/schemas/CfUuid'
        userId:
          $ref: '#/components/schemas/CfUuid'
        state:
          type: string
          enum:
            - aborted
            - finished
            - reverted
    AccountRecord:
      type: object
      description: The identity-owned columns of a `Type=2` `tusers` row, in bootstrap column casing.
      required:
        - UserID
        - SiteID
        - UserName
        - Type
        - Admin
        - S2
        - Perm
        - InActive
        - isPublic
        - remoteID
        - PasswordCreated
        - LastLogin
        - tablist
      additionalProperties: false
      properties:
        UserID:
          $ref: '#/components/schemas/CfUuid'
        SiteID:
          $ref: '#/components/schemas/SiteId'
        UserName:
          $ref: '#/components/schemas/NullableString'
        Type:
          type: integer
          const: 2
        Admin:
          $ref: '#/components/schemas/NullableInteger'
        S2:
          $ref: '#/components/schemas/NullableInteger'
        Perm:
          $ref: '#/components/schemas/NullableInteger'
        InActive:
          $ref: '#/components/schemas/NullableInteger'
        isPublic:
          $ref: '#/components/schemas/NullableInteger'
        remoteID:
          $ref: '#/components/schemas/NullableString'
        PasswordCreated:
          $ref: '#/components/schemas/NullableTimestamp'
        LastLogin:
          $ref: '#/components/schemas/NullableTimestamp'
        tablist:
          $ref: '#/components/schemas/NullableString'
    AccountLookupRequest:
      type: object
      required:
        - userIds
      additionalProperties: false
      properties:
        userIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/CfUuid'
        where:
          $ref: '#/components/schemas/AccountWhere'
    AccountWhere:
      type: object
      description: Account predicates a read applies together, as the user list and search screens filter; a NULL column matches no given value.
      additionalProperties: false
      properties:
        isPublic:
          type: number
          description: '`isPublic` numerically equal.'
        s2:
          type: number
          description: '`S2` numerically equal.'
        excludeS2Users:
          type: boolean
          description: True keeps only accounts whose `S2` is set and not 1, as legacy `showsuperusers` does; false filters nothing.
        inActive:
          type: number
          description: '`InActive` numerically equal.'
        siteIds:
          type: array
          description: '`SiteID` equal to one of these, ignoring case and trailing spaces.'
          minItems: 1
          maxItems: 100
          items:
            type: string
        unassigned:
          type: boolean
          description: True keeps only users without a `tusersmemb` row in any registered tenant, as `lookupMemberships` reads them; false filters nothing.
    AccountCountRequest:
      type: object
      description: '`pool` counts the token site''s public or private user pool as `publicPool` selects, `tenant` the token tenant and `all-sites` every registered site.'
      required:
        - scope
      additionalProperties: false
      properties:
        scope:
          type: string
          enum:
            - pool
            - tenant
            - all-sites
        publicPool:
          type: boolean
          description: Required with `pool`; other scopes ignore it.
        where:
          $ref: '#/components/schemas/AccountWhere'
      if:
        required:
          - scope
        properties:
          scope:
            const: pool
      then:
        required:
          - publicPool
        properties:
          publicPool:
            type: boolean
    AccountCount:
      type: object
      required:
        - count
      additionalProperties: false
      properties:
        count:
          type: integer
          minimum: 0
    UsernameCandidateRequest:
      type: object
      description: '`pattern` is matched as `UserName COLLATE "C" ILIKE pattern ESCAPE ''''`: `%` and `_` are wildcards, every other character is literal and only ASCII letters fold case.'
      required:
        - publicPool
        - pattern
        - limit
      additionalProperties: false
      properties:
        publicPool:
          type: boolean
          description: True reads the token site's public user pool, false its private one.
        pattern:
          type: string
          minLength: 1
          maxLength: 2000
        where:
          $ref: '#/components/schemas/AccountWhere'
        limit:
          type: integer
          minimum: 1
          maximum: 5000
    UsernameCandidate:
      type: object
      required:
        - userId
        - username
      additionalProperties: false
      properties:
        userId:
          $ref: '#/components/schemas/CfUuid'
        username:
          type: string
    UsernameCandidateList:
      type: object
      required:
        - items
        - complete
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UsernameCandidate'
        complete:
          type: boolean
    AccountList:
      type: object
      required:
        - items
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccountRecord'
    MembershipLookupRequest:
      type: object
      required:
        - userIds
      additionalProperties: false
      properties:
        userIds:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items:
            $ref: '#/components/schemas/CfUuid'
        byGroupName:
          type: boolean
          description: True answers each user's ids as `getAccountMemberships` does, reading the groups once per registered tenant for all listed users; false or absent answers the stored rows.
    MembershipListItem:
      type: object
      description: The `tusersmemb` group ids of one user, de-duplicated ignoring case, by registry site order then group id; with `byGroupName`, only the ids naming a stored group, as that group's id, by group name (NULL first, then ignoring case, ties by id).
      required:
        - userId
        - groupIds
      additionalProperties: false
      properties:
        userId:
          $ref: '#/components/schemas/CfUuid'
        groupIds:
          type: array
          items:
            $ref: '#/components/schemas/CfUuid'
    MembershipList:
      type: object
      required:
        - items
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MembershipListItem'
    GroupFavoriteLookupRequest:
      type: object
      required:
        - favoriteIds
      additionalProperties: false
      properties:
        favoriteIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            description: A `tusersfavorites.favoriteID` (`char(35)`) as people received it.
            minLength: 1
            maxLength: 35
    GroupFavoriteListItem:
      type: object
      required:
        - favoriteId
      additionalProperties: false
      properties:
        favoriteId:
          type: string
          description: The requested id as sent.
    GroupFavoriteList:
      type: object
      required:
        - items
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GroupFavoriteListItem'
    AccountMemberships:
      type: object
      description: '`readMembershipIDs` of one user: the stored groups it belongs to, by group name.'
      required:
        - groupIds
      additionalProperties: false
      properties:
        groupIds:
          type: array
          items:
            $ref: '#/components/schemas/CfUuid'
    LoginBlockRequest:
      type: object
      description: '`removeBlock` true clears the loaded strikes before the block is read, as the `removeBlock` link of `cUsers.editUser` does.'
      required:
        - removeBlock
      additionalProperties: false
      properties:
        removeBlock:
          type: boolean
    LoginBlock:
      type: object
      description: Login throttling of the account's user name, as `userstrikes.cfc` reports it.
      required:
        - blockedUntil
      additionalProperties: false
      properties:
        blockedUntil:
          description: Last failed attempt plus the block duration while the strikes exceed the allowed count; null when not blocked or the user name is empty.
          $ref: '#/components/schemas/NullableTimestamp'
    SiteGroup:
      type: object
      description: One `Type=1` row of a site's user pool.
      required:
        - UserID
        - GroupName
        - SiteID
        - isPublic
        - Perm
      additionalProperties: false
      properties:
        UserID:
          $ref: '#/components/schemas/CfUuid'
        GroupName:
          $ref: '#/components/schemas/NullableString'
        SiteID:
          $ref: '#/components/schemas/SiteId'
        isPublic:
          type: integer
          enum:
            - 0
            - 1
        Perm:
          $ref: '#/components/schemas/NullableInteger'
    SiteGroupList:
      type: object
      required:
        - items
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SiteGroup'
    SiteGroupPage:
      type: object
      required:
        - items
        - total
        - nextOffset
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SiteGroup'
        total:
          $ref: '#/components/schemas/ListTotal'
        nextOffset:
          $ref: '#/components/schemas/NextOffset'
    TaskWireBody:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/TaskWireBody'
    SystemTaskWireBody:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/SystemTaskWireBody'
    PushBody:
      type: object
      description: Pub/Sub push wrapper; `data` is the base64 event envelope.
      required:
        - message
        - subscription
      additionalProperties: true
      properties:
        message:
          type: object
          additionalProperties: true
          properties:
            data:
              type: string
              contentEncoding: base64
            attributes:
              type: object
              additionalProperties:
                type: string
            messageId:
              type: string
            message_id:
              type: string
            publishTime:
              type: string
            publish_time:
              type: string
            orderingKey:
              type: string
          allOf:
            - anyOf:
                - required:
                    - messageId
                  properties:
                    messageId:
                      minLength: 1
                - required:
                    - message_id
                  properties:
                    message_id:
                      minLength: 1
        subscription:
          type: string
          minLength: 1
          description: Usually `projects/<project>/subscriptions/<subscription>`, such as `identity.people.person.changed.v1`.
        deliveryAttempt:
          type: integer
    SweepResult:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/SweepResult'
    EnsureRecurringResult:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/EnsureRecurringResult'
    QueueControlResult:
      type: object
      description: The queue's paused state after pause or resume, or the chain task `ensure` found or created.
      required:
        - queue
        - service
      additionalProperties: false
      properties:
        queue:
          type: string
        service:
          type: string
          const: identity
        paused:
          type: boolean
        running:
          type: integer
          minimum: 0
          description: Tasks of the queue still running when pause answered.
        ensured:
          $ref: '#/components/schemas/EnsureRecurringResult'
    CanonicalType:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/CanonicalType'
    CanonicalColumn:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/CanonicalColumn'
    WatermarkDirection:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/WatermarkDirection'
    WatermarkFields:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/WatermarkFields'
    ApplyRequest:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/ApplyRequest'
    ApplyResponse:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/ApplyResponse'
    ObjectManifestEntry:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/ObjectManifestEntry'
    ExportRow:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/ExportRow'
    ExportTable:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/ExportTable'
    ExportResponse:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/ExportResponse'
    ChangeOp:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/ChangeOp'
    ChangeOrigin:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/ChangeOrigin'
    LegacyChange:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/LegacyChange'
    ProjectedChangeRow:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/ProjectedChangeRow'
    OperationStatus:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/OperationStatus'
    ChangesResponse:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/ChangesResponse'
    TenantDrainCount:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/TenantDrainCount'
    OutboxDrainCounts:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/OutboxDrainCounts'
    InboxCounts:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/InboxCounts'
    PositionResponse:
      type: object
      description: The latest assigned xid and the drain counts; `outbox` or `inbox` is null where the service has no such table.
      required:
        - owner
        - position
        - outbox
        - inbox
      additionalProperties: false
      properties:
        owner:
          type: string
          const: identity
        position:
          type: string
          pattern: '^[0-9]+$'
        outbox:
          oneOf:
            - $ref: '#/components/schemas/OutboxDrainCounts'
            - type: 'null'
        inbox:
          oneOf:
            - $ref: '#/components/schemas/InboxCounts'
            - type: 'null'
        published:
          type: array
          description: Present only when `publishedTopics` is asked, empty without an outbox. Unpaged, every published outbox event of the asked topics in every tenant the registry has known by tenant, topic and id; paged, one page after `publishedAfter` and at or below `publishedFrontier`, ascending by `seq`.
          items:
            $ref: '#/components/schemas/PublishedEvent'
        registeredTenants:
          type: array
          description: Every tenant of the registry, each site's and its pools', lower-case and sorted; present only when asked.
          items:
            type: string
            format: uuid
        publishedNext:
          type: string
          pattern: '^[0-9]+$'
          description: The `publishedAfter` of the next page; it never passes an unpublished or held row of the asked topics at or below `publishedFrontier`. Present only on a paged read.
        publishedComplete:
          type: boolean
          description: True when every row of the asked topics after `publishedAfter` and at or below `publishedFrontier` is published and listed. Present only on a paged read.
        publishedFrontier:
          type: string
          pattern: '^[0-9]+$'
          description: The last `seq` the page covers, the asked `publishedThrough`, else the highest `seq` of any row of the asked topics, published or not, in every tenant the registry has known when read, or `publishedAfter` when there is none; later rows are neither listed nor blocking. Present only on a paged read.
        publishedUpTo:
          type: integer
          minimum: 0
          description: Published events of the asked topics at or below `publishedAfter`, so a caller detects rows that appeared behind its cursor. Present only on a paged read whose `publishedComplete` is true.
    PublishedEvent:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/PublishedEvent'
