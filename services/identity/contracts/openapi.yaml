      description: Superseded by `listSiteGroupsV2` (`GET /internal/v2/groups`), which answers one page.
      deprecated: true
      tags: [internal]
      x-opt2-transport: service
      x-opt2-requires:
        - service:people
      security: [{userToken: [], invocationCredential: []}]
      parameters:
        - $ref: '#/components/parameters/SiteIdQuery'
        - name: ispublic
          in: query
          required: true
          description: '`0` for the private pool''s system groups, `1` for the public pool''s member groups.'
          schema:
            type: string
            enum:
              - '0'
              - '1'
      responses:
        '200':
          description: The groups, by `Perm` descending, then group name; none when the pool site's own pool of that kind is another site, as legacy's settings join gives.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteGroupList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
          description: A legacy write window executed or imported on `identity.group_account` for 30 s.
  /internal/v2/groups:
    get:
      operationId: listSiteGroupsV2
      summary: Lists one page of the groups of the site's private or public user pool, as `getPrivateGroups` and `getPublicGroups` list them.
      tags: [internal]
      x-opt2-transport: service
      x-opt2-requires:
        - service:people
      security: [{userToken: [], invocationCredential: []}]
      parameters:
        - $ref: '#/components/parameters/SiteIdQuery'
        - name: ispublic
          in: query
          required: true
          description: '`0` for the private pool''s system groups, `1` for the public pool''s member groups.'
          schema:
            type: string
            enum:
              - '0'
              - '1'
        - $ref: '#/components/parameters/ListOffset'
        - $ref: '#/components/parameters/ListLimit'
      responses:
        '200':
          description: The page of the groups, by `Perm` descending, then group name, with the pool's total; none when the pool site's own pool of that kind is another site, as legacy's settings join gives.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteGroupPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
          description: A legacy write window executed or imported on `identity.group_account` for 30 s.
  /internal/v1/group-favorites:lookup:
    post:
      operationId: lookupGroupFavorites
      summary: Finds which favorite ids name a `tusersfavorites` row of a group, which identity holds, for people's favorites templates.
      tags: [internal]
      x-opt2-transport: service
      x-opt2-requires:
        - service:people
      x-opt2-fastify-path: /internal/v1/group-favorites::lookup
      security: [{invocationCredential: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupFavoriteLookupRequest'
      responses:
        '200':
          description: The listed ids, in request order and spelling, that name an `identity.user_favorite` row of any registered tenant, compared ignoring case and trailing spaces; the others are left out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupFavoriteList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
          description: A legacy write window executed or imported on `identity.user_favorite` for 30 s.
  /internal/v1/migration/apply:
    post:
      operationId: migrationApply
      summary: Applies one batch of canonical legacy rows to the owned units, once per batch id.
      tags: [migration]
      x-opt2-transport: service
      x-opt2-requires:
        - platform.migration
      security: [{invocationCredential: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyRequest'
      responses:
        '200':
          description: The batch outcome; a repeated batch id is a no-op reported as `duplicate`.
          headers:
            X-Opt2-Write-Position:
              $ref: '#/components/headers/XOpt2WritePosition'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/ApplyUnavailable'
  /internal/v1/migration/export:
    get:
      operationId: migrationExport
      summary: Exports one page of a unit's rows in canonical legacy form.
      tags: [migration]
      x-opt2-transport: service
      x-opt2-requires:
        - platform.migration
      security: [{invocationCredential: []}]
      parameters:
        - name: unit
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/MigrationTenantId'
        - $ref: '#/components/parameters/MigrationSiteId'
        - name: programId
          in: query
          required: false
          description: Restricts a folded unit to one `Program_<id>` schema.
          schema:
            $ref: '#/components/schemas/DigitString'
        - name: after
          in: query
          required: false
          description: The previous page's `next` cursor.
          schema:
            type: string
            minLength: 1
        - name: match
          in: query
          required: false
          description: JSON object of legacy column to values; rows matching any entry, compared as SQL Server does. The owner may return more rows.
          schema:
            type: string
            maxLength: 4096
        - name: keys
          in: query
          required: false
          description: Legacy key encodings as export rows carry them in `key`; the page holds only their rows and no object manifest.
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items:
              type: string
              minLength: 1
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: One export page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/migration/changes:
    get:
      operationId: migrationChanges
      summary: Reads the tenant's changelog after a cursor, below the commit-safe horizon.
      tags: [migration]
      x-opt2-transport: service
      x-opt2-requires:
        - platform.migration
      security: [{invocationCredential: []}]
      parameters:
        - $ref: '#/components/parameters/MigrationTenantId'
        - $ref: '#/components/parameters/MigrationSiteId'
        - name: after
          in: query
          required: false
          description: Cursor `<xid>:<seq>`; `0:0` when omitted.
          schema:
            type: string
            pattern: '^(0|[1-9][0-9]*):(0|[1-9][0-9]*)$'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: One page of changes with their legacy projections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/migration/position:
    get:
      operationId: migrationPosition
      summary: Reports the current write position and the outbox and inbox drain counts.
      tags: [migration]
      x-opt2-transport: service
      x-opt2-requires:
        - platform.migration
      security: [{invocationCredential: []}]
      parameters:
        - name: eventIds
          in: query
          required: false
          description: Comma-separated event ids whose inbox receipts are reported.
          schema:
            type: string
        - name: publishedTopics
          in: query
          required: false
          description: Comma-separated topics whose published outbox events are listed in `published`; every one when the read names none of `publishedAfter`, `publishedLimit` and `publishedThrough`, otherwise one page per read.
          schema:
            type: string
        - name: registeredTenants
          in: query
          required: false
          description: With `true`, lists every tenant of the registry, each site's and its pools', in `registeredTenants`.
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: publishedAfter
          in: query
          required: false
          description: Pages the listing from outbox `seq` after this value, the previous answer's `publishedNext`; 0 when absent on a paged read.
          schema:
            type: string
            pattern: '^(0|[1-9][0-9]{0,17})$'
        - name: publishedLimit
          in: query
          required: false
          description: Pages the listing with at most this many published events, 1 to 1000; 1000 when absent on a paged read.
          schema:
            type: string
            pattern: '^([1-9][0-9]{0,2}|1000)$'
        - name: publishedThrough
          in: query
          required: false
          description: Pages the listing through outbox `seq` this value, an earlier answer's `publishedFrontier`; rows of the asked topics above it are neither listed nor blocking.
          schema:
            type: string
            pattern: '^(0|[1-9][0-9]{0,17})$'
      responses:
        '200':
          description: The owner's position.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/migration/watermark:
    get:
      operationId: migrationWatermarkGet
      summary: Lists feed watermarks, optionally for one legacy table or direction.
      tags: [migration]
      x-opt2-transport: service
      x-opt2-requires:
        - platform.migration
      security: [{invocationCredential: []}]
      parameters:
        - name: legacyTable
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: direction
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/WatermarkDirection'
      responses:
        '200':
          description: Watermarks ordered by legacy table and direction.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WatermarkRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: migrationWatermarkPost
      summary: Records the feed watermark of one legacy table and direction.
      tags: [migration]
      x-opt2-transport: service
      x-opt2-requires:
        - platform.migration
      security: [{invocationCredential: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatermarkInput'
      responses:
        '200':
          description: The stored watermark.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatermarkRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/migration/gate:
    post:
      operationId: migrationGate
      summary: Closes, re-phases, opens or reads the unit gates of this owner.
      tags: [migration]
      x-opt2-transport: service
      x-opt2-requires:
        - platform.migration
      security: [{invocationCredential: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GateRequest'
      responses:
        '200':
          description: The gates after the operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Another holder owns a gate, so the compare-and-set was refused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GateConflict'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
          description: The gates could not close within the wait budget.
  /internal/v1/events/identity.programs-sites.site.changed.v1:
    post:
      operationId: pushSiteChanged
      summary: Receives push deliveries of `programs-sites.site.changed.v1` into identity's tenant registry.
      tags: [events]
      x-opt2-transport: pubsub-push
      x-opt2-requires:
        - service:pubsub-invoker
      security: [{pubsubPushOidc: []}, {localPushKey: []}]
      parameters:
        - $ref: '#/components/parameters/PushKey'
      requestBody:
        required: true
        description: Message data is an event envelope whose payload follows `services/programs-sites/contracts/events/programs-sites.site.changed.v1.json`.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushBody'
      responses:
        '204':
          description: Acknowledged; the delivery was applied, already applied, or dead-lettered.
        '400':
          description: Not a push body; a nack.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
          description: Processing failed; a nack, redelivered by Pub/Sub.
        '503':
          $ref: '#/components/responses/Unavailable'
          description: A unit gate or the database is unavailable; a nack, redelivered by Pub/Sub.
  /internal/v1/events/identity.people.person.changed.v1:
    post:
      operationId: pushPersonChanged
      summary: Receives push deliveries of `people.person.changed.v1` into identity's person contact projection.
      tags: [events]
      x-opt2-transport: pubsub-push
      x-opt2-requires:
        - service:pubsub-invoker
      security: [{pubsubPushOidc: []}, {localPushKey: []}]
      parameters:
        - $ref: '#/components/parameters/PushKey'
      requestBody:
        required: true
        description: Message data is an event envelope whose payload follows `services/people/contracts/events/people.person.changed.v1.json`.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushBody'
      responses:
        '204':
          description: Acknowledged; the delivery was applied, already applied, stale, or dead-lettered.
        '400':
          description: Not a push body; a nack.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
          description: Processing failed; a nack, redelivered by Pub/Sub.
        '503':
          $ref: '#/components/responses/Unavailable'
          description: A unit gate or the database is unavailable; a nack, redelivered by Pub/Sub.
  /internal/v1/outbox/sweep:
    post:
      operationId: outboxSweep
      summary: Creates the next sweep task, then publishes every unpublished outbox row per registry tenant.
      tags: [tasks]
      x-opt2-transport: cloud-tasks
      x-opt2-requires:
        - service:tasks-invoker
      security: [{tasksInvokerOidc: []}]
      parameters:
        - $ref: '#/components/parameters/CloudTasksTaskName'
        - $ref: '#/components/parameters/CloudTasksQueueName'
        - $ref: '#/components/parameters/CloudTasksRetryCount'
        - $ref: '#/components/parameters/CloudTasksExecutionCount'
        - $ref: '#/components/parameters/CloudTasksEta'
      requestBody:
        $ref: '#/components/requestBodies/SystemTask'
      responses:
        '200':
          description: The sweep totals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SweepResult'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: A malformed task body, or one carrying a tenant.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
          description: The sweep failed, so Cloud Tasks retries this task.
        '503':
          $ref: '#/components/responses/Unavailable'
          description: The successor task could not be created, so Cloud Tasks retries this one.
  /internal/v1/task-queues/{queue}/pause:
    parameters:
      - $ref: '#/components/parameters/Queue'
    post:
      operationId: pauseTaskQueue
      summary: Pauses dispatch from a queue this service creates tasks on.
      tags: [tasks]
      x-opt2-transport: service
      x-opt2-requires:
        - platform.migration
        - platform.operator
      security: [{invocationCredential: []}]
      responses:
        '200':
          $ref: '#/components/responses/QueueControlled'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: The queue is not one this service creates tasks on.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/task-queues/{queue}/resume:
    parameters:
      - $ref: '#/components/parameters/Queue'
    post:
      operationId: resumeTaskQueue
      summary: Resumes dispatch from a queue this service creates tasks on.
      tags: [tasks]
      x-opt2-transport: service
      x-opt2-requires:
        - platform.migration
        - platform.operator
      security: [{invocationCredential: []}]
      responses:
        '200':
          $ref: '#/components/responses/QueueControlled'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: The queue is not one this service creates tasks on.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/task-queues/{queue}/ensure:
    parameters:
      - $ref: '#/components/parameters/Queue'
    post:
      operationId: ensureTaskQueue
      summary: Ensures a recurring chain this service creates has a live task.
      tags: [tasks]
      x-opt2-transport: service
      x-opt2-requires:
        - platform.migration
        - platform.operator
      security: [{invocationCredential: []}]
      responses:
        '200':
          $ref: '#/components/responses/QueueControlled'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: The queue is not a recurring chain this service creates.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'

components:
  securitySchemes:
    userToken:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/securitySchemes/userToken'
    invocationCredential:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/securitySchemes/invocationCredential'
    pubsubPushOidc:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/securitySchemes/pubsubPushOidc'
    localPushKey:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/securitySchemes/localPushKey'
    tasksInvokerOidc:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/securitySchemes/tasksInvokerOidc'
  headers:
    Generator:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/headers/Generator'
    StrictTransportSecurity:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/headers/StrictTransportSecurity'
    ETag:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/headers/ETag'
    AccessControlAllowOrigin:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/headers/AccessControlAllowOrigin'
    AccessControlAllowCredentials:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/headers/AccessControlAllowCredentials'
    WWWAuthenticate:
      description: Challenge legacy sets before the failure; the `invalid_grant_type` value keeps legacy's missing closing quote.
      schema:
        type: string
        examples:
          - Basic
          - 'Bearer error="invalid_access_token"'
          - Bearer
          - 'Bearer error="invalid_client_credentials"'
          - 'Bearer error="invalid_authorization_code"'
          - 'Bearer error="invalid_client_refresh_token"'
          - 'Bearer error="invalid_grant_type'
    XOpt2WritePosition:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/headers/XOpt2WritePosition'
    XOpt2UnpublishedEvents:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/headers/XOpt2UnpublishedEvents'
    SetCookie:
      description: Cookies in legacy form, such as the session cookies `CFID`, `CFTOKEN` and `JSESSIONID` or the remember-me `userid` and `userHash`.
      schema:
        type: string
        examples:
          - CFID=1000;path=/;HttpOnly;
    UsersCsvDisposition:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/headers/UsersCsvDisposition'
  parameters:
    LegacySiteId:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/parameters/LegacySiteId'
    LegacySegment:
      name: segment
      in: path
      required: true
      description: 'Segment after the site id: an identity method (`login`, `logout`, `generateCSRFTokens`, `findCurrentUser`, `validateEmail`) or the entity `group` or `groups`; on REST also `oauth`, `oauth2` or `tokeninfo`.'
      schema:
        type: string
        minLength: 1
        examples:
          - group
    LegacyItem:
      name: item
      in: path
      required: true
      description: A group id, a comma list of ids, `new`, `properties` or `permissions`, or the first value of a path parameter pair; on REST also the segment after `oauth` or `oauth2`, or `tokeninfo`.
      schema:
        type: string
        minLength: 1
    LegacySuffix:
      name: suffix
      in: path
      required: true
      description: '`permissions` after a 35-character group id, or a path parameter; longer path-pair forms resolve the same way on the same Fastify route.'
      schema:
        type: string
        minLength: 1
        examples:
          - permissions
    LegacyMethod:
      name: method
      in: query
      required: false
      description: Method to call, also read from a form or JSON body field; an entity-generic method addresses `entityname`, or the entity of a dotted `group.<method>`.
      schema:
        type: string
        examples:
          - login
          - logout
          - generateCSRFTokens
          - findCurrentUser
          - validateEmail
          - findOne
          - findMany
          - findAll
          - findNew
          - findQuery
          - findProperties
          - findPermissions
          - validate
          - group.findOne
    LegacyEntityName:
      name: entityname
      in: query
      required: false
      description: Entity an entity-generic `method` addresses; `group` or `groups` for identity.
      schema:
        type: string
        examples:
          - group
    MethodOverrideHeader:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/parameters/MethodOverrideHeader'
    CsrfTokenHeader:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/parameters/CsrfTokenHeader'
    CsrfExpiresHeader:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/parameters/CsrfExpiresHeader'
    XClientId:
      name: X-client_id
      in: header
      required: false
      description: OAuth client id, an alternative to the `client_id` parameter.
      schema:
        type: string
    XClientIdDash:
      name: X-client-id
      in: header
      required: false
      description: OAuth client id; read after `X-client_id`, so it wins.
      schema:
        type: string
    XClientSecret:
      name: X-client_secret
      in: header
      required: false
      description: OAuth client secret, an alternative to the `client_secret` parameter.
      schema:
        type: string
    XClientSecretDash:
      name: X-client-secret
      in: header
      required: false
      description: OAuth client secret; read after `X-client_secret`, so it wins.
      schema:
        type: string
    XAccessToken:
      name: X-access_token
      in: header
      required: false
      description: OAuth access token, an alternative to the `access_token` parameter.
      schema:
        type: string
    XAccessTokenDash:
      name: X-access-token
      in: header
      required: false
      description: OAuth access token; read after `X-access_token`, so it wins.
      schema:
        type: string
    SiteIdQuery:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/parameters/SiteIdQuery'
    IsPublicQuery:
      name: ispublic
      in: query
      required: false
      description: '`0` for system groups, `1` for member groups; a non-boolean value reads as 1.'
      schema:
        type: string
        default: '1'
        examples:
          - '0'
          - '1'
    FormUserIdQuery:
      name: userid
      in: query
      required: false
      description: The edit form's action-URL `userid`, which its multipart body does not repeat; query and body fields merge as CFML's url and form scopes, a body field winning, and a path `groupId` governs where present.
      schema:
        $ref: '#/components/schemas/CfUuid'
    GroupId:
      name: groupId
      in: path
      required: true
      description: Group `UserID`.
      schema:
        $ref: '#/components/schemas/CfUuid'
    UserId:
      name: userId
      in: path
      required: true
      description: User `UserID`.
      schema:
        $ref: '#/components/schemas/CfUuid'
    ContentId:
      name: contentId
      in: path
      required: true
      description: Content node `ContentID`.
      schema:
        type: string
        minLength: 35
        maxLength: 35
    ModuleId:
      name: moduleId
      in: path
      required: true
      description: Module id; core modules are 32 zeros and three digits.
      schema:
        type: string
        minLength: 35
        maxLength: 35
        examples:
          - '00000000000000000000000000000000008'
    ClientId:
      name: clientId
      in: path
      required: true
      description: OAuth `clientid`; the edit screen generates one for a new client.
      schema:
        $ref: '#/components/schemas/CfUuid'
    SessionId:
      name: sid
      in: path
      required: true
      description: Identity session id, the user token's `sid`.
      schema:
        type: string
        minLength: 1
    OperationId:
      name: operationId
      in: path
      required: true
      description: Roster write-protocol operation id, assigned by people.
      schema:
        $ref: '#/components/schemas/CfUuid'
    Queue:
      name: queue
      in: path
      required: true
      description: A queue this service creates tasks on.
      schema:
        type: string
        enum:
          - identity-outbox-sweep
    MigrationTenantId:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/parameters/MigrationTenantId'
    MigrationSiteId:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/parameters/MigrationSiteId'
    PageLimit:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/parameters/PageLimit'
    ListOffset:
      name: offset
      in: query
      required: false
      description: Items of the listing to skip; 0 when omitted.
      schema:
        type: integer
        minimum: 0
        maximum: 9007199254740991
        default: 0
    ListLimit:
      name: limit
      in: query
      required: false
      description: Most items to return, 1 to 1000; 1000 when omitted.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 1000
    PushKey:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/parameters/PushKey'
    CloudTasksTaskName:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/parameters/CloudTasksTaskName'
    CloudTasksQueueName:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/parameters/CloudTasksQueueName'
    CloudTasksRetryCount:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/parameters/CloudTasksRetryCount'
    CloudTasksExecutionCount:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/parameters/CloudTasksExecutionCount'
    CloudTasksEta:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/parameters/CloudTasksEta'
  requestBodies:
    LegacyCall:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/requestBodies/LegacyCall'
    CsrfOnly:
      required: false
      description: The CSRF token fields, unless the `X-csrf_token` headers carry them.
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/CsrfFields'
        application/json:
          schema:
            $ref: '#/components/schemas/CsrfFields'
    SystemTask:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/requestBodies/SystemTask'
  responses:
    LegacyOk:
      description: The method result or group entity in the legacy envelope, or the bare `validateEmail` body; a login or logout also writes its legacy cookies.
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AccessControlAllowOrigin'
        Access-Control-Allow-Credentials:
          $ref: '#/components/headers/AccessControlAllowCredentials'
        Set-Cookie:
          $ref: '#/components/headers/SetCookie'
        X-Opt2-Write-Position:
          $ref: '#/components/headers/XOpt2WritePosition'
      content:
        application/json;charset=utf-8:
          schema:
            anyOf:
              - $ref: '#/components/schemas/IdentityEnvelope'
              - $ref: '#/components/schemas/ValidateEmailBody'
        application/x-shunter+json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/IdentityEnvelope'
    RestOk:
      description: The legacy envelope, or the bare token object on `oauth2` paths, for `authorization_code` and for `tokeninfo`; other `oauth` grants answer the `getOAuthToken` envelope.
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AccessControlAllowOrigin'
        Access-Control-Allow-Credentials:
          $ref: '#/components/headers/AccessControlAllowCredentials'
        X-Opt2-Write-Position:
          $ref: '#/components/headers/XOpt2WritePosition'
      content:
        application/json;charset=utf-8:
          schema:
            anyOf:
              - $ref: '#/components/schemas/IdentityEnvelope'
              - $ref: '#/components/schemas/ValidateEmailBody'
              - $ref: '#/components/schemas/OAuthTokenEnvelope'
              - $ref: '#/components/schemas/OAuthTokenResponse'
              - $ref: '#/components/schemas/OAuthTokenInfoResponse'
    LegacyBadRequest:
      description: 'Legacy 400: `invalidParameters` (also tokeninfo outside REST or for an unknown or expired token), `invalidMethodCall`, `invalidEntityCall` or `badRequest` (`validateEmail` outside a valid request).'
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AccessControlAllowOrigin'
        Access-Control-Allow-Credentials:
          $ref: '#/components/headers/AccessControlAllowCredentials'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyUnauthorized:
      description: 'Legacy 401: `authorization` (`invalid_request`, `Insufficient Account Permissions`), including REST requests without credentials and refused OAuth grants, or `invalidAccessToken` and `accessTokenExpired` (`invalid_token`) for a bad access token.'
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticate'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyForbidden:
      description: A `siteid` other than the token's site.
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json;charset=utf-8:
          schema:
            anyOf:
              - $ref: '#/components/schemas/IdentityEnvelope'
              - $ref: '#/components/schemas/LegacyError'
    LegacyNotFound:
      description: Legacy 404 (`mura404`) in the error envelope.
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyServerError:
      description: 'Legacy 500 `server_error`; a bad or expired refresh token answers it with `WWW-Authenticate: Bearer error="invalid_client_credentials"`, because legacy throws the uncaught type `invalid_token`.'
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticate'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyError'
    Unavailable:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/responses/Unavailable'
    ApplyUnavailable:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/responses/ApplyUnavailable'
    BadRequest:
      description: 'Legacy 400: `invalidParameters`, `badRequest` or `invalidTokens`.'
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyError'
    Unauthorized:
      description: 'Legacy 401: `authorization` without a qualifying credential, or `invalidAccessToken`/`accessTokenExpired` for a bad user token.'
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticate'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyError'
    Forbidden:
      description: The verified identities hold none of the required roles, or a supplied `siteid` differs from the token's site.
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyError'
    NotFound:
      description: Legacy 404 in the error envelope.
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyError'
    ServerError:
      description: Legacy 500 `server_error`.
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyError'
    GroupWritten:
      description: The group after the request; validation errors leave `errors` non-empty and the form re-renders with them.
      headers:
        X-Opt2-Write-Position:
          $ref: '#/components/headers/XOpt2WritePosition'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GroupWriteResult'
    MembershipWritten:
      description: Whether the membership changed; a missing or invalid CSRF token on an add writes nothing.
      headers:
        X-Opt2-Write-Position:
          $ref: '#/components/headers/XOpt2WritePosition'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WriteResult'
    QueueControlled:
      description: The queue's state after the operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QueueControlResult'
    AccountOperationStepped:
      description: The operation's state after the step; repeating a step that already took effect returns the same state.
      headers:
        X-Opt2-Write-Position:
          $ref: '#/components/headers/XOpt2WritePosition'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountOperationStep'
    AccountOperationConflict:
      description: The operation's state does not allow the step, such as a commit after an abort.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccountOperation'
  schemas:
    CfUuid:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/CfUuid'
    SiteId:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/SiteId'
    TenantId:
      type: string
      description: Tenant UUID.
      format: uuid
    Xid8:
      type: string
      description: PostgreSQL `xid8` of a committed transaction, in decimal.
      pattern: '^[0-9]+$'
    DigitString:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/DigitString'
    ListTotal:
      type: integer
      minimum: 0
      description: Items in the whole listing the caller may see.
    NextOffset:
      description: The `offset` of the next page; null when this page ends the listing.
      type:
        - integer
        - 'null'
      minimum: 0
    LocalTimestamp:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/LocalTimestamp'
    NullableTimestamp:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/NullableTimestamp'
    WallClock:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/WallClock'
    NullableString:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/NullableString'
    NullableInteger:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/NullableInteger'
    BeanFlag:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/BeanFlag'
    FormValue:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/FormValue'
    LegacyEnvelope:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/LegacyEnvelope'
    LegacyErrorBody:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/LegacyErrorBody'
    LegacyError:
      type: object
      description: Legacy JSON API error envelope.
      required:
        - apiversion
        - method
        - error
      additionalProperties: true
      properties:
        apiversion:
          type: string
          const: v1
        method:
          type: string
        params:
          type: object
        error:
          $ref: '#/components/schemas/LegacyErrorBody'
    LegacyUnavailable:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/LegacyUnavailable'
    LegacyErrors:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/LegacyErrors'
    LegacyStorageRejection:
      type: object
      description: An identity table column whose value its legacy column cannot store, and the width or range the value breaks.
      required:
        - table
        - column
        - violation
        - limit
      additionalProperties: false
      properties:
        table:
          type: string
          examples:
            - user_account
        column:
          type: string
          examples:
            - username
        violation:
          type: string
          enum:
            - width
            - range
        limit:
          description: The text width in UTF-16 code units, or the `tinyint`, `float` or `datetime` range.
          oneOf:
            - type: integer
              minimum: 1
            - type: string
              enum:
                - tinyint
                - float
                - datetime
    LegacyCallBody:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/LegacyCallBody'
    IdentityEnvelope:
      description: Legacy envelope of an identity method or group operation.
      allOf:
        - $ref: '#/components/schemas/LegacyEnvelope'
        - type: object
          properties:
            data:
              anyOf:
                - $ref: '#/components/schemas/LoginMethodData'
                - $ref: '#/components/schemas/LogoutMethodData'
                - $ref: '#/components/schemas/CsrfTokenPair'
                - $ref: '#/components/schemas/ValidateEmailData'
                - $ref: '#/components/schemas/CurrentUserData'
                - $ref: '#/components/schemas/JsonApiGroupCollection'
                - $ref: '#/components/schemas/JsonApiGroup'
                - $ref: '#/components/schemas/JsonApiEntityMeta'
    LoginMethodData:
      type: object
      description: Result of `login`, which validates CSRF context `login`; `Invalid CSFR Tokens` keeps legacy's spelling.
      required:
        - status
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - success
            - failed
            - Invalid CSFR Tokens
    LogoutMethodData:
      type: object
      description: Result of `logout`.
      required:
        - status
      additionalProperties: false
      properties:
        status:
          type: string
          const: success
    CsrfTokenPair:
      type: object
      description: Result of `generateCSRFTokens` for its `context` argument.
      required:
        - csrf_token
        - csrf_token_expires
      additionalProperties: false
      properties:
        csrf_token:
          type: string
          pattern: '^[0-9A-F]{64}$'
        csrf_token_expires:
          type: string
          description: Expiry `yyMMddHHnnsslll`, three hours after issue.
          pattern: '^[0-9]{15}$'
    ValidateEmailData:
      description: 'Result of `validateEmail`: the BriteVerify response body as legacy re-serializes it, or `{"status": "invalid"}` when it cannot.'
      anyOf:
        - type: string
        - type: object
          required:
            - status
          additionalProperties: false
          properties:
            status:
              type: string
              const: invalid
    ValidateEmailBody:
      type: string
      description: 'The whole `validateEmail` answer: the BriteVerify `filecontent` serialized as a JSON string, which `processRequest` sends as is, without an envelope or ETag, because it is already JSON.'
    CurrentUserData:
      type: object
      description: Result of `findCurrentUser`, the current user as `findOne` serializes it, plus the session's memberships.
      required:
        - memberships
        - membershipids
        - isloggedin
      additionalProperties: true
      properties:
        memberships:
          type: array
          items:
            type: string
        membershipids:
          type: array
          items:
            type: string
        isloggedin:
          type: boolean
    JsonApiGroup:
      type: object
      description: A group as the JSON API serializes it.
      additionalProperties: true
      properties:
        id:
          type: string
        userid:
          type: string
        groupname:
          $ref: '#/components/schemas/NullableString'
        siteid:
          type: string
        ispublic:
          type: integer
        entityname:
          type: string
          const: group
        isnew:
          type: integer
          enum:
            - 0
            - 1
        links:
          type: object
          additionalProperties:
            type: string
    JsonApiGroupCollection:
      type: object
      description: A paged group collection as the JSON API serializes it.
      required:
        - items
      additionalProperties: true
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/JsonApiGroup'
        links:
          type: object
          additionalProperties:
            type: string
        pageindex:
          type: integer
        itemsperpage:
          type: integer
        totalpages:
          type: integer
        totalitems:
          type: integer
    JsonApiEntityMeta:
      type: object
      description: Result of `findProperties`, `findPermissions` or `validate` on the group entity.
      additionalProperties: true
    OAuthTokenInfo:
      type: object
      description: The session `mura` struct the token carries, without `csrfsecretkey`, `csrfusedtokens`, `isloggedin`, `lastlogin` and `password`; empty when the token holds no session.
      additionalProperties: true
    OAuthTokenResponse:
      type: object
      description: Bare OAuth token object of `oauth2` paths and of the `authorization_code` grant.
      required:
        - token_type
        - access_token
        - expires_in
        - expires_at
        - refresh_token
        - info
      additionalProperties: false
      properties:
        token_type:
          type: string
          const: Bearer
        access_token:
          type: string
        expires_in:
          type: integer
          description: Seconds until expiry.
        expires_at:
          type: integer
          description: Expiry in epoch seconds.
        refresh_token:
          type: string
        info:
          $ref: '#/components/schemas/OAuthTokenInfo'
    OAuthTokenEnvelope:
      type: object
      description: Token envelope of the `password`, `client_credentials` and `refresh_token` grants on `oauth` paths.
      required:
        - apiversion
        - method
        - data
      additionalProperties: false
      properties:
        apiversion:
          type: string
          const: v1
        method:
          type: string
          const: getOAuthToken
        data:
          $ref: '#/components/schemas/OAuthTokenResponse'
    OAuthTokenInfoResponse:
      type: object
      description: Bare `tokeninfo` answer for the `access_token` and `client_id` URL parameters.
      required:
        - token_type
        - access_token
        - expires_in
        - expires_at
        - info
      additionalProperties: false
      properties:
        token_type:
          type: string
          const: Bearer
        access_token:
          type: string
        expires_in:
          type: integer
        expires_at:
          type: integer
        info:
          $ref: '#/components/schemas/OAuthTokenInfo'
    SessionUser:
      type: object
      description: '`session.mura` as legacy holds it, without `password`, `csrfsecretkey` and `csrfusedtokens`; anonymous sessions carry empty values.'
      required:
        - isLoggedIn
        - userID
      additionalProperties: true
      properties:
        isLoggedIn:
          type: boolean
        userID:
          type: string
        username:
          type: string
        siteID:
          type: string
        subtype:
          type: string
        fname:
          type: string
        lname:
          type: string
        email:
          type: string
        remoteID:
          type: string
        company:
          type: string
        lastlogin:
          type: string
        passwordCreated:
          type: string
        memberships:
          type: string
          description: Comma list of membership entries such as `S2`, `S2IsPrivate` or `Admin;<privateUserPoolID>;0`.
        membershipids:
          type: string
          description: Comma list of group ids.
        showTrace:
          type: boolean
    CurrentSession:
      type: object
      required:
        - sessionId
        - epoch
        - user
        - roles
        - mfaPending
        - blockLoginUntil
      additionalProperties: false
      properties:
        sessionId:
          $ref: '#/components/schemas/NullableString'
        epoch:
          $ref: '#/components/schemas/NullableInteger'
        user:
          $ref: '#/components/schemas/SessionUser'
        roles:
          type: array
          description: Roles of the login-time snapshot.
          items:
            type: string
        mfaPending:
          type: boolean
          description: True while an MFA challenge awaits its code.
        blockLoginUntil:
          description: End of the login block after too many strikes.
          $ref: '#/components/schemas/NullableTimestamp'
    SessionSites:
      type: object
      required:
        - sites
      additionalProperties: false
      properties:
        sites:
          type: array
          items:
            type: object
            required:
              - siteID
