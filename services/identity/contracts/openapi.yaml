openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: identity
  version: 1.0.0
  description: 'API of the OPT-2 identity service: login, sessions, the CSRF ledger, groups, memberships, permissions, OAuth and site-scoped tokens; a breaking change takes a /v2/ prefix.'
  license:
    name: GPL-2.0-only
    identifier: GPL-2.0-only
  x-source-sha: 696383140578f8dea3ece26f80cd7bfb370ddf0f
servers:
  - url: http://127.0.0.1:8111
    description: local
x-opt2-calls:
  - people
  - gateway
tags:
  - name: legacy-api
    description: Masa JSON, AJAX and REST API routes identity serves once cut over.
  - name: sessions
    description: Admin login, logout and the current session.
  - name: csrf
    description: CSRF tokens and the cross-side single-use ledger.
  - name: groups
    description: Groups and group memberships; group deletes, and saves with extended attributes or a photo, stay on legacy because they also write content units.
  - name: permissions
    description: Content-node and module permissions; content-node permission saves stay on legacy because they also write the approval-chain assignment.
  - name: oauth-clients
    description: OAuth clients of the Web Services screen.
  - name: jwks
    description: Public keys of the local token signer.
  - name: internal
    description: Calls from the gateway and other services.
  - name: migration
    description: Owner endpoints the migration service calls.
  - name: events
    description: Pub/Sub push deliveries.
  - name: tasks
    description: Cloud Tasks deliveries and queue control.
  - name: health
    description: Liveness probe.
