          $ref: '#/components/schemas/FormValue'
        csrf_token:
          type: string
        csrf_token_expires:
          type: string
    LoginOutcome:
      type: object
      description: '`location` is the exact redirect legacy answers with; `csrf-invalid` leaves the session unchanged, `blocked` is a failure while the strike block holds, and `unattempted` (a valid token without both credentials) answers no redirect, so `location` is empty and the login view renders.'
