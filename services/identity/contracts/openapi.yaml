        LastLogin:
          $ref: '#/components/schemas/NullableTimestamp'
        tablist:
          $ref: '#/components/schemas/NullableString'
    AccountLookupRequest:
      type: object
      required:
        - userIds
      additionalProperties: false
      properties:
        userIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/CfUuid'
    AccountList:
      type: object
      required:
        - items
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccountRecord'
    SiteGroup:
      type: object
      description: One `Type=1` row of a site's user pool.
      required:
        - UserID
        - GroupName
        - SiteID
        - isPublic
        - Perm
      additionalProperties: false
      properties:
        UserID:
          $ref: '#/components/schemas/CfUuid'
        GroupName:
          $ref: '#/components/schemas/NullableString'
        SiteID:
          $ref: '#/components/schemas/SiteId'
        isPublic:
          type: integer
          enum:
            - 0
            - 1
        Perm:
          $ref: '#/components/schemas/NullableInteger'
    SiteGroupList:
      type: object
      required:
        - items
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SiteGroup'
    TaskWireBody:
      type: object
      description: JSON body both task adapters post; `tenantId` is null on system tasks.
      required:
        - queue
        - name
        - tenantId
      additionalProperties: true
      properties:
        queue:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        tenantId:
          type:
            - string
            - 'null'
          format: uuid
        payload: {}
    SystemTaskWireBody:
      description: Task wire body of a recurring system task, which names no tenant.
      allOf:
        - $ref: '#/components/schemas/TaskWireBody'
        - type: object
          required:
            - tenantId
          properties:
            tenantId:
              type: 'null'
    PushBody:
      type: object
      description: Pub/Sub push wrapper; `data` is the base64 event envelope.
      required:
        - message
        - subscription
      additionalProperties: true
      properties:
        message:
          type: object
          additionalProperties: true
          properties:
            data:
              type: string
              contentEncoding: base64
            attributes:
              type: object
              additionalProperties:
                type: string
            messageId:
              type: string
            message_id:
              type: string
            publishTime:
              type: string
            publish_time:
              type: string
            orderingKey:
              type: string
          allOf:
            - anyOf:
                - required:
                    - messageId
                  properties:
                    messageId:
                      minLength: 1
                - required:
                    - message_id
                  properties:
                    message_id:
                      minLength: 1
        subscription:
          type: string
          minLength: 1
          description: Usually `projects/<project>/subscriptions/<subscription>`, such as `identity.people.person.changed.v1`.
        deliveryAttempt:
          type: integer
    SweepResult:
      type: object
      description: Totals of one sweep and each recovery hook's outcome in run order.
      required:
        - published
        - failed
        - skipped
        - tenants
        - hooks
      additionalProperties: false
      properties:
        published:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
        tenants:
          type: integer
          minimum: 0
        hooks:
          type: array
          items:
            type: object
            required:
              - name
              - ok
            additionalProperties: false
            properties:
              name:
                type: string
              ok:
                type: boolean
    EnsureRecurringResult:
      type: object
      required:
        - queue
        - name
        - created
        - reason
      additionalProperties: false
      properties:
        queue:
          type: string
        name:
          type: string
        created:
          type: boolean
        reason:
          type: string
          enum:
            - live
            - created-current
            - created-next
    QueueControlResult:
      type: object
      description: The queue's paused state after pause or resume, or the chain task `ensure` found or created.
      required:
        - queue
        - service
      additionalProperties: false
      properties:
        queue:
          type: string
        service:
          type: string
          const: identity
        paused:
          type: boolean
        ensured:
          $ref: '#/components/schemas/EnsureRecurringResult'
    CanonicalType:
      type: string
      description: Canonical encoding tag.
      enum:
        - s
        - i
        - f
        - d
        - t
        - b
    CanonicalColumn:
      type: object
      required:
        - name
        - type
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        type:
          $ref: '#/components/schemas/CanonicalType'
        scale:
          type: integer
          minimum: 0
    WatermarkDirection:
      type: string
      enum:
        - forward
        - reverse
    WatermarkFields:
      type: object
      required:
        - direction
        - finishedAt
      properties:
        direction:
          $ref: '#/components/schemas/WatermarkDirection'
        snapshotSeq:
          type: integer
          minimum: 0
        backupLsn:
          type: string
          pattern: '^[0-9]{1,25}$'
        finishedAt:
          $ref: '#/components/schemas/WallClock'
    ApplyRequest:
      type: object
      description: One batch of canonical legacy rows for one legacy table and tenant; exactly one of `tenantId` and `siteId` is required.
      required:
        - batchId
        - origin
        - legacyTable
        - columns
        - rows
      oneOf:
        - required:
            - tenantId
        - required:
            - siteId
      additionalProperties: false
      properties:
        batchId:
          type: string
          minLength: 1
        origin:
          type: string
          enum:
            - backfill
            - migration-feed
            - legacy-window
        legacyTable:
          type: string
          minLength: 1
        tenantId:
          type: string
          format: uuid
          pattern: '^([0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[1-8][0-9A-Fa-f]{3}-[89ABab][0-9A-Fa-f]{3}-[0-9A-Fa-f]{12}|00000000-0000-0000-0000-000000000000|[Ff]{8}-[Ff]{4}-[Ff]{4}-[Ff]{4}-[Ff]{12})$'
        siteId:
          type: string
          minLength: 1
        legacyProgramId:
          type: integer
          minimum: 0
        columns:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CanonicalColumn'
        units:
          type: array
          items:
            type: string
            minLength: 1
        holderId:
          type: string
          minLength: 1
        rows:
          type: array
          items:
            type: object
            required:
              - op
              - row
            additionalProperties: false
            properties:
              op:
                type: string
                enum:
                  - upsert
                  - delete
                  - insert
              row:
                type: string
              discriminator:
                type:
                  - string
                  - number
        watermark:
          allOf:
            - $ref: '#/components/schemas/WatermarkFields'
          unevaluatedProperties: false
    ApplyResponse:
      type: object
      required:
        - batchId
        - duplicate
        - applied
        - skipped
      additionalProperties: false
      properties:
        batchId:
          type: string
        duplicate:
          type: boolean
        applied:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
    ObjectManifestEntry:
      type: object
      required:
        - key
        - size
        - sha256
      additionalProperties: false
      properties:
        key:
          type: string
        size:
          type: integer
          minimum: 0
        sha256:
          type: string
        contentType:
          type: string
        legacyPath:
          type: string
    ExportRow:
      type: object
      description: One row in legacy form; `key` is the whole-row encoding for keyless tables.
      required:
        - key
        - row
        - hash
      additionalProperties: false
      properties:
        key:
          type: string
        row:
          type: string
        hash:
          type: string
        legacyProgramId:
          type: integer
    ExportTable:
      type: object
      required:
        - unit
        - legacyTable
        - targetTable
        - keyless
        - columns
        - rows
      additionalProperties: false
      properties:
        unit:
          type: string
        legacyTable:
          type: string
        targetTable:
          type: string
        keyless:
          type: boolean
        columns:
          type: array
          items:
            $ref: '#/components/schemas/CanonicalColumn'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ExportRow'
    ExportResponse:
      type: object
      description: One export page; `next` is null after the last page, and `objects` comes with the first page only.
      required:
        - unit
        - tenantId
        - tables
        - next
      additionalProperties: false
      properties:
        unit:
          type: string
        tenantId:
          type: string
          format: uuid
        tables:
          type: array
          items:
            $ref: '#/components/schemas/ExportTable'
        next:
          type:
            - string
            - 'null'
        objects:
          type: array
          items:
            $ref: '#/components/schemas/ObjectManifestEntry'
    ChangeOp:
      type: string
      enum:
        - insert
        - update
        - delete
    ChangeOrigin:
      type: string
      enum:
        - target
        - legacy-window
        - migration-feed
        - backfill
    LegacyChange:
      type: object
      description: A changelog row in the legacy form of one mapping; `columns` are legacy names.
      required:
        - unit
        - legacyTable
        - key
        - before
        - after
        - columns
      additionalProperties: false
      properties:
        unit:
          type: string
        legacyTable:
          type: string
        key:
          type: string
        before:
          $ref: '#/components/schemas/NullableString'
        after:
          $ref: '#/components/schemas/NullableString'
        columns:
          type: array
          items:
            type: string
        legacyProgramId:
          type: integer
    ProjectedChangeRow:
      type: object
      description: One changelog row; `xid` and `seq` are decimal strings, `at` is `YYYY-MM-DD HH:MM:SS.mmm`.
      required:
        - xid
        - seq
        - table
        - op
        - key
        - before
        - after
        - columns
        - origin
        - actorUserId
        - actorService
        - at
        - requestId
        - operationId
        - legacy
      additionalProperties: false
      properties:
        xid:
          type: string
          pattern: '^[0-9]+$'
        seq:
          type: string
          pattern: '^[0-9]+$'
        table:
          type: string
        op:
          $ref: '#/components/schemas/ChangeOp'
        key:
          type: string
        before:
          $ref: '#/components/schemas/NullableString'
        after:
          $ref: '#/components/schemas/NullableString'
        columns:
          type: array
          items:
            type: string
        origin:
          $ref: '#/components/schemas/ChangeOrigin'
        actorUserId:
          $ref: '#/components/schemas/NullableString'
        actorService:
          $ref: '#/components/schemas/NullableString'
        at:
          type: string
        requestId:
          $ref: '#/components/schemas/NullableString'
        operationId:
          $ref: '#/components/schemas/NullableString'
        legacy:
          type: array
          items:
            $ref: '#/components/schemas/LegacyChange'
    OperationStatus:
      type: string
      enum:
        - open
        - done
        - rolled-back
    ChangesResponse:
      type: object
      description: Rows below `horizon` in `(xid, seq)` order; `horizon` counts as applied only when `complete`.
      required:
        - rows
        - cursor
        - horizon
        - complete
        - operations
      additionalProperties: false
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ProjectedChangeRow'
        cursor:
          type: string
          pattern: '^[0-9]+:[0-9]+$'
        horizon:
          type: string
          pattern: '^[0-9]+$'
        complete:
          type: boolean
        operations:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/OperationStatus'
    TenantDrainCount:
      type: object
      required:
        - tenantId
        - unpublished
        - held
      additionalProperties: false
      properties:
        tenantId:
          type: string
        unpublished:
          type: integer
          minimum: 0
        held:
          type: integer
          minimum: 0
    OutboxDrainCounts:
      type: object
      required:
        - tenants
        - unpublished
        - held
      additionalProperties: false
      properties:
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/TenantDrainCount'
        unpublished:
          type: integer
          minimum: 0
        held:
          type: integer
          minimum: 0
    InboxCounts:
      type: object
      description: Inbox receipts over every registered tenant; `receipts` maps each asked event id to the tenants that applied it.
      required:
        - total
        - bySubscription
      additionalProperties: false
      properties:
        total:
          type: integer
          minimum: 0
        bySubscription:
          type: object
          additionalProperties:
            type: integer
        receipts:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    PositionResponse:
      type: object
      description: The latest assigned xid and the drain counts; `outbox` or `inbox` is null where the service has no such table.
      required:
        - owner
        - position
        - outbox
        - inbox
      additionalProperties: false
      properties:
        owner:
          type: string
          const: identity
        position:
          type: string
          pattern: '^[0-9]+$'
        outbox:
          oneOf:
            - $ref: '#/components/schemas/OutboxDrainCounts'
            - type: 'null'
        inbox:
          oneOf:
            - $ref: '#/components/schemas/InboxCounts'
            - type: 'null'
        published:
          type: array
          description: Published outbox events of the asked `publishedTopics`; present only when asked, empty without an outbox.
          items:
            $ref: '#/components/schemas/PublishedEvent'
    PublishedEvent:
      type: object
      description: A published outbox event and the tenant of its envelope.
      required:
        - eventId
        - topic
        - tenantId
      additionalProperties: false
      properties:
        eventId:
          type: string
          format: uuid
        topic:
          type: string
        tenantId:
          type: string
          format: uuid
    WatermarkRecord:
      type: object
      required:
        - legacyTable
        - direction
        - snapshotSeq
        - backupLsn
        - finishedAt
      additionalProperties: false
      properties:
        legacyTable:
          type: string
        direction:
          $ref: '#/components/schemas/WatermarkDirection'
        snapshotSeq:
          type:
            - integer
            - 'null'
        backupLsn:
          $ref: '#/components/schemas/NullableString'
        finishedAt:
          $ref: '#/components/schemas/LocalTimestamp'
    WatermarkInput:
      description: A watermark to record for one legacy table.
      allOf:
        - $ref: '#/components/schemas/WatermarkFields'
        - type: object
          required:
            - legacyTable
          properties:
            legacyTable:
              type: string
              minLength: 1
      unevaluatedProperties: false
    GateState:
      type: string
      enum:
        - legacy
        - open
        - closed
    GatePhase:
      type: string
      enum:
        - quiet
        - executing
        - importing
        - import-pending
    UnitList:
      type: array
      minItems: 1
      items:
        type: string
        minLength: 1
    GateRequest:
      description: One gate operation, selected by `op`.
      oneOf:
        - $ref: '#/components/schemas/GateClose'
        - $ref: '#/components/schemas/GatePhaseChange'
        - $ref: '#/components/schemas/GateOpen'
        - $ref: '#/components/schemas/GateStatus'
      discriminator:
        propertyName: op
        mapping:
          close: '#/components/schemas/GateClose'
          phase: '#/components/schemas/GatePhaseChange'
          open: '#/components/schemas/GateOpen'
          status: '#/components/schemas/GateStatus'
    GateClose:
      type: object
      description: Closes the units' gates for a holder; `allowLegacy` lets a transition close units still `legacy`.
      required:
        - op
        - units
        - holderId
      additionalProperties: false
      properties:
        op:
          type: string
          const: close
        units:
          $ref: '#/components/schemas/UnitList'
        holderId:
          type: string
          minLength: 1
        phase:
          $ref: '#/components/schemas/GatePhase'
        allowLegacy:
          type: boolean
        timeoutMs:
          type: integer
          minimum: 1
          maximum: 30000
    GatePhaseChange:
      type: object
      description: Sets the phase of gates the holder closed.
      required:
        - op
        - units
        - holderId
        - phase
      additionalProperties: false
      properties:
        op:
          type: string
          const: phase
        units:
          $ref: '#/components/schemas/UnitList'
        holderId:
          type: string
          minLength: 1
        phase:
          $ref: '#/components/schemas/GatePhase'
    GateOpen:
      type: object
      description: Reopens the holder's gates as `open`, or sets them to `legacy`.
      required:
        - op
        - units
        - holderId
      additionalProperties: false
      properties:
        op:
          type: string
          const: open
        units:
          $ref: '#/components/schemas/UnitList'
        holderId:
          type: string
          minLength: 1
        state:
          type: string
          enum:
            - open
            - legacy
    GateStatus:
      type: object
      description: Reads the gates; every unit of this owner when `units` is omitted.
      required:
        - op
      additionalProperties: false
      properties:
        op:
          type: string
          const: status
        units:
          $ref: '#/components/schemas/UnitList'
        holderId:
          type: string
          minLength: 1
    UnitGate:
      type: object
      required:
        - unit
        - state
        - holderId
        - phase
      additionalProperties: false
      properties:
        unit:
          type: string
        state:
          $ref: '#/components/schemas/GateState'
        holderId:
          $ref: '#/components/schemas/NullableString'
        phase:
          $ref: '#/components/schemas/GatePhase'
    GateResponse:
      type: object
      required:
        - units
      additionalProperties: false
      properties:
        units:
          type: array
          items:
            $ref: '#/components/schemas/UnitGate'
    GateConflict:
      type: object
      description: The units whose gate another holder owns.
      required:
        - error
        - units
      additionalProperties: false
      properties:
        error:
          type: string
          const: gate-conflict
        units:
          type: array
          items:
            type: string
