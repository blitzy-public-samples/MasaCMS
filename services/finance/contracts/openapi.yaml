  /opt2/files/finance-attachments/{tenantId}/{objectName}:
    parameters:
      - name: tenantId
        in: path
        required: true
        description: First segment of the object key `<tenantId>/<id>.<ext>`.
        schema:
          type: string
          format: uuid
      - name: objectName
        in: path
        required: true
        description: Second segment of the object key, a CF id (the attachment's, or a new one for each changed version of migrated bytes) and extension.
        schema:
          type: string
          pattern: '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{16}\.[^/]+$'
    get:
      operationId: getLocalAttachmentObject
      summary: Serves an attachment object of the local storage adapter through its signed URL.
      description: The signature is the credential, checked with `verifySignedUrl` of `@opt2/platform/storage`; only the local adapter issues these URLs.
      tags:
        - internal
      x-opt2-transport: service
      x-opt2-public: true
      security: []
      parameters:
        - name: expires
          in: query
          required: true
          description: Expiry in epoch seconds.
          schema:
            type: integer
            minimum: 0
        - name: sig
          in: query
          required: true
          description: Lowercase hex HMAC-SHA256 over the bucket, key, expiry and any disposition.
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
        - name: disposition
          in: query
          required: false
          description: Signed Content-Disposition of the download.
          schema:
            type: string
      responses:
        '200':
          description: The object bytes under their stored content type.
          headers:
            Content-Disposition:
              description: The signed `disposition`, when the URL carries one.
              schema:
                type: string
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/FixtureForbidden'
          description: The signature is malformed, wrong or expired.
        '404':
          $ref: '#/components/responses/FixtureNotFound'
          description: No object is stored under the key.
  /internal/v1/events/finance.programs-sites.site.changed.v1:
    post:
      operationId: pushProgramsSitesSiteChanged
      summary: Receives push deliveries of `programs-sites.site.changed.v1` into this service's tenant registry.
      tags:
        - internal
      x-opt2-transport: pubsub-push
      x-opt2-requires:
        - service:pubsub-invoker
      security:
        - pubsubPushOidc: []
        - localPushKey: []
      parameters:
        - $ref: '#/components/parameters/PushKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushBody'
      responses:
        '204':
          description: Acknowledged; the delivery was applied, already applied, or dead-lettered.
        '400':
          description: Not a push body; a nack.
        '401':
          $ref: '#/components/responses/FixtureUnauthorized'
        '403':
          $ref: '#/components/responses/FixtureForbidden'
        '500':
          $ref: '#/components/responses/FixtureServerError'
          description: Processing failed; a nack, redelivered by Pub/Sub.
        '503':
          $ref: '#/components/responses/LegacyUnavailable503'
          description: A unit gate or the database is unavailable; a nack, redelivered by Pub/Sub.
