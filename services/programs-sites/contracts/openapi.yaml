openapi: 3.1.0
info:
  title: programs-sites
  version: 1.0.0
  description: 'API of the OPT-2 programs-sites service: Masa sites as tenants, site settings, image sizes, the site registry and the site monitor; a breaking change takes a /v2/ prefix.'
  x-source-sha: 696383140578f8dea3ece26f80cd7bfb370ddf0f
servers:
  - url: http://127.0.0.1:8113
    description: local
x-opt2-calls:
  - identity
  - migration
security:
  - userToken: []
    invocationCredential: []
paths:
  /_api/json/v1/{siteid}/site:
    parameters:
      - $ref: '#/components/parameters/LegacySiteId'
    get:
      operationId: jsonSiteGet
      summary: Reads the site entity through the JSON API.
      x-opt2-transport: service
      x-opt2-public: true
      security: []
      parameters:
        - $ref: '#/components/parameters/LegacyMethod'
      responses:
        '200':
          $ref: '#/components/responses/SiteRead'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: jsonSitePost
      summary: Calls a site entity method through the JSON API; `save` requires S2 and the site id as CSRF context.
      x-opt2-transport: service
      x-opt2-public: true
      security: []
      parameters:
        - $ref: '#/components/parameters/LegacyMethod'
        - $ref: '#/components/parameters/CsrfTokenHeader'
        - $ref: '#/components/parameters/CsrfExpiresHeader'
      requestBody:
        $ref: '#/components/requestBodies/LegacySiteCall'
      responses:
        '200':
          $ref: '#/components/responses/SiteWrite'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/SiteSaveRejected'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /_api/ajax/v1/{siteid}/site:
    parameters:
      - $ref: '#/components/parameters/LegacySiteId'
    get:
      operationId: ajaxSiteGet
      summary: Reads the site entity through the AJAX API.
      x-opt2-transport: service
      x-opt2-public: true
      security: []
      parameters:
        - $ref: '#/components/parameters/LegacyMethod'
      responses:
        '200':
          $ref: '#/components/responses/SiteRead'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: ajaxSitePost
      summary: Calls a site entity method through the AJAX API; `save` requires S2 and the site id as CSRF context.
      x-opt2-transport: service
      x-opt2-public: true
      security: []
      parameters:
        - $ref: '#/components/parameters/LegacyMethod'
        - $ref: '#/components/parameters/CsrfTokenHeader'
        - $ref: '#/components/parameters/CsrfExpiresHeader'
      requestBody:
        $ref: '#/components/requestBodies/LegacySiteCall'
      responses:
        '200':
          $ref: '#/components/responses/SiteWrite'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/SiteSaveRejected'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /_api/rest/v1/{siteid}/site:
    parameters:
      - $ref: '#/components/parameters/LegacySiteId'
    get:
      operationId: restSiteGet
      summary: Reads the site entity through the sessionless REST API, which answers 401 without Basic or Bearer credentials.
      x-opt2-transport: service
      x-opt2-public: true
      security: []
      parameters:
        - $ref: '#/components/parameters/LegacyMethod'
      responses:
        '200':
          $ref: '#/components/responses/SiteRead'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: restSitePost
      summary: Calls a site entity method through the sessionless REST API, where `save` requires S2 and checks no CSRF token.
      x-opt2-transport: service
      x-opt2-public: true
      security: []
      parameters:
        - $ref: '#/components/parameters/LegacyMethod'
      requestBody:
        $ref: '#/components/requestBodies/LegacySiteCall'
      responses:
        '200':
          $ref: '#/components/responses/SiteWrite'
        '400':
          $ref: '#/components/responses/LegacyBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/SiteSaveRejected'
        '404':
          $ref: '#/components/responses/LegacyNotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /_api/sitemonitor:
    get:
      operationId: sitemonitorRunGet
      summary: Runs the site-monitor orchestrator; every path starting `/_api/sitemonitor` in any letter case, also behind `/index.cfm`, is the same route.
      x-opt2-transport: service
      x-opt2-public: true
      security: []
      responses:
        '200':
          $ref: '#/components/responses/SiteMonitorRan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
          description: A step failed, so the cursor stays where it was.
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: sitemonitorRunPost
      summary: Runs the site-monitor orchestrator; every path starting `/_api/sitemonitor` in any letter case, also behind `/index.cfm`, is the same route.
      x-opt2-transport: service
      x-opt2-public: true
      security: []
      responses:
        '200':
          $ref: '#/components/responses/SiteMonitorRan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
          description: A step failed, so the cursor stays where it was.
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/sites:
    get:
      operationId: listSites
      summary: Lists every site for the Sites screen, sorted as legacy sorts it.
      x-opt2-transport: service
      x-opt2-requires:
        - s2
      parameters:
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortDirection'
      responses:
        '200':
          description: The sites.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SiteListItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/sites/order:
    post:
      operationId: saveSiteOrder
      summary: Saves the bind order and batch-deploy flags of the Sites screen under CSRF context `updatesites`.
      x-opt2-transport: service
      x-opt2-requires:
        - s2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteOrderUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SiteOrderUpdate'
      responses:
        '200':
          description: The sites after the change; `written` is false and nothing changed when the CSRF token is missing or invalid.
          headers:
            X-Opt2-Write-Position:
              $ref: '#/components/headers/XOpt2WritePosition'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteOrderResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/sites/{siteId}:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    get:
      operationId: getSite
      summary: Reads one site with the data of every Edit Site tab; an unknown id yields the defaulted new site.
      x-opt2-transport: service
      x-opt2-requires:
        - s2
        - site-admin
      responses:
        '200':
          description: The site detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/sites/{siteId}/shell:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    get:
      operationId: getShellSite
      summary: Reads the site settings the admin layout uses, for any private admin user; an unknown id yields the defaulted new site.
      x-opt2-transport: service
      x-opt2-requires:
        - s2
        - site-admin
        - system-user
      responses:
        '200':
          description: The site's layout settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShellSiteDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/sites/{siteId}/update:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    post:
      operationId: updateSite
      summary: Updates the site's settings as Edit Site saves them, with the site id as CSRF context.
      x-opt2-transport: service
      x-opt2-requires:
        - s2
        - site-admin
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
        - $ref: '#/components/parameters/CsrfExpiresHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SiteUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SiteUpdate'
      responses:
        '200':
          description: The site after the request; validation errors leave `errors` non-empty, and a failed CSRF check writes nothing.
          headers:
            X-Opt2-Write-Position:
              $ref: '#/components/headers/XOpt2WritePosition'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteUpdateResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
          description: A placeholder-image change, Razuna settings or a bundle deploy, which stay on legacy; nothing is written.
  /v1/sites/{siteId}/image-sizes:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    get:
      operationId: listImageSizes
      summary: Lists the site's custom image sizes.
      x-opt2-transport: service
      x-opt2-requires:
        - s2
        - site-admin
      responses:
        '200':
          $ref: '#/components/responses/ImageSizes'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/sites/{siteId}/image-sizes/{sizeId}:
    parameters:
      - $ref: '#/components/parameters/SiteId'
      - $ref: '#/components/parameters/SizeId'
    get:
      operationId: getImageSize
      summary: Reads one custom image size; an unknown id yields the defaulted new size.
      x-opt2-transport: service
      x-opt2-requires:
        - s2
        - site-admin
      responses:
        '200':
          description: The image size.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageSize'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
    put:
      operationId: saveImageSize
      summary: Creates or updates a custom image size and returns the site's sizes.
      x-opt2-transport: service
      x-opt2-requires:
        - s2
        - site-admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageSizeInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ImageSizeInput'
      responses:
        '200':
          $ref: '#/components/responses/ImageSizesWritten'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      operationId: deleteImageSize
      summary: Deletes a custom image size and returns the site's sizes.
      x-opt2-transport: service
      x-opt2-requires:
        - s2
        - site-admin
      responses:
        '200':
          $ref: '#/components/responses/ImageSizesWritten'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/href-domains:
    get:
      operationId: getHrefDomains
      summary: Reads the registered domains and the site domain that utility.sanitizeHref checks an absolute href against.
      x-opt2-transport: service
      x-opt2-requires:
        - service:gateway
      security:
        - invocationCredential: []
        - userToken: []
          invocationCredential: []
      parameters:
        - $ref: '#/components/parameters/HrefSiteId'
      responses:
        '200':
          description: The domains.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HrefDomains'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'

  /internal/v1/migration/apply:
    post:
      operationId: migrationApply
      summary: Applies one batch of canonical legacy rows to the owned units, once per batch id.
      x-opt2-transport: service
      x-opt2-requires:
        - platform.migration
      security:
        - invocationCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyRequest'
      responses:
        '200':
          description: The batch outcome; a repeated batch id is a no-op reported as `duplicate`.
          headers:
            X-Opt2-Write-Position:
              $ref: '#/components/headers/XOpt2WritePosition'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/migration/export:
    get:
      operationId: migrationExport
      summary: Exports one page of a unit's rows in canonical legacy form.
      x-opt2-transport: service
      x-opt2-requires:
        - platform.migration
      security:
        - invocationCredential: []
      parameters:
        - name: unit
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/MigrationTenantId'
        - $ref: '#/components/parameters/MigrationSiteId'
        - name: programId
          in: query
          required: false
          description: Restricts a folded unit to one `Program_<id>` schema.
          schema:
            $ref: '#/components/schemas/DigitString'
        - name: after
          in: query
          required: false
          description: The previous page's `next` cursor.
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: One export page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/migration/changes:
    get:
      operationId: migrationChanges
      summary: Reads the tenant's changelog after a cursor, below the commit-safe horizon.
      x-opt2-transport: service
      x-opt2-requires:
        - platform.migration
      security:
        - invocationCredential: []
      parameters:
        - $ref: '#/components/parameters/MigrationTenantId'
        - $ref: '#/components/parameters/MigrationSiteId'
        - name: after
          in: query
          required: false
          description: Cursor `<xid>:<seq>`; `0:0` when omitted.
          schema:
            type: string
            pattern: '^(0|[1-9][0-9]*):(0|[1-9][0-9]*)$'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: One page of changes with their legacy projections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/migration/position:
    get:
      operationId: migrationPosition
      summary: Reports the current write position and the outbox and inbox drain counts.
      x-opt2-transport: service
      x-opt2-requires:
        - platform.migration
      security:
        - invocationCredential: []
      parameters:
        - name: eventIds
          in: query
          required: false
          description: Comma-separated event ids whose inbox receipts are reported.
          schema:
            type: string
        - name: publishedTopics
          in: query
          required: false
          description: Comma-separated topics whose published outbox events are listed in `published`.
          schema:
            type: string
      responses:
        '200':
          description: The owner's position.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/migration/watermark:
    get:
      operationId: migrationWatermarkGet
      summary: Lists feed watermarks, optionally for one legacy table or direction.
      x-opt2-transport: service
      x-opt2-requires:
        - platform.migration
      security:
        - invocationCredential: []
      parameters:
        - name: legacyTable
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: direction
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/WatermarkDirection'
      responses:
        '200':
          description: Watermarks ordered by legacy table and direction.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WatermarkRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: migrationWatermarkPost
      summary: Records the feed watermark of one legacy table and direction.
      x-opt2-transport: service
      x-opt2-requires:
        - platform.migration
      security:
        - invocationCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatermarkInput'
      responses:
        '200':
          description: The stored watermark.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatermarkRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/migration/gate:
    post:
      operationId: migrationGate
      summary: Closes, re-phases, opens or reads the unit gates of this owner.
      x-opt2-transport: service
      x-opt2-requires:
        - platform.migration
      security:
        - invocationCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GateRequest'
      responses:
        '200':
          description: The gates after the operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Another holder owns a gate, so the compare-and-set was refused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GateConflict'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
          description: The gates could not close within the wait budget.
  /internal/v1/events/programs-sites.programs-sites.site.changed.v1:
    post:
      operationId: pushSiteChanged
      summary: Receives push deliveries of `programs-sites.site.changed.v1` into this service's tenant registry.
      x-opt2-transport: pubsub-push
      x-opt2-requires:
        - service:pubsub-invoker
      security:
        - pubsubPushOidc: []
        - localPushKey: []
      parameters:
        - $ref: '#/components/parameters/PushKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushBody'
      responses:
        '204':
          description: Acknowledged; the delivery was applied, already applied, or dead-lettered.
        '400':
          description: Not a push body; a nack.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
          description: Processing failed; a nack, redelivered by Pub/Sub.
        '503':
          $ref: '#/components/responses/Unavailable'
          description: A unit gate or the database is unavailable; a nack, redelivered by Pub/Sub.
  /internal/v1/outbox/sweep:
    post:
      operationId: outboxSweep
      summary: Creates the next sweep task, then publishes every unpublished outbox row per registry tenant.
      x-opt2-transport: cloud-tasks
      x-opt2-requires:
        - service:tasks-invoker
      security:
        - tasksInvokerOidc: []
      parameters:
        - $ref: '#/components/parameters/CloudTasksTaskName'
        - $ref: '#/components/parameters/CloudTasksQueueName'
        - $ref: '#/components/parameters/CloudTasksRetryCount'
        - $ref: '#/components/parameters/CloudTasksExecutionCount'
        - $ref: '#/components/parameters/CloudTasksEta'
      requestBody:
        $ref: '#/components/requestBodies/SystemTask'
      responses:
        '200':
          description: The sweep totals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SweepResult'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: A malformed task body, or one carrying a tenant.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
          description: The sweep failed, so Cloud Tasks retries this task.
        '503':
          $ref: '#/components/responses/Unavailable'
          description: The successor task could not be created, so Cloud Tasks retries this one.
  /internal/v1/jobs/sitemonitor:
    post:
      operationId: jobSitemonitor
      summary: Creates the next site-monitor task on `programs-sites-sitemonitor` (900 s interval, 600 s deadline), then runs the orchestrator.
      x-opt2-transport: cloud-tasks
      x-opt2-requires:
        - service:tasks-invoker
      security:
        - tasksInvokerOidc: []
      parameters:
        - $ref: '#/components/parameters/CloudTasksTaskName'
        - $ref: '#/components/parameters/CloudTasksQueueName'
        - $ref: '#/components/parameters/CloudTasksRetryCount'
        - $ref: '#/components/parameters/CloudTasksExecutionCount'
        - $ref: '#/components/parameters/CloudTasksEta'
      requestBody:
        $ref: '#/components/requestBodies/SystemTask'
      responses:
        '200':
          description: The run's cursor and steps.
          headers:
            X-Opt2-Write-Position:
              $ref: '#/components/headers/XOpt2WritePosition'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteMonitorRunResult'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: A malformed task body, or one carrying a tenant.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
          description: The run failed, so Cloud Tasks retries this task.
        '503':
          $ref: '#/components/responses/Unavailable'
          description: The successor task could not be created or a write window could not open, so Cloud Tasks retries this one.
  /internal/v1/task-queues/{queue}/pause:
    parameters:
      - $ref: '#/components/parameters/Queue'
    post:
      operationId: pauseTaskQueue
      summary: Pauses dispatch from a queue this service creates tasks on.
      x-opt2-transport: service
      x-opt2-requires:
        - platform.migration
        - platform.operator
      security:
        - invocationCredential: []
      responses:
        '200':
          $ref: '#/components/responses/QueueControlled'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: The queue is not one this service creates tasks on.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/task-queues/{queue}/resume:
    parameters:
      - $ref: '#/components/parameters/Queue'
    post:
      operationId: resumeTaskQueue
      summary: Resumes dispatch from a queue this service creates tasks on.
      x-opt2-transport: service
      x-opt2-requires:
        - platform.migration
        - platform.operator
      security:
        - invocationCredential: []
      responses:
        '200':
          $ref: '#/components/responses/QueueControlled'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: The queue is not one this service creates tasks on.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/task-queues/{queue}/ensure:
    parameters:
      - $ref: '#/components/parameters/Queue'
    post:
      operationId: ensureTaskQueue
      summary: Ensures a recurring chain this service creates has a live task.
      x-opt2-transport: service
      x-opt2-requires:
        - platform.migration
        - platform.operator
      security:
        - invocationCredential: []
      responses:
        '200':
          $ref: '#/components/responses/QueueControlled'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: The queue is not a recurring chain this service creates.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/sitemonitor/state:
    get:
      operationId: getSitemonitorState
      summary: Reads the site-monitor cursor.
      x-opt2-transport: service
      x-opt2-requires:
        - platform.migration
      security:
        - invocationCredential: []
      responses:
        '200':
          $ref: '#/components/responses/SiteMonitorStateBody'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
    put:
      operationId: putSitemonitorState
      summary: Seeds the site-monitor cursor at a scheduler hand-off.
      x-opt2-transport: service
      x-opt2-requires:
        - platform.migration
      security:
        - invocationCredential: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteMonitorStateInput'
      responses:
        '200':
          $ref: '#/components/responses/SiteMonitorStateBody'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe.
      x-opt2-transport: service
      x-opt2-public: true
      security: []
      responses:
        '200':
          description: The service is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: A presented credential is invalid.

components:
  securitySchemes:
    userToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Site-scoped user token in `Authorization`, minted by identity and attached by the gateway.
    invocationCredential:
      type: apiKey
      in: header
      name: X-Serverless-Authorization
      description: Caller's invocation credential; a Google-signed ID token in the cloud, a local service token locally.
    pubsubPushOidc:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC token of `pubsub-invoker` in `Authorization`, addressed to the push endpoint.
    localPushKey:
      type: apiKey
      in: query
      name: key
      description: Local emulator push key, compared in constant time.
    tasksInvokerOidc:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC token of `tasks-invoker` in `Authorization` in the cloud; a local `tasks-invoker` service token locally.
  headers:
    Generator:
      description: Legacy generator header.
      schema:
        type: string
        const: Masa CMS 7.6.1
    StrictTransportSecurity:
      description: Legacy HSTS header.
      schema:
        type: string
        const: max-age=1200
    ETag:
      description: Uppercase hex SHA-256 of the exact body, unquoted, as ColdFusion `hash()` computes it.
      schema:
        type: string
        pattern: '^[0-9A-F]{64}$'
    AccessControlAllowOrigin:
      description: The request `Origin`, echoed when its host is a site domain, a domain alias or a sub-domain of one.
      schema:
        type: string
    AccessControlAllowCredentials:
      description: Sent with an echoed origin.
      schema:
        type: string
        const: 'true'
    WWWAuthenticate:
      description: Challenge legacy sets before an authentication failure.
      schema:
        type: string
    XOpt2WritePosition:
      description: Committed write positions `<owner>=<xid>[,<owner>=<xid>…]`; the gateway strips it from client responses.
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]*=[0-9]+(,[a-z0-9][a-z0-9-]*=[0-9]+)*$'
  parameters:
    LegacySiteId:
      name: siteid
      in: path
      required: true
      description: Legacy site id, equal to the token's `site` when a user is present (403 otherwise); an unknown site is handled by the `default` site's API.
      schema:
        type: string
        minLength: 1
        examples:
          - default
    LegacyMethod:
      name: method
      in: query
      required: false
      description: Entity-generic method, also as `site.<method>` and as a form or JSON body field; `findOne` when omitted, and `delete` is not served here.
      schema:
        type: string
        examples:
          - findOne
          - findMany
          - findAll
          - findNew
          - findQuery
          - findProperties
          - findPermissions
          - validate
          - save
          - site.findOne
    CsrfTokenHeader:
      name: X-csrf_token
      in: header
      required: false
      description: CSRF token, an alternative to the `csrf_token` field.
      schema:
        type: string
    CsrfExpiresHeader:
      name: X-csrf_token_expires
      in: header
      required: false
      description: CSRF token expiry `yyMMddHHnnsslll`, an alternative to the `csrf_token_expires` field.
      schema:
        type: string
    SiteId:
      name: siteId
      in: path
      required: true
      description: Legacy site id, equal to the token's `site` (403 otherwise).
      schema:
        type: string
        minLength: 1
        maxLength: 25
        examples:
          - tenant-a
    SizeId:
      name: sizeId
      in: path
      required: true
      description: Image size id; a new size is saved under the id its defaulted bean carries.
      schema:
        type: string
        minLength: 1
        maxLength: 35
    HrefSiteId:
      name: siteid
      in: query
      required: false
      description: Legacy session site id, equal to the token's `site` when a user is present (403 otherwise); empty or naming no site selects `default`.
      schema:
        type: string
        examples:
          - default
    SortBy:
      name: sortBy
      in: query
      required: false
      description: Sort column; `site`, `domain` or `orderno`, and any other value sorts by `orderno`.
      schema:
        type: string
        default: site
    SortDirection:
      name: sortDirection
      in: query
      required: false
      description: Sort direction; `asc` or `desc`, and any other value sorts ascending.
      schema:
        type: string
        default: asc
    MigrationTenantId:
      name: tenantId
      in: query
      required: false
      description: Tenant UUID; exactly one of `tenantId` and `siteId` is required.
      schema:
        type: string
        format: uuid
        pattern: '^([0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[1-8][0-9A-Fa-f]{3}-[89ABab][0-9A-Fa-f]{3}-[0-9A-Fa-f]{12}|00000000-0000-0000-0000-000000000000|[Ff]{8}-[Ff]{4}-[Ff]{4}-[Ff]{4}-[Ff]{12})$'
    MigrationSiteId:
      name: siteId
      in: query
      required: false
      description: Legacy site id resolved to its tenant; exactly one of `tenantId` and `siteId` is required.
      schema:
        type: string
        minLength: 1
    PageLimit:
      name: limit
      in: query
      required: false
      description: Page size, 1 to 10000; 1000 when omitted.
      schema:
        $ref: '#/components/schemas/DigitString'
    PushKey:
      name: key
      in: query
      required: false
      description: Local emulator push key; absent in the cloud.
      schema:
        type: string
    CloudTasksTaskName:
      name: X-CloudTasks-TaskName
      in: header
      required: false
      description: Task id; the body's `name` when absent.
      schema:
        type: string
    CloudTasksQueueName:
      name: X-CloudTasks-QueueName
      in: header
      required: false
      description: Queue name; the body's `queue` when absent.
      schema:
        type: string
    CloudTasksRetryCount:
      name: X-CloudTasks-TaskRetryCount
      in: header
      required: false
      schema:
        type: string
        pattern: '^[0-9]+$'
    CloudTasksExecutionCount:
      name: X-CloudTasks-TaskExecutionCount
      in: header
      required: false
      schema:
        type: string
        pattern: '^[0-9]+$'
    CloudTasksEta:
      name: X-CloudTasks-TaskETA
      in: header
      required: false
      description: Scheduled time in epoch seconds.
      schema:
        type: string
    Queue:
      name: queue
      in: path
      required: true
      description: A queue this service creates tasks on; `ensure` accepts only the recurring `programs-sites-sitemonitor` and `programs-sites-outbox-sweep`.
      schema:
        type: string
        enum:
          - content-scheduled-publish
          - content-feed-import
          - programs-sites-sitemonitor
          - programs-sites-outbox-sweep
  requestBodies:
    LegacySiteCall:
      required: false
      description: Merged with the query string as legacy merges url, form and a JSON body; later sources win.
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/LegacySiteCallBody'
        multipart/form-data:
          schema:
            $ref: '#/components/schemas/LegacySiteCallBody'
        application/json:
          schema:
            $ref: '#/components/schemas/LegacySiteCallBody'
    SystemTask:
      required: true
      description: Task wire body of a tenant-less system task.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SystemTaskWireBody'
  responses:
    SiteRead:
      description: The site entity or a site collection in the legacy envelope.
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AccessControlAllowOrigin'
        Access-Control-Allow-Credentials:
          $ref: '#/components/headers/AccessControlAllowCredentials'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/SiteEnvelope'
    SiteWrite:
      description: The method's result in the legacy envelope; a save returns the saved site.
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AccessControlAllowOrigin'
        Access-Control-Allow-Credentials:
          $ref: '#/components/headers/AccessControlAllowCredentials'
        X-Opt2-Write-Position:
          $ref: '#/components/headers/XOpt2WritePosition'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/SiteEnvelope'
    SiteSaveRejected:
      description: A save whose `data.errors` is non-empty, or a `siteid` other than the token's site.
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json;charset=utf-8:
          schema:
            anyOf:
              - $ref: '#/components/schemas/SiteEnvelope'
              - $ref: '#/components/schemas/LegacyError'
    SiteMonitorRan:
      description: The run finished; the body is empty, as legacy returns it.
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        X-Opt2-Write-Position:
          $ref: '#/components/headers/XOpt2WritePosition'
      content:
        text/html;charset=UTF-8:
          schema:
            type: string
            maxLength: 0
    ImageSizes:
      description: The site's custom image sizes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ImageSizeList'
    ImageSizesWritten:
      description: The site's custom image sizes after the change.
      headers:
        X-Opt2-Write-Position:
          $ref: '#/components/headers/XOpt2WritePosition'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ImageSizeList'
    QueueControlled:
      description: The queue's state after the operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QueueControlResult'
    SiteMonitorStateBody:
      description: The site-monitor cursor.
      headers:
        X-Opt2-Write-Position:
          $ref: '#/components/headers/XOpt2WritePosition'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SiteMonitorState'
    BadRequest:
      description: 'Legacy 400: `invalidParameters` or `badRequest`.'
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyBadRequest:
      description: 'Legacy 400: `invalidParameters`, `invalidMethodCall`, `badRequest`, `invalidEntityCall`, `disabled` or, on a session-mode save, `invalidTokens`.'
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AccessControlAllowOrigin'
        Access-Control-Allow-Credentials:
          $ref: '#/components/headers/AccessControlAllowCredentials'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyError'
    Unauthorized:
      description: 'Legacy 401: `authorization` without a qualifying identity, or `invalidAccessToken`/`accessTokenExpired` for a bad credential.'
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticate'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyError'
    Forbidden:
      description: The identity holds none of the required roles, or a supplied `siteid` differs from the token's site.
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyNotFound:
      description: Legacy 404 (`mura404`) in the error envelope.
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyError'
    ServerError:
      description: Legacy 500 `server_error`.
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyError'
    Unavailable:
      description: Legacy-shaped 503 after a fail-closed or wait-timeout condition.
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyUnavailable'

  schemas:
    CfId:
      type: string
      description: ColdFusion `createUUID()` id.
      minLength: 35
      maxLength: 35
      pattern: '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{16}$'
    DigitString:
      type: string
      description: Non-negative decimal integer without leading zeros.
      pattern: '^(0|[1-9][0-9]{0,14})$'
    LocalTimestamp:
      type: string
      description: Wall-clock time in the legacy server's zone, without an offset.
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}$'
      examples:
        - '2026-06-30T09:15:00.000'
    WallClock:
      type: string
      description: Wall-clock time without a zone, `YYYY-MM-DD HH:MM[:SS[.fff]]` with a space or `T`.
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}[ T][0-9]{2}:[0-9]{2}(:[0-9]{2}(\.[0-9]+)?)?$'
    FormValue:
      description: One form field as a CFML scope holds it; JSON callers may send numbers and booleans.
      type:
        - string
        - number
        - boolean
    LegacyEnvelope:
      type: object
      description: Legacy JSON API success envelope; `params` is absent under `suppressAPIParams`, and `data` keys move to the top level when `useDataNamespace` is false.
      required:
        - apiversion
        - method
      additionalProperties: true
      properties:
        apiversion:
          type: string
          const: v1
        method:
          type: string
        params:
          type: object
        data: {}
    LegacyError:
      type: object
      description: 'Legacy JSON API error envelope; types map to status and code as authorization 401, invalidAccessToken and accessTokenExpired 401 invalid_token, disabled, invalidParameters, invalidEntityCall, invalidMethodCall, badRequest and invalidTokens 400 invalid_request, server_error 500.'
      required:
        - apiversion
        - method
        - error
      additionalProperties: true
      properties:
        apiversion:
          type: string
          const: v1
        method:
          type: string
        params:
          type: object
        error:
          type: object
          required:
            - message
            - code
          additionalProperties: true
          properties:
            message:
              type: string
            code:
              type: string
              enum:
                - invalid_request
                - invalid_token
                - server_error
    LegacyUnavailable:
      type: object
      description: Legacy JSON API `server_error` envelope sent with status 503.
      required:
        - apiversion
        - method
        - error
      additionalProperties: false
      properties:
        apiversion:
          type: string
          const: v1
        method:
          type: string
        params:
          type: object
        error:
          type: object
          required:
            - message
            - code
          additionalProperties: false
          properties:
            message:
              type: string
              const: Unhandled Exception
            code:
              type: string
              const: server_error
    SiteEnvelope:
      description: Legacy envelope whose `data` is a site or a site collection.
      allOf:
        - $ref: '#/components/schemas/LegacyEnvelope'
        - type: object
          properties:
            data:
              anyOf:
                - $ref: '#/components/schemas/JsonApiSiteCollection'
                - $ref: '#/components/schemas/JsonApiSite'
    JsonApiSite:
      type: object
      description: A site as the JSON API serializes it, field selection off; `id` is always the site id, and a save adds `saveErrors` and `errors`.
      additionalProperties: true
      properties:
        id:
          type: string
        siteid:
          type: string
        domain:
          type: string
        entityname:
          type: string
          const: site
        isnew:
          type: integer
          enum:
            - 0
            - 1
        links:
          type: object
          additionalProperties:
            type: string
        saveErrors: {}
        errors:
