      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/PersonRecord'
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/AddressRecord'
        categoryIds:
          type: array
          description: Interest categories the user selected.
          items:
            $ref: '#/components/schemas/CfUuid'
        subTypes:
          type: array
          items:
            $ref: '#/components/schemas/SubTypeOption'
        extendedAttributes:
          $ref: '#/components/schemas/ExtendedAttributeValues'
        errors:
          $ref: '#/components/schemas/LegacyErrors'
        retained:
          type: boolean
          description: True when `user` and `errors` are the session's retained values of a failed save.

