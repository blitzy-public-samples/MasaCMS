openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: people
  version: 1.0.0
  description: 'API of the OPT-2 people service: the person roster, addresses, user lists and exports, the edit profile screen and the person archive; a breaking change takes a /v2/ prefix.'
  license:
    name: GPL-2.0-only
    identifier: GPL-2.0-only
  x-source-sha: 696383140578f8dea3ece26f80cd7bfb370ddf0f
servers:
  - url: http://127.0.0.1:8112
    description: local
x-opt2-calls:
  - identity
  - strategies-content
tags:
  - name: legacy-api
    description: Masa JSON, AJAX and REST API routes of the `user` and `address` entities people serves once cut over.
  - name: favorites
    description: Favorites AJAX templates of the legacy front end, which people serves once cut over; their query field names match ignoring case.
  - name: fixtures
    description: The people fixture route of the legacy oracle, which people serves once cut over.
  - name: users
    description: Data of the people screens of the Users admin circuit; deletes, groups, photos and extended attributes stay on legacy.
  - name: profile
    description: The Edit Profile screen of the logged-in user.
  - name: migration
    description: Owner endpoints the migration service calls.
  - name: events
    description: Pub/Sub push deliveries.
  - name: tasks
    description: Cloud Tasks deliveries and queue control.
  - name: health
    description: Liveness probe.
