          in: query
          required: false
          description: Restricts a folded unit to one `Program_<id>` schema.
          schema:
            $ref: '#/components/schemas/DigitString'
        - name: after
          in: query
          required: false
          description: The previous page's `next` cursor.
          schema:
            type: string
            minLength: 1
        - name: match
          in: query
          required: false
          description: JSON object of legacy column to values; rows matching any entry, compared as SQL Server does. The owner may return more rows.
          schema:
            type: string
            maxLength: 4096
        - name: keys
          in: query
          required: false
          description: Legacy key encodings as export rows carry them in `key`; the page holds only their rows and no object manifest.
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 100
            items:
              type: string
              minLength: 1
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: One export page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/migration/changes:
    get:
      operationId: migrationChanges
      summary: Reads the tenant's changelog after a cursor, below the commit-safe horizon.
      tags: [migration]
      x-opt2-transport: service
      x-opt2-requires:
        - platform.migration
      security: [{invocationCredential: []}]
      parameters:
        - $ref: '#/components/parameters/MigrationTenantId'
        - $ref: '#/components/parameters/MigrationSiteId'
        - name: after
          in: query
          required: false
          description: Cursor `<xid>:<seq>`; `0:0` when omitted.
          schema:
            type: string
            pattern: '^(0|[1-9][0-9]*):(0|[1-9][0-9]*)$'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: One page of changes with their legacy projections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/migration/position:
    get:
      operationId: migrationPosition
      summary: Reports the current write position and the outbox and inbox drain counts.
      tags: [migration]
      x-opt2-transport: service
      x-opt2-requires:
        - platform.migration
      security: [{invocationCredential: []}]
      parameters:
        - name: eventIds
          in: query
          required: false
          description: Comma-separated event ids whose inbox receipts are reported.
          schema:
            type: string
        - name: publishedTopics
          in: query
          required: false
          description: Comma-separated topics whose published outbox events are listed in `published`; every one when the read names none of `publishedAfter`, `publishedLimit` and `publishedThrough`, otherwise one page per read.
          schema:
            type: string
        - name: registeredTenants
          in: query
          required: false
          description: With `true`, lists every tenant of the registry, each site's and its pools', in `registeredTenants`.
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
        - name: publishedAfter
          in: query
          required: false
          description: Pages the listing from outbox `seq` after this value, the previous answer's `publishedNext`; 0 when absent on a paged read.
          schema:
            type: string
            pattern: '^(0|[1-9][0-9]{0,17})$'
        - name: publishedLimit
          in: query
          required: false
          description: Pages the listing with at most this many published events, 1 to 1000; 1000 when absent on a paged read.
          schema:
            type: string
            pattern: '^([1-9][0-9]{0,2}|1000)$'
        - name: publishedThrough
          in: query
          required: false
          description: Pages the listing through outbox `seq` this value, an earlier answer's `publishedFrontier`; rows of the asked topics above it are neither listed nor blocking.
          schema:
            type: string
            pattern: '^(0|[1-9][0-9]{0,17})$'
      responses:
        '200':
          description: The owner's position.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/migration/watermark:
    get:
      operationId: migrationWatermarkGet
      summary: Lists feed watermarks, optionally for one legacy table or direction.
      tags: [migration]
      x-opt2-transport: service
      x-opt2-requires:
        - platform.migration
      security: [{invocationCredential: []}]
      parameters:
        - name: legacyTable
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: direction
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/WatermarkDirection'
      responses:
        '200':
          description: Watermarks ordered by legacy table and direction.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WatermarkRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: migrationWatermarkPost
      summary: Records the feed watermark of one legacy table and direction.
      tags: [migration]
      x-opt2-transport: service
      x-opt2-requires:
        - platform.migration
      security: [{invocationCredential: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatermarkInput'
      responses:
        '200':
          description: The stored watermark.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatermarkRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/migration/gate:
    post:
      operationId: migrationGate
      summary: Closes, re-phases, opens or reads the unit gates of this owner.
      tags: [migration]
      x-opt2-transport: service
      x-opt2-requires:
        - platform.migration
      security: [{invocationCredential: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GateRequest'
      responses:
        '200':
          description: The gates after the operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Another holder owns a gate, so the compare-and-set was refused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GateConflict'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
          description: The gates could not close within the wait budget.
  /internal/v1/events/people.programs-sites.site.changed.v1:
    post:
      operationId: pushSiteChanged
      summary: Receives push deliveries of `programs-sites.site.changed.v1` into people's tenant registry.
      tags: [events]
      x-opt2-transport: pubsub-push
      x-opt2-requires:
        - service:pubsub-invoker
      security: [{pubsubPushOidc: []}, {localPushKey: []}]
      parameters:
        - $ref: '#/components/parameters/PushKey'
      requestBody:
        required: true
        description: Message data is an event envelope whose payload follows `services/programs-sites/contracts/events/programs-sites.site.changed.v1.json`.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushBody'
      responses:
        '204':
          description: Acknowledged; the delivery was applied, already applied, stale, or dead-lettered.
        '400':
          description: Not a push body; a nack.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
          description: Processing failed; a nack, redelivered by Pub/Sub.
        '503':
          $ref: '#/components/responses/Unavailable'
          description: A unit gate or the database is unavailable; a nack, redelivered by Pub/Sub.
  /internal/v1/events/people.identity.group.changed.v1:
    post:
      operationId: pushGroupChanged
      summary: Receives push deliveries of `identity.group.changed.v1` into people's group-name projection.
      tags: [events]
      x-opt2-transport: pubsub-push
      x-opt2-requires:
        - service:pubsub-invoker
      security: [{pubsubPushOidc: []}, {localPushKey: []}]
      parameters:
        - $ref: '#/components/parameters/PushKey'
      requestBody:
        required: true
        description: Message data is an event envelope whose payload follows `services/identity/contracts/events/identity.group.changed.v1.json`.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushBody'
      responses:
        '204':
          description: Acknowledged; the delivery was applied, already applied, stale, or dead-lettered.
        '400':
          description: Not a push body; a nack.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
          description: Processing failed; a nack, redelivered by Pub/Sub.
        '503':
          $ref: '#/components/responses/Unavailable'
          description: A unit gate or the database is unavailable; a nack, redelivered by Pub/Sub.
  /internal/v1/outbox/sweep:
    post:
      operationId: outboxSweep
      summary: Creates the next sweep task, publishes every unpublished outbox row per registry tenant, then resolves roster operations left open.
      tags: [tasks]
      x-opt2-transport: cloud-tasks
      x-opt2-requires:
        - service:tasks-invoker
      security: [{tasksInvokerOidc: []}]
      parameters:
        - $ref: '#/components/parameters/CloudTasksTaskName'
        - $ref: '#/components/parameters/CloudTasksQueueName'
        - $ref: '#/components/parameters/CloudTasksRetryCount'
        - $ref: '#/components/parameters/CloudTasksExecutionCount'
        - $ref: '#/components/parameters/CloudTasksEta'
      requestBody:
        $ref: '#/components/requestBodies/SystemTask'
      responses:
        '200':
          description: The sweep totals, with the outcome of the open roster-operation recovery hook.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SweepResult'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: A malformed task body, or one carrying a tenant.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
          description: The sweep failed, so Cloud Tasks retries this task.
        '503':
          $ref: '#/components/responses/Unavailable'
          description: The successor task could not be created, so Cloud Tasks retries this one.
  /internal/v1/task-queues/{queue}/pause:
    parameters:
      - $ref: '#/components/parameters/Queue'
    post:
      operationId: queuePause
      summary: Pauses dispatch from a queue this service creates tasks on.
      tags: [tasks]
      x-opt2-transport: service
      x-opt2-requires:
        - platform.migration
        - platform.operator
      security: [{invocationCredential: []}]
      responses:
        '200':
          $ref: '#/components/responses/QueueControlled'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: The queue is not one this service creates tasks on.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/task-queues/{queue}/resume:
    parameters:
      - $ref: '#/components/parameters/Queue'
    post:
      operationId: queueResume
      summary: Resumes dispatch from a queue this service creates tasks on.
      tags: [tasks]
      x-opt2-transport: service
      x-opt2-requires:
        - platform.migration
        - platform.operator
      security: [{invocationCredential: []}]
      responses:
        '200':
          $ref: '#/components/responses/QueueControlled'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: The queue is not one this service creates tasks on.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /internal/v1/task-queues/{queue}/ensure:
    parameters:
      - $ref: '#/components/parameters/Queue'
    post:
      operationId: queueEnsure
      summary: Ensures a recurring chain this service creates has a live task.
      tags: [tasks]
      x-opt2-transport: service
      x-opt2-requires:
        - platform.migration
        - platform.operator
      security: [{invocationCredential: []}]
      responses:
        '200':
          $ref: '#/components/responses/QueueControlled'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: The queue is not a recurring chain this service creates.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe.
      tags: [health]
      x-opt2-transport: service
      x-opt2-public: true
      security: [{}, {invocationCredential: []}]
      responses:
        '200':
          description: The service is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: A presented credential is invalid.
        '403':
          $ref: '#/components/responses/Forbidden'
          description: The verified user token's site differs from the supplied `siteid`.

components:
  securitySchemes:
    userToken:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/securitySchemes/userToken'
    invocationCredential:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/securitySchemes/invocationCredential'
    pubsubPushOidc:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/securitySchemes/pubsubPushOidc'
    localPushKey:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/securitySchemes/localPushKey'
    tasksInvokerOidc:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/securitySchemes/tasksInvokerOidc'
  headers:
    Generator:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/headers/Generator'
    StrictTransportSecurity:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/headers/StrictTransportSecurity'
    ETag:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/headers/ETag'
    AccessControlAllowOrigin:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/headers/AccessControlAllowOrigin'
    AccessControlAllowCredentials:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/headers/AccessControlAllowCredentials'
    WWWAuthenticate:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/x-opt2-variants/oauth/headers/WWWAuthenticate'
    ConnectionClose:
      description: The connection closes after the answer.
      schema:
        type: string
        const: close
    XOpt2WritePosition:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/headers/XOpt2WritePosition'
    XOpt2UnpublishedEvents:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/headers/XOpt2UnpublishedEvents'
    UsersCsvDisposition:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/headers/UsersCsvDisposition'
  parameters:
    LegacySiteId:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/parameters/LegacySiteId'
    SitelessSiteIdQuery:
      name: siteid
      in: query
      required: false
      description: Site of a site-less call; a form `siteid` wins over this field, a missing value or one naming no site serves `default`, and the served site must equal the token's `site` when a user is present (403 otherwise).
      schema:
        type: string
        examples:
          - default
    LegacySegment:
      name: segment
      in: path
      required: true
      description: 'Segment after the site id: the entity `user`, `users`, `address` or `addresses`, or an entity-generic method such as `findOne` that `entityname` addresses.'
      schema:
        type: string
        minLength: 1
        examples:
          - user
          - address
    LegacyItem:
      name: item
      in: path
      required: true
      description: A user or address id, a comma list of ids, `new`, `properties`, `permissions` or `pollState`, or the first value of a path parameter pair.
      schema:
        type: string
        minLength: 1
    LegacySuffix:
      name: suffix
      in: path
      required: true
      description: '`permissions` or `pollState` after a 35-character id, or a path parameter; longer path-pair forms resolve the same way on the same Fastify route.'
      schema:
        type: string
        minLength: 1
        examples:
          - permissions
    LegacyMethod:
      name: method
      in: query
      required: false
      description: Method to call, also read from a form or JSON body field; an entity-generic method addresses `entityname`, or the entity of a dotted `user.<method>` or `address.<method>`.
      schema:
        type: string
        examples:
          - findOne
          - findMany
          - findAll
          - findNew
          - findQuery
          - findProperties
          - findPermissions
          - save
          - validate
          - user.findOne
          - address.save
    LegacyEntityName:
      name: entityname
      in: query
      required: false
      description: Entity an entity-generic `method` addresses; `user`, `users`, `address` or `addresses` for people.
      schema:
        type: string
        examples:
          - user
          - address
    MethodOverrideHeader:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/parameters/MethodOverrideHeader'
    CsrfTokenHeader:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/parameters/CsrfTokenHeader'
    CsrfExpiresHeader:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/parameters/CsrfExpiresHeader'
    SiteIdQuery:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/parameters/SiteIdQuery'
    ListSiteIdQuery:
      name: siteid
      in: query
      required: false
      description: Legacy site id, equal to the token's `site` (403 otherwise), or `all` for people of every site; the token's site when omitted.
      schema:
        type: string
        minLength: 1
        examples:
          - tenant-a
          - all
    IsPublicQuery:
      name: ispublic
      in: query
      required: false
      description: '`0` for system users and groups, `1` for site members and member groups; a non-boolean value reads as 1.'
      schema:
        type: string
        default: '1'
        examples:
          - '0'
          - '1'
    FeedIsPublicQuery:
      name: ispublic
      in: query
      required: false
      description: The feed's `isPublic`, `0` for the private pool's system users and `1` for the public pool's members.
      schema:
        type: string
        enum: ['0', '1']
        default: '1'
    UnassignedQuery:
      name: unassigned
      in: query
      required: false
      description: '`1` restricts the list to people without a group membership; a non-boolean value reads as 0.'
      schema:
        type: string
        default: '0'
        examples:
          - '0'
          - '1'
    StartRowQuery:
      name: startrow
      in: query
      required: false
      description: First row of the page, read with CFML `val()`; below 1, or past the last row, reads as 1.
      schema:
        type: string
        default: '1'
    RecordsPerPageQuery:
      name: recordsperpage
      in: query
      required: false
      description: Page size, read with CFML `val()`; below 1 reads as 25.
      schema:
        type: string
        default: '25'
    SearchQuery:
      name: search
      in: query
      required: false
      description: Text matched anywhere in the last name, first name, company, user name, email or job title; empty matches nothing.
      schema:
        type: string
        default: ''
    NewSearchQuery:
      name: newsearch
      in: query
      required: false
      description: '`true` when the search form was just opened.'
      schema:
        type: string
        default: 'false'
    UserIdQuery:
      name: userid
      in: query
      required: false
      description: Person `UserID`; empty for a new person, which gets a generated id that is also its CSRF context.
      schema:
        type: string
        maxLength: 35
        default: ''
    FormUserIdQuery:
      name: userid
      in: query
      required: false
      description: The edit form's action-URL `userid`, which its multipart body does not repeat; query and body fields merge as CFML's url and form scopes, a body field winning.
      schema:
        $ref: '#/components/schemas/CfUuid'
    AddressIdQuery:
      name: addressid
      in: query
      required: false
      description: Address `addressID`; empty for a new address.
      schema:
        type: string
        maxLength: 35
        default: ''
    RouteIdQuery:
      name: routeid
      in: query
      required: false
      description: Screen to return to, such as `editprofile` or a group id.
      schema:
        type: string
        default: ''
    ReturnUrlQuery:
      name: returnurl
      in: query
      required: false
      description: URL to return to when `routeid` is empty, sanitised as legacy sanitises it.
      schema:
        type: string
        default: ''
    SetIsPublicQuery:
      name: setispublic
      in: query
      required: false
      description: User-type radio value a re-rendered form keeps; honoured only for an S2 or site-admin caller.
      schema:
        type: string
        examples:
          - '0'
          - '1'
    RemoveBlockQuery:
      name: removeBlock
      in: query
      required: false
      allowEmptyValue: true
      description: Presence clears the person's login strikes before reading the block, as the Edit User removeBlock link does; any value is accepted, including an empty value.
      schema:
        type: string
    FavoriteUserId:
      name: userID
      in: query
      required: true
      description: User the favorite belongs to; legacy does not check it against the session.
      schema:
        type: string
    FavoriteSiteId:
      name: siteid
      in: query
      required: true
      description: Site of the favorite and of its content link.
      schema:
        type: string
        examples:
          - default
    FavoriteName:
      name: favoriteName
      in: query
      required: true
      description: Text of the favorite's link.
      schema:
        type: string
    FavoriteLocation:
      name: favoriteLocation
      in: query
      required: true
      description: Content id the favorite links to.
      schema:
        type: string
    FavoriteType:
      name: favoriteType
      in: query
      required: true
      schema:
        type: string
        examples:
          - Page
          - RSS
    FavoriteColumnNumber:
      name: columnNumber
      in: query
      required: false
      schema:
        type: string
    FavoriteRowNumber:
      name: rowNumber
      in: query
      required: false
      schema:
        type: string
    FavoriteMaxRssItems:
      name: maxRssItems
      in: query
      required: false
      schema:
        type: string
    FavoriteId:
      name: favoriteID
      in: query
      required: true
      description: Favorite to delete.
      schema:
        type: string
    RssFavoriteSiteId:
      name: siteID
      in: query
      required: true
      description: Site whose RSS favorites of the user are deleted.
      schema:
        type: string
