      summary: Adds or updates a person's address as `cusers.updateAddress` does, under CSRF context `updateaddress<userId>`, then redirects.
      description: An `action=Delete` or extended attributes answer 503 without executing, as they stay on legacy; a missing or invalid CSRF token writes nothing and still redirects.
      tags: [users]
      x-opt2-transport: service
      x-opt2-requires:
        - s2
        - site-admin
        - m:008
      x-opt2-fastify-path: /v1/users/addresses::update
      security: [{userToken: [], invocationCredential: []}]
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
        - $ref: '#/components/parameters/CsrfExpiresHeader'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
