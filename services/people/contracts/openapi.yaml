components:
  securitySchemes:
    userToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Site-scoped user token in `Authorization`, minted by identity and attached by the gateway.
    invocationCredential:
      type: apiKey
      in: header
      name: X-Serverless-Authorization
      description: Caller's invocation credential; a Google-signed ID token in the cloud, a local service token locally.
    pubsubPushOidc:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC token of `pubsub-invoker` in `Authorization`, addressed to the push endpoint.
    localPushKey:
      type: apiKey
      in: query
      name: key
      description: Local emulator push key, compared in constant time.
    tasksInvokerOidc:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC token of `tasks-invoker` in `Authorization` in the cloud; a local `tasks-invoker` service token locally.
  headers:
    Generator:
      description: Legacy generator header.
      schema:
        type: string
        const: Masa CMS 7.6.1
    StrictTransportSecurity:
      description: Legacy HSTS header.
      schema:
        type: string
        const: max-age=1200
    ETag:
      description: Uppercase hex SHA-256 of the exact body, unquoted, as ColdFusion `hash()` computes it.
      schema:
        type: string
        pattern: '^[0-9A-F]{64}$'
    AccessControlAllowOrigin:
      description: The request `Origin`, echoed when its host is a site domain, a domain alias or a sub-domain of one.
      schema:
        type: string
    AccessControlAllowCredentials:
      description: Sent with an echoed origin.
      schema:
        type: string
        const: 'true'
    WWWAuthenticate:
      description: Challenge legacy sets before the failure; the `invalid_grant_type` value keeps legacy's missing closing quote.
      schema:
        type: string
        examples:
          - Basic
          - 'Bearer error="invalid_access_token"'
          - Bearer
          - 'Bearer error="invalid_client_credentials"'
          - 'Bearer error="invalid_authorization_code"'
          - 'Bearer error="invalid_client_refresh_token"'
          - 'Bearer error="invalid_grant_type'
    XOpt2WritePosition:
      description: Committed write positions `<owner>=<xid>[,<owner>=<xid>…]`; the gateway strips it from client responses.
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]*=[0-9]+(,[a-z0-9][a-z0-9-]*=[0-9]+)*$'
    UsersCsvDisposition:
      description: Legacy download disposition.
      schema:
        type: string
        const: attachment;filename=users.csv
  parameters:
    LegacySiteId:
      name: siteid
      in: path
      required: true
      description: Legacy site id, equal to the token's `site` when a user is present (403 otherwise); legacy serves a value that names no site under `default`, and reads a method name here as the method.
      schema:
        type: string
        minLength: 1
        examples:
          - default
    SitelessSiteIdQuery:
      name: siteid
      in: query
      required: false
      description: Site of a site-less call; a form `siteid` wins over this field, a missing value or one naming no site serves `default`, and the served site must equal the token's `site` when a user is present (403 otherwise).
      schema:
        type: string
        examples:
          - default
    LegacySegment:
      name: segment
      in: path
      required: true
      description: 'Segment after the site id: the entity `user`, `users`, `address` or `addresses`, or an entity-generic method such as `findOne` that `entityname` addresses.'
      schema:
        type: string
        minLength: 1
        examples:
          - user
          - address
    LegacyItem:
      name: item
      in: path
      required: true
      description: A user or address id, a comma list of ids, `new`, `properties`, `permissions` or `pollState`, or the first value of a path parameter pair.
      schema:
        type: string
        minLength: 1
    LegacySuffix:
      name: suffix
      in: path
      required: true
      description: '`permissions` or `pollState` after a 35-character id, or a path parameter; longer path-pair forms resolve the same way on the same Fastify route.'
      schema:
        type: string
        minLength: 1
        examples:
          - permissions
    LegacyMethod:
      name: method
      in: query
      required: false
      description: Method to call, also read from a form or JSON body field; an entity-generic method addresses `entityname`, or the entity of a dotted `user.<method>` or `address.<method>`.
      schema:
        type: string
        examples:
          - findOne
          - findMany
          - findAll
          - findNew
          - findQuery
          - findProperties
          - findPermissions
          - save
          - validate
          - user.findOne
          - address.save
    LegacyEntityName:
      name: entityname
      in: query
      required: false
      description: Entity an entity-generic `method` addresses; `user`, `users`, `address` or `addresses` for people.
      schema:
        type: string
        examples:
          - user
          - address
    MethodOverrideHeader:
      name: X-HTTP-Method-Override
      in: header
      required: false
      description: Verb legacy resolves the entity operation with in place of the request method.
      schema:
        type: string
        examples:
          - PUT
          - DELETE
    CsrfTokenHeader:
      name: X-csrf_token
      in: header
      required: false
      description: CSRF token, an alternative to the `csrf_token` field.
      schema:
        type: string
    CsrfExpiresHeader:
      name: X-csrf_token_expires
      in: header
      required: false
      description: CSRF token expiry `yyMMddHHnnsslll`, an alternative to the `csrf_token_expires` field.
      schema:
        type: string
    SiteIdQuery:
      name: siteid
      in: query
      required: false
      description: Legacy site id, equal to the token's `site` (403 otherwise); the token's site when omitted.
      schema:
        type: string
        minLength: 1
        examples:
          - tenant-a
    ListSiteIdQuery:
      name: siteid
      in: query
      required: false
      description: Legacy site id, equal to the token's `site` (403 otherwise), or `all` for people of every site; the token's site when omitted.
      schema:
        type: string
        minLength: 1
        examples:
          - tenant-a
          - all
    IsPublicQuery:
      name: ispublic
      in: query
      required: false
      description: '`0` for system users and groups, `1` for site members and member groups; a non-boolean value reads as 1.'
      schema:
        type: string
        default: '1'
        examples:
          - '0'
          - '1'
    UnassignedQuery:
      name: unassigned
      in: query
      required: false
      description: '`1` restricts the list to people without a group membership; a non-boolean value reads as 0.'
      schema:
        type: string
        default: '0'
        examples:
          - '0'
          - '1'
    StartRowQuery:
      name: startrow
      in: query
      required: false
      description: First row of the page, read with CFML `val()`; below 1, or past the last row, reads as 1.
      schema:
        type: string
        default: '1'
    RecordsPerPageQuery:
      name: recordsperpage
      in: query
      required: false
      description: Page size, read with CFML `val()`; below 1 reads as 25.
      schema:
        type: string
        default: '25'
    SearchQuery:
      name: search
      in: query
      required: false
      description: Text matched anywhere in the last name, first name, company, user name, email or job title; empty matches nothing.
      schema:
        type: string
        default: ''
    NewSearchQuery:
      name: newsearch
      in: query
      required: false
      description: '`true` when the search form was just opened.'
      schema:
        type: string
        default: 'false'
    UserIdQuery:
      name: userid
      in: query
      required: false
      description: Person `UserID`; empty for a new person, which gets a generated id that is also its CSRF context.
      schema:
        type: string
        maxLength: 35
        default: ''
    AddressIdQuery:
      name: addressid
      in: query
      required: false
      description: Address `addressID`; empty for a new address.
      schema:
        type: string
        maxLength: 35
        default: ''
    RouteIdQuery:
      name: routeid
      in: query
      required: false
      description: Screen to return to, such as `editprofile` or a group id.
      schema:
        type: string
        default: ''
    ReturnUrlQuery:
      name: returnurl
      in: query
      required: false
      description: URL to return to when `routeid` is empty, sanitised as legacy sanitises it.
      schema:
        type: string
        default: ''
    SetIsPublicQuery:
      name: setispublic
      in: query
      required: false
      description: User-type radio value a re-rendered form keeps; honoured only for an S2 or site-admin caller.
      schema:
        type: string
        examples:
          - '0'
          - '1'
    FavoriteUserId:
      name: userID
      in: query
      required: true
      description: User the favorite belongs to; legacy does not check it against the session.
      schema:
        type: string
    FavoriteSiteId:
      name: siteid
      in: query
      required: true
      description: Site of the favorite and of its content link.
      schema:
        type: string
        examples:
          - default
    FavoriteName:
      name: favoriteName
      in: query
      required: true
      description: Text of the favorite's link.
      schema:
        type: string
    FavoriteLocation:
      name: favoriteLocation
      in: query
      required: true
      description: Content id the favorite links to.
      schema:
        type: string
    FavoriteType:
      name: favoriteType
      in: query
      required: true
      schema:
        type: string
        examples:
          - Page
          - RSS
    FavoriteColumnNumber:
      name: columnNumber
      in: query
      required: false
      schema:
        type: string
    FavoriteRowNumber:
      name: rowNumber
      in: query
      required: false
      schema:
        type: string
    FavoriteMaxRssItems:
      name: maxRssItems
      in: query
      required: false
      schema:
        type: string
    FavoriteId:
      name: favoriteID
      in: query
      required: true
      description: Favorite to delete.
      schema:
        type: string
    RssFavoriteSiteId:
      name: siteID
      in: query
      required: true
      description: Site whose RSS favorites of the user are deleted.
      schema:
        type: string
        examples:
          - default
    PersonId:
      name: userId
      in: path
      required: true
      description: Person `UserID`; an id that names no person of the site's user pools answers `notFound`.
      schema:
        type: string
        minLength: 1
    Queue:
      name: queue
      in: path
      required: true
      description: A queue this service creates tasks on.
      schema:
        type: string
        enum:
          - people-outbox-sweep

    MigrationTenantId:
      name: tenantId
      in: query
      required: false
      description: Tenant UUID; exactly one of `tenantId` and `siteId` is required.
      schema:
        type: string
        format: uuid
        pattern: '^([0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[1-8][0-9A-Fa-f]{3}-[89ABab][0-9A-Fa-f]{3}-[0-9A-Fa-f]{12}|00000000-0000-0000-0000-000000000000|[Ff]{8}-[Ff]{4}-[Ff]{4}-[Ff]{4}-[Ff]{12})$'
    MigrationSiteId:
      name: siteId
      in: query
      required: false
      description: Legacy site id resolved to its tenant; exactly one of `tenantId` and `siteId` is required.
      schema:
        type: string
        minLength: 1
    PageLimit:
      name: limit
      in: query
      required: false
      description: Page size, 1 to 10000; 1000 when omitted.
      schema:
        $ref: '#/components/schemas/DigitString'
    PushKey:
      name: key
      in: query
      required: false
      description: Local emulator push key; absent in the cloud.
      schema:
        type: string
    CloudTasksTaskName:
      name: X-CloudTasks-TaskName
      in: header
      required: false
      description: Task id; the body's `name` when absent.
      schema:
        type: string
    CloudTasksQueueName:
      name: X-CloudTasks-QueueName
      in: header
      required: false
      description: Queue name; the body's `queue` when absent.
      schema:
        type: string
    CloudTasksRetryCount:
      name: X-CloudTasks-TaskRetryCount
      in: header
      required: false
      schema:
        type: string
        pattern: '^[0-9]+$'
    CloudTasksExecutionCount:
      name: X-CloudTasks-TaskExecutionCount
      in: header
      required: false
      schema:
        type: string
        pattern: '^[0-9]+$'
    CloudTasksEta:
      name: X-CloudTasks-TaskETA
      in: header
      required: false
      description: Scheduled time in epoch seconds.
      schema:
        type: string
  requestBodies:
    LegacyCall:
      required: false
      description: Merged with the query string as legacy merges url, form and a JSON body; later sources win.
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/LegacyCallBody'
        multipart/form-data:
          schema:
            $ref: '#/components/schemas/LegacyCallBody'
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyCallBody'
    ArchiveCall:
      required: false
      description: Merged with the query string as the fixture merges url, form and a JSON body; later sources win.
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/ArchiveRequest'
        application/json:
          schema:
            $ref: '#/components/schemas/ArchiveRequest'
    SystemTask:
      required: true
      description: Task wire body of a tenant-less system task.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SystemTaskWireBody'
  responses:
    LegacyOk:
      description: The user or address result in the legacy envelope.
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AccessControlAllowOrigin'
        Access-Control-Allow-Credentials:
          $ref: '#/components/headers/AccessControlAllowCredentials'
        X-Opt2-Write-Position:
          $ref: '#/components/headers/XOpt2WritePosition'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/PeopleEnvelope'
        application/x-shunter+json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/PeopleEnvelope'
    LegacyBadRequest:
      description: 'Legacy 400: `invalidParameters`, `invalidMethodCall`, `invalidEntityCall`, `badRequest` or, on a session-mode save, `invalidTokens`.'
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AccessControlAllowOrigin'
        Access-Control-Allow-Credentials:
          $ref: '#/components/headers/AccessControlAllowCredentials'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyUnauthorized:
      description: 'Legacy 401: `authorization` (`invalid_request`) unless the caller is an admin, a super user, the addressed user or holds module 008, or `invalid_token` for a bad access token.'
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticate'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyForbidden:
      description: A user or address save whose `data.errors` is non-empty, including the account errors identity's prepare returns, or a `siteid` other than the token's site.
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json;charset=utf-8:
          schema:
            anyOf:
              - $ref: '#/components/schemas/PeopleEnvelope'
              - $ref: '#/components/schemas/LegacyError'
    LegacyNotFound:
      description: Legacy 404 (`mura404`) in the error envelope.
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyServerError:
      description: Legacy 500 `server_error`.
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyError'

    Unavailable:
      description: Legacy-shaped 503 after a fail-closed or wait-timeout condition.
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyUnavailable'
    ErrorPage:
      description: The ColdFusion error page.
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
      content:
        text/html;charset=UTF-8:
          schema:
            $ref: '#/components/schemas/LegacyHtml'
    BadRequest:
      description: 'Legacy 400: `invalidParameters`, `badRequest` or `invalidTokens`.'
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyError'
    Unauthorized:
      description: 'Legacy 401: `authorization` without a qualifying credential, or `invalidAccessToken`/`accessTokenExpired` for a bad user token.'
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticate'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyError'
    Forbidden:
      description: The verified identities hold none of the required roles, or a supplied `siteid` differs from the token's site.
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyError'
    NotFound:
      description: Legacy 404 in the error envelope.
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyError'
    ServerError:
      description: Legacy 500 `server_error`.
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyError'
    QueueControlled:
      description: The queue's state after the operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QueueControlResult'
    ArchiveOk:
      description: The person's archive record in the fixture envelope.
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/ArchiveEnvelope'
    ArchiveWritten:
      description: The new archive record in the fixture envelope; its outbox row commits in the same transaction.
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
        X-Opt2-Write-Position:
          $ref: '#/components/headers/XOpt2WritePosition'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/ArchiveEnvelope'
    UsersCsv:
      description: The CSV file.
      headers:
        Content-Disposition:
          $ref: '#/components/headers/UsersCsvDisposition'
      content:
        text/csv; charset=UTF-8:
          schema:
            type: string
    UserWritten:
      description: The outcome; validation errors, including the account errors identity's prepare returns, leave `errors` non-empty and `userBean` set, and the form re-renders with them.
      headers:
        X-Opt2-Write-Position:
          $ref: '#/components/headers/XOpt2WritePosition'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateResult'
    ProfileWritten:
      description: The outcome; a save redirects to `home.redirect`, and a missing or invalid CSRF token or validation errors leave `redirect` absent and `userBean` set for the re-rendered form.
      headers:
        X-Opt2-Write-Position:
          $ref: '#/components/headers/XOpt2WritePosition'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateResult'
    AddressWritten:
      description: Whether the address changed and the redirect, to `cEditProfile.edit` for `routeid=editprofile`, otherwise to `cUsers.edituser`.
      headers:
        X-Opt2-Write-Position:
          $ref: '#/components/headers/XOpt2WritePosition'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RouteResult'
    Routed:
      description: The redirect legacy answers with.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RouteResult'

  schemas:
    CfUuid:
      type: string
      description: ColdFusion `createUUID()` id; legacy compares ids ignoring case.
      minLength: 35
      maxLength: 35
      pattern: '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{16}$'
    SiteId:
      type: string
      description: Legacy site id.
      minLength: 1
      examples:
        - default
        - tenant-a
    DigitString:
      type: string
      description: Non-negative decimal integer without leading zeros.
      pattern: '^(0|[1-9][0-9]{0,14})$'
    LocalTimestamp:
      type: string
      description: Wall-clock time in the legacy server's zone, without an offset.
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}$'
      examples:
        - '2026-06-30T09:15:00.000'
    NullableTimestamp:
      oneOf:
        - $ref: '#/components/schemas/LocalTimestamp'
        - type: 'null'
    WallClock:
      type: string
      description: Wall-clock time without a zone, `YYYY-MM-DD HH:MM[:SS[.fff]]` with a space or `T`.
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}[ T][0-9]{2}:[0-9]{2}(:[0-9]{2}(\.[0-9]+)?)?$'
    NullableString:
      type:
        - string
        - 'null'
    NullableInteger:
      type:
        - integer
        - 'null'
    FormValue:
      description: One form field as a CFML scope holds it; JSON callers may send numbers and booleans.
      type:
        - string
        - number
        - boolean
    LegacyEnvelope:
      type: object
      description: Legacy JSON API success envelope; `params` is absent under `suppressAPIParams`, and `data` keys move to the top level when `useDataNamespace` is false.
      required:
        - apiversion
        - method
      additionalProperties: true
      properties:
        apiversion:
          type: string
          const: v1
        method:
          type: string
        params:
          type: object
        data: {}
        layout:
          description: The shunter layout, copied from `data.layout` when `data.shunter` is true.
    LegacyErrorBody:
      type: object
      description: Error of a legacy JSON API catch block; types map to status and code as authorization 401 and invalidAccessToken and accessTokenExpired 401 invalid_token, disabled, invalidParameters, invalidEntityCall, invalidMethodCall, badRequest and invalidTokens 400 invalid_request, and anything else 500 server_error.
      required:
        - message
        - code
      additionalProperties: true
      properties:
        message:
          type: string
          examples:
            - Insufficient Account Permissions
            - Invalid Access Token
            - Access Token Expired
            - The JSON API disabled
            - Invalid parameters
            - Invalid reference to persisted entity
            - Invalid method call
            - Bad Request
            - Invalid CSRF tokens
            - Unhandled Exception
        code:
          type: string
          enum:
            - invalid_request
            - invalid_token
            - server_error
        stacktrace: {}
    LegacyError:
      type: object
      description: Legacy JSON API error envelope.
      required:
        - apiversion
        - method
        - error
      additionalProperties: true
      properties:
        apiversion:
          type: string
          const: v1
        method:
          type: string
        params:
          type: object
        error:
          $ref: '#/components/schemas/LegacyErrorBody'
    LegacyUnavailable:
      type: object
      description: Legacy JSON API `server_error` envelope sent with status 503.
      required:
        - apiversion
        - method
        - error
      additionalProperties: false
      properties:
        apiversion:
          type: string
          const: v1
        method:
          type: string
        params:
          type: object
        error:
          type: object
          required:
            - message
            - code
          additionalProperties: false
          properties:
            message:
              type: string
              const: Unhandled Exception
            code:
              type: string
              const: server_error
    LegacyErrors:
      type: object
      description: Field name to legacy validation message, as the admin views render them.
      additionalProperties:
        type: string
    LegacyCallBody:
      type: object
      description: A JSON API call; method arguments and entity fields are further parameters.
      additionalProperties: true
      properties:
        method:
          type: string
        entityname:
          type: string
        siteid:
          type: string
        csrf_token:
          type: string
        csrf_token_expires:
          type: string
        client_id:
          type: string
        client_secret:
          type: string
        grant_type:
          type: string
          examples:
            - client_credentials
            - password
            - authorization_code
            - refresh_token
        access_token:
          type: string
        refresh_token:
          type: string
        username:
          type: string
        password:
          type: string
          format: password
        code:
          type: string
        redirect_uri:
          type: string
    AdminRedirect:
      type: object
      description: A legacy admin redirect, rendered by the admin URL builder.
      required:
        - action
        - params
      additionalProperties: false
      properties:
        action:
          type: string
          examples:
            - home.redirect
            - cUsers.list
        params:
          type: object
          additionalProperties:
            type: string
    Health:
      type: object
      required:
        - status
      additionalProperties: false
      properties:
        status:
          type: string
          const: ok
    TaskWireBody:
      type: object
      description: JSON body both task adapters post; `tenantId` is null on system tasks.
      required:
        - queue
        - name
        - tenantId
      additionalProperties: true
      properties:
        queue:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        tenantId:
          type:
            - string
            - 'null'
          format: uuid
        payload: {}
    SystemTaskWireBody:
      description: Task wire body of a recurring system task, which names no tenant.
      allOf:
        - $ref: '#/components/schemas/TaskWireBody'
        - type: object
          required:
            - tenantId
          properties:
            tenantId:
              type: 'null'
    PushBody:
      type: object
      description: Pub/Sub push wrapper; `data` is the base64 event envelope.
      required:
        - message
        - subscription
      additionalProperties: true
      properties:
        message:
          type: object
          additionalProperties: true
          properties:
            data:
              type: string
              contentEncoding: base64
            attributes:
              type: object
              additionalProperties:
                type: string
            messageId:
              type: string
            message_id:
              type: string
            publishTime:
              type: string
            publish_time:
              type: string
            orderingKey:
              type: string
          allOf:
            - anyOf:
                - required:
                    - messageId
                  properties:
                    messageId:
                      minLength: 1
                - required:
                    - message_id
                  properties:
                    message_id:
                      minLength: 1
        subscription:
          type: string
          minLength: 1
          description: Usually `projects/<project>/subscriptions/<subscription>`, such as `people.identity.group.changed.v1`.
        deliveryAttempt:
          type: integer
    SweepResult:
      type: object
      description: Totals of one sweep and each recovery hook's outcome in run order.
      required:
        - published
        - failed
        - skipped
        - tenants
        - hooks
      additionalProperties: false
      properties:
        published:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
        tenants:
          type: integer
          minimum: 0
        hooks:
          type: array
          items:
            type: object
            required:
              - name
              - ok
            additionalProperties: false
            properties:
              name:
                type: string
              ok:
                type: boolean
    EnsureRecurringResult:
      type: object
      required:
        - queue
        - name
        - created
        - reason
      additionalProperties: false
      properties:
        queue:
          type: string
        name:
          type: string
        created:
          type: boolean
        reason:
          type: string
          enum:
            - live
            - created-current
            - created-next
    QueueControlResult:
      type: object
      description: The queue's paused state after pause or resume, or the chain task `ensure` found or created.
      required:
        - queue
        - service
      additionalProperties: false
      properties:
        queue:
          type: string
        service:
          type: string
          const: people
        paused:
          type: boolean
        ensured:
          $ref: '#/components/schemas/EnsureRecurringResult'
    CanonicalType:
      type: string
      description: Canonical encoding tag.
      enum:
        - s
        - i
        - f
        - d
        - t
        - b
    CanonicalColumn:
      type: object
      required:
        - name
        - type
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        type:
          $ref: '#/components/schemas/CanonicalType'
        scale:
          type: integer
          minimum: 0
    WatermarkDirection:
      type: string
      enum:
        - forward
        - reverse
    WatermarkFields:
      type: object
      required:
        - direction
        - finishedAt
      properties:
        direction:
          $ref: '#/components/schemas/WatermarkDirection'
        snapshotSeq:
          type: integer
          minimum: 0
        backupLsn:
          type: string
          pattern: '^[0-9]{1,25}$'
        finishedAt:
          $ref: '#/components/schemas/WallClock'
    ApplyRequest:
      type: object
      description: One batch of canonical legacy rows for one legacy table and tenant; exactly one of `tenantId` and `siteId` is required.
      required:
        - batchId
        - origin
        - legacyTable
        - columns
        - rows
      oneOf:
        - required:
            - tenantId
        - required:
            - siteId
      additionalProperties: false
      properties:
        batchId:
          type: string
          minLength: 1
        origin:
          type: string
          enum:
            - backfill
            - migration-feed
            - legacy-window
        legacyTable:
          type: string
          minLength: 1
        tenantId:
          type: string
          format: uuid
          pattern: '^([0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[1-8][0-9A-Fa-f]{3}-[89ABab][0-9A-Fa-f]{3}-[0-9A-Fa-f]{12}|00000000-0000-0000-0000-000000000000|[Ff]{8}-[Ff]{4}-[Ff]{4}-[Ff]{4}-[Ff]{12})$'
        siteId:
          type: string
          minLength: 1
        legacyProgramId:
          type: integer
          minimum: 0
        columns:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CanonicalColumn'
        units:
          type: array
          items:
            type: string
            minLength: 1
        holderId:
          type: string
          minLength: 1
        rows:
          type: array
          items:
            type: object
            required:
              - op
              - row
            additionalProperties: false
            properties:
              op:
                type: string
                enum:
                  - upsert
                  - delete
                  - insert
              row:
                type: string
              discriminator:
                type:
                  - string
                  - number
        watermark:
          allOf:
            - $ref: '#/components/schemas/WatermarkFields'
          unevaluatedProperties: false
    ApplyResponse:
      type: object
      required:
        - batchId
        - duplicate
        - applied
        - skipped
      additionalProperties: false
      properties:
        batchId:
          type: string
        duplicate:
          type: boolean
        applied:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
    ObjectManifestEntry:
      type: object
      required:
        - key
        - size
        - sha256
      additionalProperties: false
      properties:
        key:
          type: string
        size:
          type: integer
          minimum: 0
        sha256:
          type: string
        contentType:
          type: string
        legacyPath:
          type: string
    ExportRow:
      type: object
      description: One row in legacy form; `key` is the whole-row encoding for keyless tables.
      required:
        - key
        - row
        - hash
      additionalProperties: false
      properties:
        key:
          type: string
        row:
          type: string
        hash:
          type: string
        legacyProgramId:
          type: integer
    ExportTable:
      type: object
      required:
        - unit
        - legacyTable
        - targetTable
        - keyless
        - columns
        - rows
      additionalProperties: false
      properties:
        unit:
          type: string
        legacyTable:
          type: string
        targetTable:
          type: string
        keyless:
          type: boolean
        columns:
          type: array
          items:
            $ref: '#/components/schemas/CanonicalColumn'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ExportRow'
    ExportResponse:
      type: object
      description: One export page; `next` is null after the last page, and `objects` comes with the first page only.
      required:
        - unit
        - tenantId
        - tables
        - next
      additionalProperties: false
      properties:
        unit:
          type: string
        tenantId:
          type: string
          format: uuid
        tables:
          type: array
          items:
            $ref: '#/components/schemas/ExportTable'
        next:
          type:
            - string
            - 'null'
        objects:
          type: array
          items:
            $ref: '#/components/schemas/ObjectManifestEntry'
    ChangeOp:
      type: string
      enum:
        - insert
        - update
        - delete
    ChangeOrigin:
      type: string
      enum:
        - target
        - legacy-window
        - migration-feed
        - backfill
    LegacyChange:
      type: object
      description: A changelog row in the legacy form of one mapping; `columns` are legacy names.
      required:
        - unit
        - legacyTable
        - key
        - before
        - after
        - columns
      additionalProperties: false
      properties:
        unit:
          type: string
        legacyTable:
          type: string
        key:
          type: string
        before:
          $ref: '#/components/schemas/NullableString'
        after:
          $ref: '#/components/schemas/NullableString'
        columns:
          type: array
          items:
            type: string
        legacyProgramId:
          type: integer
    ProjectedChangeRow:
      type: object
      description: One changelog row; `xid` and `seq` are decimal strings, `at` is `YYYY-MM-DD HH:MM:SS.mmm`.
      required:
        - xid
        - seq
        - table
        - op
        - key
        - before
        - after
        - columns
        - origin
        - actorUserId
        - actorService
        - at
        - requestId
        - operationId
        - legacy
      additionalProperties: false
      properties:
        xid:
          type: string
          pattern: '^[0-9]+$'
        seq:
          type: string
          pattern: '^[0-9]+$'
        table:
          type: string
        op:
          $ref: '#/components/schemas/ChangeOp'
        key:
          type: string
        before:
          $ref: '#/components/schemas/NullableString'
        after:
          $ref: '#/components/schemas/NullableString'
        columns:
          type: array
          items:
            type: string
        origin:
          $ref: '#/components/schemas/ChangeOrigin'
        actorUserId:
          $ref: '#/components/schemas/NullableString'
        actorService:
          $ref: '#/components/schemas/NullableString'
        at:
          type: string
        requestId:
          $ref: '#/components/schemas/NullableString'
        operationId:
          $ref: '#/components/schemas/NullableString'
        legacy:
          type: array
          items:
            $ref: '#/components/schemas/LegacyChange'
    OperationStatus:
      type: string
      enum:
        - open
        - done
        - rolled-back
    ChangesResponse:
      type: object
      description: Rows below `horizon` in `(xid, seq)` order; `horizon` counts as applied only when `complete`.
      required:
        - rows
        - cursor
        - horizon
        - complete
        - operations
      additionalProperties: false
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ProjectedChangeRow'
        cursor:
          type: string
          pattern: '^[0-9]+:[0-9]+$'
        horizon:
          type: string
          pattern: '^[0-9]+$'
        complete:
          type: boolean
        operations:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/OperationStatus'
    TenantDrainCount:
      type: object
      required:
        - tenantId
        - unpublished
        - held
      additionalProperties: false
      properties:
        tenantId:
          type: string
        unpublished:
          type: integer
          minimum: 0
        held:
          type: integer
          minimum: 0
    OutboxDrainCounts:
      type: object
      required:
        - tenants
        - unpublished
        - held
      additionalProperties: false
      properties:
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/TenantDrainCount'
        unpublished:
          type: integer
          minimum: 0
        held:
          type: integer
          minimum: 0
    InboxCounts:
      type: object
      description: Inbox receipts over every registered tenant; `receipts` maps each asked event id to the tenants that applied it.
      required:
        - total
        - bySubscription
      additionalProperties: false
      properties:
        total:
          type: integer
          minimum: 0
        bySubscription:
          type: object
          additionalProperties:
            type: integer
        receipts:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    PositionResponse:
      type: object
      description: The latest assigned xid and the drain counts; `outbox` or `inbox` is null where the service has no such table.
      required:
        - owner
        - position
        - outbox
        - inbox
      additionalProperties: false
      properties:
        owner:
          type: string
          const: people
        position:
          type: string
          pattern: '^[0-9]+$'
        outbox:
          oneOf:
            - $ref: '#/components/schemas/OutboxDrainCounts'
            - type: 'null'
        inbox:
          oneOf:
            - $ref: '#/components/schemas/InboxCounts'
            - type: 'null'
        published:
          type: array
          description: Published outbox events of the asked `publishedTopics`; present only when asked, empty without an outbox.
          items:
            $ref: '#/components/schemas/PublishedEvent'
    PublishedEvent:
      type: object
      description: A published outbox event and the tenant of its envelope.
      required:
        - eventId
        - topic
        - tenantId
      additionalProperties: false
      properties:
        eventId:
          type: string
          format: uuid
        topic:
          type: string
        tenantId:
          type: string
          format: uuid
    WatermarkRecord:
      type: object
      required:
        - legacyTable
        - direction
        - snapshotSeq
        - backupLsn
        - finishedAt
      additionalProperties: false
      properties:
        legacyTable:
          type: string
        direction:
          $ref: '#/components/schemas/WatermarkDirection'
        snapshotSeq:
          type:
            - integer
            - 'null'
        backupLsn:
          $ref: '#/components/schemas/NullableString'
        finishedAt:
          $ref: '#/components/schemas/LocalTimestamp'
    WatermarkInput:
      description: A watermark to record for one legacy table.
      allOf:
        - $ref: '#/components/schemas/WatermarkFields'
        - type: object
          required:
            - legacyTable
          properties:
            legacyTable:
              type: string
              minLength: 1
      unevaluatedProperties: false
    GateState:
      type: string
      enum:
        - legacy
        - open
        - closed
    GatePhase:
      type: string
      enum:
        - quiet
        - executing
        - importing
        - import-pending
    UnitList:
      type: array
      minItems: 1
      items:
        type: string
        minLength: 1
    GateRequest:
      description: One gate operation, selected by `op`.
      oneOf:
        - $ref: '#/components/schemas/GateClose'
        - $ref: '#/components/schemas/GatePhaseChange'
        - $ref: '#/components/schemas/GateOpen'
        - $ref: '#/components/schemas/GateStatus'
      discriminator:
        propertyName: op
        mapping:
          close: '#/components/schemas/GateClose'
          phase: '#/components/schemas/GatePhaseChange'
          open: '#/components/schemas/GateOpen'
          status: '#/components/schemas/GateStatus'
    GateClose:
      type: object
      description: Closes the units' gates for a holder; `allowLegacy` lets a transition close units still `legacy`.
      required:
        - op
        - units
        - holderId
      additionalProperties: false
      properties:
        op:
          type: string
          const: close
        units:
          $ref: '#/components/schemas/UnitList'
        holderId:
          type: string
          minLength: 1
        phase:
          $ref: '#/components/schemas/GatePhase'
        allowLegacy:
          type: boolean
        timeoutMs:
          type: integer
          minimum: 1
          maximum: 30000
    GatePhaseChange:
      type: object
      description: Sets the phase of gates the holder closed.
      required:
        - op
        - units
        - holderId
        - phase
      additionalProperties: false
      properties:
        op:
          type: string
          const: phase
        units:
          $ref: '#/components/schemas/UnitList'
        holderId:
          type: string
          minLength: 1
        phase:
          $ref: '#/components/schemas/GatePhase'
    GateOpen:
      type: object
      description: Reopens the holder's gates as `open`, or sets them to `legacy`.
      required:
        - op
        - units
        - holderId
      additionalProperties: false
      properties:
        op:
          type: string
          const: open
        units:
          $ref: '#/components/schemas/UnitList'
        holderId:
          type: string
          minLength: 1
        state:
          type: string
          enum:
            - open
            - legacy
    GateStatus:
      type: object
      description: Reads the gates; every unit of this owner when `units` is omitted.
      required:
        - op
      additionalProperties: false
      properties:
        op:
          type: string
          const: status
        units:
          $ref: '#/components/schemas/UnitList'
        holderId:
          type: string
          minLength: 1
    UnitGate:
      type: object
      required:
        - unit
        - state
        - holderId
        - phase
      additionalProperties: false
      properties:
        unit:
          type: string
        state:
          $ref: '#/components/schemas/GateState'
        holderId:
          $ref: '#/components/schemas/NullableString'
        phase:
          $ref: '#/components/schemas/GatePhase'
    GateResponse:
      type: object
      required:
        - units
      additionalProperties: false
      properties:
        units:
          type: array
          items:
            $ref: '#/components/schemas/UnitGate'
    GateConflict:
      type: object
      description: The units whose gate another holder owns.
      required:
        - error
        - units
      additionalProperties: false
      properties:
        error:
          type: string
          const: gate-conflict
        units:
          type: array
          items:
            type: string
    LegacyNumber:
      description: A numeric bean property as the JSON API serializes it; a NULL column serializes as an empty string.
      anyOf:
        - type: number
        - type: string
          const: ''
    LegacyDate:
      type: string
      description: A date bean property as the JSON API serializes it, `yyyy-mm-ddTHH:mm:ss` in the legacy server's zone, or empty.
      pattern: '^([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2})?$'
    EntityLinks:
      type: object
      description: Link name to URL, as the JSON API builds them.
      additionalProperties:
        type: string
    SerializedUserKey:
      type: string
      description: A key the JSON API may emit for a user; serialization removes the credential and internal keys listed here.
      not:
        enum:
          - password
          - ukey
          - hkey
          - passedprotect
          - extendsetid
          - extenddata
          - addresses
    SerializedKeys:
      description: Key rule of a serialized entity; a user omits every key SerializedUserKey excludes, an address `password` and `extenddata`.
      propertyNames:
        not:
          enum:
            - password
            - extenddata
      if:
        required:
          - entityname
        properties:
          entityname:
            const: user
      then:
        propertyNames:
          $ref: '#/components/schemas/SerializedUserKey'
    PeopleEnvelope:
      description: Legacy envelope of a user or address operation; neither `data` nor a collection item carries a removed key.
      allOf:
        - $ref: '#/components/schemas/LegacyEnvelope'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/SerializedKeys'
              properties:
                items:
                  items:
                    $ref: '#/components/schemas/SerializedKeys'
              anyOf:
                - $ref: '#/components/schemas/UserCollection'
                - $ref: '#/components/schemas/AddressCollection'
                - $ref: '#/components/schemas/UserEntity'
                - $ref: '#/components/schemas/AddressEntity'
                - $ref: '#/components/schemas/PollStateData'
                - $ref: '#/components/schemas/JsonApiEntityMeta'
    UserEntity:
      type: object
      description: A user as the JSON API serializes it, with lower-cased keys and its extended attributes; a save adds `saveErrors` and `errors`.
      additionalProperties: true
      propertyNames:
        $ref: '#/components/schemas/SerializedUserKey'
      properties:
        id:
          type: string
        userid:
          type: string
        siteid:
          type: string
        remoteid:
          type: string
        groupname:
          type: string
        fname:
          type: string
        lname:
          type: string
        username:
          type: string
        email:
          type: string
        company:
          type: string
        jobtitle:
          type: string
        mobilephone:
          type: string
        website:
          type: string
        type:
          type: string
          const: user
        subtype:
          type: string
        ext:
          type: string
        contactform:
          type: string
        s2:
          $ref: '#/components/schemas/LegacyNumber'
        lastlogin:
          $ref: '#/components/schemas/LegacyDate'
        lastupdate:
          $ref: '#/components/schemas/LegacyDate'
        lastupdateby:
          type: string
        lastupdatebyid:
          type: string
        passwordcreated:
          $ref: '#/components/schemas/LegacyDate'
        perm:
          $ref: '#/components/schemas/LegacyNumber'
        inactive:
          $ref: '#/components/schemas/LegacyNumber'
        ispublic:
          $ref: '#/components/schemas/LegacyNumber'
        subscribe:
          $ref: '#/components/schemas/LegacyNumber'
        notes:
          type: string
        description:
          type: string
        interests:
          type: string
        keepprivate:
          $ref: '#/components/schemas/LegacyNumber'
        photofileid:
          type: string
        photofileext:
          type: string
        imname:
          type: string
        imservice:
          type: string
        tags:
          type: string
        created:
          $ref: '#/components/schemas/LegacyDate'
        tablist:
          type: string
        primaryaddressid:
          type: string
        isnew:
          type: integer
          enum:
            - 0
            - 1
        links:
          $ref: '#/components/schemas/EntityLinks'
        entityname:
          type: string
          const: user
        saveErrors:
          type: boolean
        errors:
          $ref: '#/components/schemas/LegacyErrors'
    AddressEntity:
      type: object
      description: An address as the JSON API serializes it, with lower-cased keys and its extended attributes; a save adds `saveErrors` and `errors`.
      additionalProperties: true
      properties:
        id:
          type: string
        addressid:
          type: string
        userid:
          type: string
        siteid:
          type: string
        addressname:
          type: string
        address1:
          type: string
        address2:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        country:
          type: string
        phone:
          type: string
        fax:
          type: string
        isprimary:
          $ref: '#/components/schemas/LegacyNumber'
        addressnotes:
          type: string
        addressurl:
          type: string
        longitude:
          $ref: '#/components/schemas/LegacyNumber'
        latitude:
          $ref: '#/components/schemas/LegacyNumber'
        addressemail:
          type: string
        hours:
          type: string
        type:
          type: string
          examples:
            - Address
        subtype:
          type: string
          examples:
            - Default
        isnew:
          type: integer
          enum:
            - 0
            - 1
        links:
          $ref: '#/components/schemas/EntityLinks'
        entityname:
          type: string
          const: address
        saveErrors:
          type: boolean
        errors:
          $ref: '#/components/schemas/LegacyErrors'
    UserCollection:
      type: object
      description: A paged user collection as the JSON API serializes it.
      required:
        - items
      additionalProperties: true
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserEntity'
        links:
          $ref: '#/components/schemas/EntityLinks'
        startindex:
          type: integer
        endindex:
          type: integer
        pageindex:
          type: integer
        itemsperpage:
          type: integer
        totalpages:
          type: integer
        totalitems:
          type: integer
    AddressCollection:
      type: object
      description: A paged address collection as the JSON API serializes it.
      required:
        - items
      additionalProperties: true
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AddressEntity'
        links:
          $ref: '#/components/schemas/EntityLinks'
        startindex:
          type: integer
        endindex:
          type: integer
        pageindex:
          type: integer
        itemsperpage:
          type: integer
        totalpages:
          type: integer
        totalitems:
          type: integer
