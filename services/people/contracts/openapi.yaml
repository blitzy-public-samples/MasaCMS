  /internal/v1/users/current:
    get:
      operationId: readCurrentUser
      summary: Reads the user token's own user, or a new user bean without one, as the JSON API `findCurrentUser` reads it through `findOne`, which skips `allowAccess` and `allowRead`.
      description: The user comes only from the token's `sub`; an unknown user reads as a new bean under a fresh id, which takes `siteid` as its site.
      tags: [internal]
      x-opt2-transport: service
      x-opt2-requires:
        - service:identity
      security: [{invocationCredential: []}, {userToken: [], invocationCredential: []}]
      parameters:
        - name: siteid
          in: query
          required: true
          description: Site the JSON API call addresses, after its `default` fallback; equal to the token's `site` when a user token is present (403 otherwise).
          schema:
            type: string
            minLength: 1
            examples:
              - default
        - name: fields
          in: query
          required: false
          description: The call's `url.fields`.
          schema:
            type: string
        - name: expand
          in: query
          required: false
          description: The call's `expand` list.
          schema:
            type: string
        - name: expanddepth
          in: query
          required: false
          description: The call's `url.expanddepth`; absent or non-numeric reads as 1.
          schema:
            type: string
        - name: endpoint
          in: query
          required: true
          description: The call's `getEndPoint()`, the base of the user's links.
          schema:
            type: string
            minLength: 1
            examples:
              - http://localhost:8080/index.cfm/_api/json/v1/default
        - name: adminpath
          in: query
          required: true
          description: The call's `getAdminPath(complete=1)`, the base of the edit link.
          schema:
            type: string
            minLength: 1
            examples:
              - http://localhost:8080/admin
        - name: groupids
          in: query
          required: false
          description: Identity's current membership group ids of the token's user, comma-separated in `readMembershipIDs` order; the stored user's `groupid`.
          schema:
            type: string
      responses:
        '200':
          description: The user in the JSON API serialization, before identity adds the session's role lists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserRead'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
          description: The user stayed closed by an open roster operation for 10 s, or identity or the database is unavailable.

  /internal/v1/roster-operations/halted:
    get:
      operationId: listHaltedRosterOperations
      summary: Lists every roster operation recovery ever halted after identity stayed unreachable past 5 minutes, across every tenant the registry has known, deleted sites included.
      description: A halted operation keeps its user closed until `opt2-people resolve-operation <operationId> --to rolled-back|done` resolves it; it stays listed afterwards with its new state, so parity replay records each halt on the exceptions list.
      tags: [operator]
      x-opt2-transport: service
      x-opt2-requires:
        - platform.migration
        - platform.operator
      security: [{invocationCredential: []}]
      responses:
        '200':
          description: The operations recovery halted, resolved or not, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HaltedRosterOperations'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
          description: The database is unavailable.

  /internal/v2/roster-operations/halted:
    get:
      operationId: listHaltedRosterOperationsPage
      summary: Lists one page of the roster operations recovery ever halted after identity stayed unreachable past 5 minutes, across every tenant the registry has known, deleted sites included.
      description: The keyset-paged `listHaltedRosterOperations`; parity replay follows `next` until it is null and records each halt on the exceptions list. Pages follow one (startedAt, operationId) order across the tenants.
      tags: [operator]
      x-opt2-transport: service
      x-opt2-requires:
        - platform.migration
        - platform.operator
      security: [{invocationCredential: []}]
      parameters:
        - name: after
          in: query
          required: false
          description: The previous page's `next` cursor; the first page when omitted.
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: limit
          in: query
          required: false
          description: Operations per page, 1 to 1000.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        '200':
          description: One page of the operations recovery halted, resolved or not, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HaltedRosterOperationsPage'
        '400':
          $ref: '#/components/responses/BadRequest'
          description: A `limit` outside 1 to 1000, or an `after` that is not a `next` this operation issued.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
          description: The database is unavailable.

