    SystemTaskWireBody:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/SystemTaskWireBody'
    PushBody:
      type: object
      description: Pub/Sub push wrapper; `data` is the base64 event envelope.
      required:
        - message
        - subscription
      additionalProperties: true
      properties:
        message:
          type: object
          additionalProperties: true
          properties:
            data:
              type: string
              contentEncoding: base64
            attributes:
              type: object
              additionalProperties:
                type: string
            messageId:
              type: string
            message_id:
              type: string
            publishTime:
              type: string
            publish_time:
              type: string
            orderingKey:
              type: string
          allOf:
            - anyOf:
                - required:
                    - messageId
                  properties:
                    messageId:
                      minLength: 1
                - required:
                    - message_id
                  properties:
                    message_id:
                      minLength: 1
        subscription:
          type: string
          minLength: 1
          description: Usually `projects/<project>/subscriptions/<subscription>`, such as `people.identity.group.changed.v1`.
        deliveryAttempt:
          type: integer
    SweepResult:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/SweepResult'
    EnsureRecurringResult:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/EnsureRecurringResult'
    QueueControlResult:
      type: object
      description: The queue's paused state after pause or resume, or the chain task `ensure` found or created.
      required:
        - queue
        - service
      additionalProperties: false
      properties:
        queue:
          type: string
        service:
          type: string
          const: people
        paused:
          type: boolean
        running:
          type: integer
          minimum: 0
          description: Tasks of the queue still running when pause answered.
        ensured:
          $ref: '#/components/schemas/EnsureRecurringResult'
    HaltedRosterOperations:
      type: object
      required:
        - operations
      additionalProperties: false
      properties:
        operations:
          type: array
          items:
            $ref: '#/components/schemas/HaltedRosterOperation'
    HaltedRosterOperationsPage:
      type: object
      required:
        - operations
        - next
      additionalProperties: false
      properties:
        operations:
          type: array
          items:
            $ref: '#/components/schemas/HaltedRosterOperation'
        next:
          description: Opaque cursor of the following page, passed as `after`; null on the last page.
          type:
            - string
            - 'null'
    HaltedRosterOperation:
      type: object
      description: One roster operation recovery halted; `updatedAt` is its last write or operator claim.
      required:
        - operationId
        - tenantId
        - userId
        - kind
        - state
        - startedAt
        - updatedAt
        - haltedAt
        - identityUnreachableSince
        - units
      additionalProperties: false
      properties:
        operationId:
          $ref: '#/components/schemas/CfUuid'
        tenantId:
          type: string
          format: uuid
        userId:
          type: string
          minLength: 1
          description: The user the operation keeps closed, without its char(35) padding.
        kind:
          type: string
          description: The carried entry point that ran the roster write protocol.
          enum:
            - admin-add
            - admin-update
            - profile-update
        state:
          type: string
          description: The operation's state now; `halted` until an operator resolves it.
          enum:
            - started
            - people-committed
            - done
            - rolled-back
            - halted
        startedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        haltedAt:
          type: string
          format: date-time
          description: When recovery halted the operation.
        identityUnreachableSince:
          description: Start of the identity unreachability that halted the operation; null once the operation is resolved.
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        units:
          type: array
          description: Units of people and identity the operation keeps closed for its user while it is halted.
          items:
            type: string
            minLength: 1
    CanonicalType:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/CanonicalType'
    CanonicalColumn:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/CanonicalColumn'
    WatermarkDirection:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/WatermarkDirection'
    WatermarkFields:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/WatermarkFields'
    ApplyRequest:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/ApplyRequest'
    ApplyResponse:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/ApplyResponse'
    ObjectManifestEntry:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/ObjectManifestEntry'
    ExportRow:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/ExportRow'
    ExportTable:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/ExportTable'
    ExportResponse:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/ExportResponse'
    ChangeOp:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/ChangeOp'
    ChangeOrigin:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/ChangeOrigin'
    LegacyChange:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/LegacyChange'
    ProjectedChangeRow:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/ProjectedChangeRow'
    OperationStatus:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/OperationStatus'
    ChangesResponse:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/ChangesResponse'
    TenantDrainCount:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/TenantDrainCount'
    OutboxDrainCounts:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/OutboxDrainCounts'
    InboxCounts:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/InboxCounts'
    PositionResponse:
      type: object
      description: The latest assigned xid and the drain counts; `outbox` or `inbox` is null where the service has no such table.
      required:
        - owner
        - position
        - outbox
        - inbox
      additionalProperties: false
      properties:
        owner:
          type: string
          const: people
        position:
          type: string
          pattern: '^[0-9]+$'
        outbox:
          oneOf:
            - $ref: '#/components/schemas/OutboxDrainCounts'
            - type: 'null'
        inbox:
          oneOf:
            - $ref: '#/components/schemas/InboxCounts'
            - type: 'null'
        published:
          type: array
          description: Present only when `publishedTopics` is asked, empty without an outbox. Unpaged, every published outbox event of the asked topics in every tenant the registry has known by tenant, topic and id; paged, one page after `publishedAfter` and at or below `publishedFrontier`, ascending by `seq`.
          items:
            $ref: '#/components/schemas/PublishedEvent'
        registeredTenants:
          type: array
          description: Every tenant of the registry, each site's and its pools', lower-case and sorted; present only when asked.
          items:
            type: string
            format: uuid
        publishedNext:
          type: string
          pattern: '^[0-9]+$'
          description: The `publishedAfter` of the next page; it never passes an unpublished or held row of the asked topics at or below `publishedFrontier`. Present only on a paged read.
        publishedComplete:
          type: boolean
          description: True when every row of the asked topics after `publishedAfter` and at or below `publishedFrontier` is published and listed. Present only on a paged read.
        publishedFrontier:
          type: string
          pattern: '^[0-9]+$'
          description: The last `seq` the page covers, the asked `publishedThrough`, else the highest `seq` of any row of the asked topics, published or not, in every tenant the registry has known when read, or `publishedAfter` when there is none; later rows are neither listed nor blocking. Present only on a paged read.
        publishedUpTo:
          type: integer
          minimum: 0
          description: Published events of the asked topics at or below `publishedAfter`, so a caller detects rows that appeared behind its cursor. Present only on a paged read whose `publishedComplete` is true.
    PublishedEvent:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/PublishedEvent'
    WatermarkRecord:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/WatermarkRecord'
    WatermarkInput:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/WatermarkInput'
    GateState:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/GateState'
    GatePhase:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/GatePhase'
    UnitList:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/UnitList'
    GateRequest:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/GateRequest'
    GateClose:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/GateClose'
    GatePhaseChange:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/GatePhaseChange'
    GateOpen:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/GateOpen'
    GateStatus:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/GateStatus'
    UnitGate:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/UnitGate'
    GateResponse:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/GateResponse'
    GateConflict:
      $ref: '../../../platform/contracts/openapi-components.v1.yaml#/components/schemas/GateConflict'
    LegacyNumber:
      description: A numeric bean property as the JSON API serializes it; a NULL column serializes as an empty string.
      anyOf:
        - type: number
        - type: string
          const: ''
    LegacyDate:
      type: string
      description: A date bean property as the JSON API serializes it, `yyyy-mm-ddTHH:mm:ss` in the legacy server's zone, or empty.
      pattern: '^([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2})?$'
    EntityLinks:
      type: object
      description: Link name to URL, as the JSON API builds them.
      additionalProperties:
        type: string
    SerializedUserKey:
      type: string
      description: A key the JSON API may emit for a user; serialization removes the credential and internal keys listed here, and `addresses` unless `fields` selects it.
      not:
        enum:
          - password
          - ukey
          - hkey
          - passedprotect
          - extendsetid
          - extenddata
    SerializedKeys:
      description: Key rule of a serialized entity; a user omits every key SerializedUserKey excludes, an address `password` and `extenddata`.
      propertyNames:
        not:
          enum:
            - password
            - extenddata
      if:
        required:
          - entityname
        properties:
          entityname:
            const: user
      then:
        propertyNames:
          $ref: '#/components/schemas/SerializedUserKey'
    PeopleEnvelope:
      description: Legacy envelope of a user or address operation; neither `data` nor a collection item carries a removed key.
      allOf:
        - $ref: '#/components/schemas/LegacyEnvelope'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/SerializedKeys'
              properties:
                items:
                  items:
                    $ref: '#/components/schemas/SerializedKeys'
              anyOf:
                - $ref: '#/components/schemas/UserCollection'
                - $ref: '#/components/schemas/AddressCollection'
                - $ref: '#/components/schemas/UserEntity'
                - $ref: '#/components/schemas/AddressEntity'
                - $ref: '#/components/schemas/PollStateData'
                - $ref: '#/components/schemas/JsonApiEntityMeta'
    UserEntity:
      type: object
      description: A user as the JSON API serializes it, with lower-cased keys and its extended attributes.
      additionalProperties: true
      propertyNames:
        $ref: '#/components/schemas/SerializedUserKey'
      properties:
        id:
          type: string
        userid:
          type: string
        siteid:
