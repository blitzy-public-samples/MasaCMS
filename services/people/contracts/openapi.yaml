      required:
        - siteID
        - site
      additionalProperties: false
      properties:
        siteID:
          type: string
        site:
          type: string
    ExtendedAttributeValues:
      type: object
      description: Extended attribute name to stored value, for the subtype's attribute sets.
      additionalProperties:
        type: string
    UserEditData:
      type: object
      description: The Edit User screen's person and the data of its Basic, Address Information, Group Memberships, Interests, Extended Attributes and Advanced tabs.
      required:
        - user
        - isNew
        - tempIsPublic
        - lockedSuper
        - blockedUntil
        - passwordExpired
        - addresses
        - privateGroups
        - publicGroups
        - groupIds
        - categoryIds
        - subTypes
        - extendedAttributes
        - sites
        - errors
        - retained
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/PersonRecord'
        isNew:
          type: boolean
        tempIsPublic:
          type: integer
          description: User-type radio value, `setispublic` for an S2 or site-admin caller, otherwise the person's `isPublic`.
        lockedSuper:
          type: boolean
          description: True when a caller who is not a super user edits an S2 person, whose account fields are then read-only.
        blockedUntil:
          description: End of the person's login block after too many strikes; null when not blocked, new or without a username, including after removeBlock clears the strikes.
          $ref: '#/components/schemas/NullableTimestamp'
        passwordExpired:
          type: boolean
          description: The person's `getPasswordExpired()`; false while passwords never expire or for a new person.
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/AddressRecord'
        privateGroups:
          type: array
          items:
            $ref: '#/components/schemas/GroupOption'
        publicGroups:
          type: array
          items:
            $ref: '#/components/schemas/GroupOption'
        groupIds:
          type: array
          description: Groups the person belongs to.
          items:
            $ref: '#/components/schemas/CfUuid'
        categoryIds:
          type: array
          description: Interest categories the person selected.
          items:
            $ref: '#/components/schemas/CfUuid'
        subTypes:
          type: array
          items:
            $ref: '#/components/schemas/SubTypeOption'
        extendedAttributes:
          $ref: '#/components/schemas/ExtendedAttributeValues'
        sites:
          type: array
          description: Sites of the site selector.
          items:
            $ref: '#/components/schemas/SiteOption'
        errors:
          $ref: '#/components/schemas/LegacyErrors'
        retained:
          type: boolean
          description: True when `user` and `errors` are the session's retained values of a failed save.
    AddressEditData:
      type: object
      description: The Edit Address screen's person and address.
      required:
        - user
        - address
        - isNew
        - extendedAttributes
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/PersonRecord'
        address:
          $ref: '#/components/schemas/AddressRecord'
        isNew:
          type: boolean
        extendedAttributes:
          $ref: '#/components/schemas/ExtendedAttributeValues'
    ProfileData:
      type: object
      description: The Edit Profile screen's user and the data of its Basic, Address Information, Interests, Extended Attributes and Advanced tabs.
      required:
