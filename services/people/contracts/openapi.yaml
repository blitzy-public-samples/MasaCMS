        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
          description: A missing or invalid CSRF token; nothing is written, and legacy fails on the unset user bean.
        '503':
          $ref: '#/components/responses/Unavailable'
          description: A withheld branch, or a roster write-protocol step with identity that did not complete; nothing is written on either side.
  /v1/users/address:
    get:
      operationId: getAddressEdit
      summary: Reads a person and one of their addresses, or a new address for an empty `addressid`, as `cusers.editAddress` does.
      description: A caller holding only `m:008` also needs `m:000` on the site, and is otherwise refused with 403.
