      summary: Resolves the redirect of `cusers.route` and clears the session's retained edit values.
      description: A caller holding only `m:008` also needs `m:000` on the site, and is otherwise refused with 403; `ispublic` reads as 1 unless the caller is S2 or site admin.
      tags: [users]
      x-opt2-transport: service
      x-opt2-requires:
