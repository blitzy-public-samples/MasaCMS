                          - type: object
                            properties:
                              items:
                                type: array
                                items:
                                  $ref: '#/components/schemas/FixtureSurveyResponse'
        '400':
          $ref: '#/components/responses/FixtureBadRequest'
        '401':
          $ref: '#/components/responses/FixtureUnauthorized'
        '403':
          $ref: '#/components/responses/FixtureForbidden'
        '404':
          $ref: '#/components/responses/FixtureNotFound'
        '500':
          $ref: '#/components/responses/FixtureServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: fixtureSubmitSurveyResponse
      summary: Stores the answers of a member of the request site, the survey's site or a targeted site, under the survey's site.
      tags:
        - fixture
      x-opt2-transport: service
      x-opt2-requires:
        - member
        - system-user
      security:
        - userToken: []
          invocationCredential: []
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
        - $ref: '#/components/parameters/CsrfExpiresHeader'
        - $ref: '#/components/parameters/FixtureAnswersQuery'
      requestBody:
        $ref: '#/components/requestBodies/FixtureResponseCall'
      responses:
        '200':
          description: The stored response.
          headers:
            Generator:
              $ref: '#/components/headers/Generator'
            Strict-Transport-Security:
              $ref: '#/components/headers/StrictTransportSecurity'
            ETag:
              $ref: '#/components/headers/ETag'
            X-Opt2-Write-Position:
              $ref: '#/components/headers/XOpt2WritePosition'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FixtureEnvelope'
                  - type: object
                    properties:
                      method:
                        type: string
                        const: surveys.surveys.responses
                      data:
                        $ref: '#/components/schemas/FixtureSurveyResponse'
