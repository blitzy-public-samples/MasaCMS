      requestBody:
        $ref: '#/components/requestBodies/FixtureScheduleCall'
      responses:
        '200':
          description: The survey detail with its new schedule version and reminders.
          headers:
            Generator:
              $ref: '#/components/headers/Generator'
            Strict-Transport-Security:
              $ref: '#/components/headers/StrictTransportSecurity'
            ETag:
              $ref: '#/components/headers/ETag'
            X-Opt2-Write-Position:
              $ref: '#/components/headers/XOpt2WritePosition'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FixtureEnvelope'
                  - type: object
                    properties:
                      method:
                        type: string
                        const: surveys.surveys.schedule
                      data:
