  /v1/surveys:
    get:
      operationId: listSurveys
      summary: Lists the site's surveys with their schedules for the Surveys screen, ordered by creation time and id.
      tags:
        - v1
      x-opt2-transport: service
      x-opt2-requires:
        - surveys.manager
      security:
        - userToken: []
          invocationCredential: []
      parameters:
        - $ref: '#/components/parameters/SiteIdQuery'
      responses:
        '200':
          description: The site's surveys.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                additionalProperties: false
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Survey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/surveys/{surveyId}:
    parameters:
      - $ref: '#/components/parameters/SurveyId'
    get:
      operationId: getSurvey
      summary: Reads one survey of the site with its schedule.
      tags:
        - v1
      x-opt2-transport: service
      x-opt2-requires:
        - surveys.manager
      security:
        - userToken: []
          invocationCredential: []
      parameters:
        - $ref: '#/components/parameters/SiteIdQuery'
      responses:
        '200':
          description: The survey.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                additionalProperties: false
