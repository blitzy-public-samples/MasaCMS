        '400':
          $ref: '#/components/responses/FixtureBadRequest'
        '401':
          $ref: '#/components/responses/FixtureUnauthorized'
        '403':
          $ref: '#/components/responses/FixtureForbidden'
        '404':
          $ref: '#/components/responses/FixtureNotFound'
        '500':
          $ref: '#/components/responses/FixtureServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /legacy-fixtures/cfml/api.cfm/surveys/surveys/{id}/launch:
    parameters:
      - $ref: '#/components/parameters/FixtureSurveyId'
      - $ref: '#/components/parameters/FixtureSiteId'
        description: Legacy site id, also read from the body; empty means the session site, which a task run lacks, and an unknown site answers `invalidParameters`.
      - $ref: '#/components/parameters/UseDataNamespace'
      - $ref: '#/components/parameters/MethodOverride'
      - $ref: '#/components/parameters/FixtureTaskToken'
    get:
      operationId: fixtureLaunchCallback
      summary: Launch task callback; marks the survey LAUNCHED the first time and returns its row.
      tags:
        - fixture
      x-opt2-transport: service
      x-opt2-public: true
      x-opt2-site-check: false
      security: []
      responses:
        '200':
          description: The survey row; a repeated call returns it unchanged.
          headers:
            Generator:
              $ref: '#/components/headers/Generator'
            Strict-Transport-Security:
              $ref: '#/components/headers/StrictTransportSecurity'
            ETag:
              $ref: '#/components/headers/ETag'
            X-Opt2-Write-Position:
              $ref: '#/components/headers/XOpt2WritePosition'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FixtureEnvelope'
                  - type: object
                    properties:
                      method:
                        type: string
                        const: surveys.surveys.launch
                      data:
                        $ref: '#/components/schemas/FixtureSurvey'
        '400':
          $ref: '#/components/responses/FixtureBadRequest'
        '401':
          $ref: '#/components/responses/FixtureUnauthorized'
          description: The platform's refusal of a presented invalid credential.
        '403':
          $ref: '#/components/responses/FixtureForbidden'
          description: The task token is absent or does not match, or the survey is not scheduled in the site.
        '500':
          $ref: '#/components/responses/FixtureServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: fixtureLaunchCallbackPost
      summary: Launch task callback by POST; answers as GET does.
      tags:
        - fixture
      x-opt2-transport: service
      x-opt2-public: true
      x-opt2-site-check: false
      security: []
      requestBody:
        $ref: '#/components/requestBodies/FixtureLaunchCallbackCall'
      responses:
        '200':
          description: The survey row; a repeated call returns it unchanged.
          headers:
            Generator:
              $ref: '#/components/headers/Generator'
            Strict-Transport-Security:
              $ref: '#/components/headers/StrictTransportSecurity'
            ETag:
              $ref: '#/components/headers/ETag'
            X-Opt2-Write-Position:
              $ref: '#/components/headers/XOpt2WritePosition'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FixtureEnvelope'
                  - type: object
                    properties:
                      method:
                        type: string
                        const: surveys.surveys.launch
                      data:
                        $ref: '#/components/schemas/FixtureSurvey'
        '400':
          $ref: '#/components/responses/FixtureBadRequest'
        '401':
          $ref: '#/components/responses/FixtureUnauthorized'
          description: The platform's refusal of a presented invalid credential.
        '403':
          $ref: '#/components/responses/FixtureForbidden'
          description: The task token is absent or does not match, or the survey is not scheduled in the site.
        '500':
          $ref: '#/components/responses/FixtureServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
