        - $ref: '#/components/parameters/CsrfExpiresHeader'
        - $ref: '#/components/parameters/FixtureTargetsQuery'
      requestBody:
        $ref: '#/components/requestBodies/FixtureBulkTargetCall'
      responses:
        '200':
          description: The counts `usp_survey_bulk_target` returns.
          headers:
