openapi: 3.1.0
info:
  title: surveys
  version: 1.0.0
  description: 'SYNTHETIC: surveys - no Masa equivalent; legacy oracle in legacy-fixtures/'
  x-source-sha: 696383140578f8dea3ece26f80cd7bfb370ddf0f
servers:
  - url: http://127.0.0.1:8117
    description: local
x-opt2-calls:
  - communications
security:
  - userToken: []
    invocationCredential: []
tags:
  - name: fixture
    description: Fixture routes, answered byte-shaped like `legacy-fixtures/cfml/modules/surveys.cfc`.
  - name: v1
    description: JSON API of the OPT-2 surveys screens; a breaking change takes a /v2/ prefix.
  - name: internal
    description: Task, push-delivery, migration, queue-control and service-to-service routes.
  - name: health
    description: Liveness probe.
paths:
  /legacy-fixtures/cfml/api.cfm/surveys/surveys:
    parameters:
      - $ref: '#/components/parameters/FixtureSiteId'
      - $ref: '#/components/parameters/UseDataNamespace'
      - $ref: '#/components/parameters/MethodOverride'
    get:
      operationId: fixtureListSurveys
      summary: Lists one page of the site's surveys, ordered by creation time and id.
      tags:
        - fixture
      x-opt2-transport: service
      x-opt2-requires:
        - surveys.manager
      security:
        - userToken: []
          invocationCredential: []
      parameters:
        - $ref: '#/components/parameters/PageIndex'
        - $ref: '#/components/parameters/ItemsPerPage'
      responses:
        '200':
          description: One page of surveys.
          headers:
            Generator:
              $ref: '#/components/headers/Generator'
            Strict-Transport-Security:
              $ref: '#/components/headers/StrictTransportSecurity'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FixtureEnvelope'
                  - type: object
                    properties:
                      method:
                        type: string
                        const: surveys.surveys
                      data:
                        allOf:
                          - $ref: '#/components/schemas/FixtureList'
                          - type: object
                            properties:
                              items:
                                type: array
                                items:
                                  $ref: '#/components/schemas/FixtureSurvey'
        '400':
          $ref: '#/components/responses/FixtureBadRequest'
        '401':
          $ref: '#/components/responses/FixtureUnauthorized'
        '403':
          $ref: '#/components/responses/FixtureForbidden'
        '500':
          $ref: '#/components/responses/FixtureServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: fixtureCreateSurvey
      summary: Creates a DRAFT survey in the site and returns its detail.
      tags:
        - fixture
      x-opt2-transport: service
      x-opt2-requires:
        - surveys.manager
      security:
        - userToken: []
          invocationCredential: []
      parameters:
        - $ref: '#/components/parameters/CsrfTokenHeader'
        - $ref: '#/components/parameters/CsrfExpiresHeader'
        - $ref: '#/components/parameters/FixtureTitleQuery'
      requestBody:
        $ref: '#/components/requestBodies/FixtureCreateSurveyCall'
      responses:
        '200':
          description: The created survey.
          headers:
            Generator:
              $ref: '#/components/headers/Generator'
            Strict-Transport-Security:
              $ref: '#/components/headers/StrictTransportSecurity'
            ETag:
              $ref: '#/components/headers/ETag'
            X-Opt2-Write-Position:
              $ref: '#/components/headers/XOpt2WritePosition'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FixtureEnvelope'
                  - type: object
                    properties:
                      method:
                        type: string
                        const: surveys.surveys
                      data:
                        $ref: '#/components/schemas/FixtureSurveyDetail'
        '400':
          $ref: '#/components/responses/FixtureWriteBadRequest'
        '401':
          $ref: '#/components/responses/FixtureUnauthorized'
        '403':
          $ref: '#/components/responses/FixtureForbidden'
        '500':
          $ref: '#/components/responses/FixtureServerError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /legacy-fixtures/cfml/api.cfm/surveys/surveys/{id}:
    parameters:
      - $ref: '#/components/parameters/FixtureSurveyId'
      - $ref: '#/components/parameters/FixtureSiteId'
      - $ref: '#/components/parameters/UseDataNamespace'
      - $ref: '#/components/parameters/MethodOverride'
    get:
      operationId: fixtureGetSurvey
      summary: Reads one survey of the site with its schedule, reminders and targets.
      tags:
        - fixture
      x-opt2-transport: service
      x-opt2-requires:
        - surveys.manager
      security:
        - userToken: []
          invocationCredential: []
      responses:
        '200':
          description: The survey detail.
          headers:
            Generator:
              $ref: '#/components/headers/Generator'
            Strict-Transport-Security:
              $ref: '#/components/headers/StrictTransportSecurity'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/FixtureEnvelope'
                  - type: object
                    properties:
                      method:
