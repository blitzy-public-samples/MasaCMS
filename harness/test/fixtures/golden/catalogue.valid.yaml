      - name: main
        method: GET
        route: /admin/?muraAction=cLogin.main
        as: siteAdmin
        csrf: none
      - name: login
        method: POST
        route: /admin/index.cfm
        as: siteAdmin
        csrf: fetch-form
        csrfFrom: main
        form:
          muraAction: cLogin.login
          username: "${user:tenant-a:site-admin}"
          password: "${secret:seed:${user:tenant-a:site-admin}}"
          isAdminLogin: "true"
          returnUrl: ""
      - name: form
        method: GET
        route: /admin/?muraAction=cUsers.edituser&siteid=tenant-a&userid=
        as: siteAdmin
        extract:
          userid:
            from: dom
            selector: "form[name=form1]"
            attr: action
            param: userid
      - name: create
        method: POST
        route: "/admin/?muraAction=cUsers.update&userid=${form.userid}&routeid="
        as: siteAdmin
        csrf: fetch-form
        csrfFrom: form
        form:
          type: "2"
          action: Add
          siteid: tenant-a
          usernameNoCache: rehearsal-01
          passwordNoCache: "${secret:generated:rehearsal-01}"
          password2: "${secret:generated:rehearsal-01}"
          fname: Pat
          lname: Example
          email: rehearsal-01@example.test
          isPublic: "0"
          groupid: ""
    compare:
      - status
      - dom
    normalisationOverrides: []
    covers:
      - "admin:cusers.update{type=2,action=add}"
