  - id: GS-ES-02
    title: Audit chain, verification and tamper detection
    service: e-signature
    role: esignature.signer, esignature.auditor
    fixtures: required
    sessions:
      signer: {login: 'seed:tenant-a:esignature.signer', via: jsonapi}
      auditor: {login: 'seed:tenant-a:esignature.auditor', via: jsonapi}
      admin: {login: admin, via: admin}
    seedRefs:
      - {as: signer, source: dataset, path: masa.users, where: {username: '${user:tenant-a:esignature.signer}'}}
    steps:
      - name: request
        method: POST
        route: /legacy-fixtures/cfml/api.cfm/esignature/requests?siteid=tenant-a
        as: signer
        csrf: 'json-api:'
        body:
          documentName: gs-es-02.txt
          documentBase64: R1MtRVMgZ29sZGVuIGRvY3VtZW50
          signerUserId: ${seed.signer.userID}
        extract:
          id: {from: body, path: data.request_id}
      - name: sign
        method: POST
        route: /legacy-fixtures/cfml/api.cfm/esignature/requests/${request.id}/sign?siteid=tenant-a
        as: signer
        csrf: json-api:${request.id}
        body:
          typedName: Golden Signer
      - name: audit
        method: GET
        route: /legacy-fixtures/cfml/api.cfm/esignature/requests/${request.id}/audit?siteid=tenant-a
        as: auditor
        extract:
          items: {from: body, path: data.items}
          first: {from: body, path: 'data.items[0]'}
          second_seq: {from: body, path: 'data.items[1].seq'}
          second_action: {from: body, path: 'data.items[1].action'}
          second_actor_user_id: {from: body, path: 'data.items[1].actor_user_id'}
          second_at: {from: body, path: 'data.items[1].at'}
          second_prev_hash: {from: body, path: 'data.items[1].prev_hash'}
          second_entry_hash: {from: body, path: 'data.items[1].entry_hash'}
      - name: verify
        method: GET
        route: /legacy-fixtures/cfml/api.cfm/esignature/requests/${request.id}/verify?siteid=tenant-a
        as: auditor
      - name: verify-supplied
        method: POST
        route: /legacy-fixtures/cfml/api.cfm/esignature/requests/${request.id}/verify?siteid=tenant-a
        as: auditor
        csrf: json-api:${request.id}
        body:
          entries: ${audit.items}
      - name: verify-tampered
        method: POST
        route: /legacy-fixtures/cfml/api.cfm/esignature/requests/${request.id}/verify?siteid=tenant-a
        as: auditor
        csrf: json-api:${request.id}
        body:
          entries:
            - ${audit.first}
            - seq: ${audit.second_seq}
              action: ${audit.second_action}
              actor_user_id: ${audit.second_actor_user_id}
              detail: Tampered Signer
              at: ${audit.second_at}
              prev_hash: ${audit.second_prev_hash}
              entry_hash: ${audit.second_entry_hash}
    compare: [status, envelope]
    normalisationOverrides: {}
    covers:
      - fixture:esignature/requests@post
      - fixture:esignature/requests/{id}/sign@post
      - fixture:esignature/requests/{id}/audit@get
      - fixture:esignature/requests/{id}/verify@get
      - fixture:esignature/requests/{id}/verify@post
