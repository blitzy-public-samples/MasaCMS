        route: /admin/?muraAction=cUsers.editUser&siteid=tenant-a&userid=${seed.person.userID}
        as: siteAdmin
      - name: update
        method: POST
        route: /admin/?muraAction=cUsers.update&userid=${seed.person.userID}&routeid=
        as: siteAdmin
        csrf: fetch-form
        csrfFrom: edit
        form:
          type: '2'
          action: Update
          siteid: tenant-a
          isPublic: '0'
          fname: ${seed.person.fname}
          lname: ${seed.person.lname}
          email: ${seed.person.email}
          usernameNoCache: ${seed.person.username}
          InActive: '0'
          subscribe: '0'
          jobtitle: GS-PE-02 Coordinator
      - name: new-address
        method: GET
        route: /admin/?muraAction=cUsers.editAddress&siteid=tenant-a&userid=${seed.person.userID}&addressid=&routeid=
        as: siteAdmin
      - name: add-address
        method: POST
        route: /admin/?muraAction=cUsers.updateAddress&userid=${seed.person.userID}&routeid=&siteid=tenant-a
        as: siteAdmin
        csrf: fetch-form
        csrfFrom: new-address
        form:
          action: Add
          siteid: tenant-a
          isPublic: '0'
          addressName: GS-PE-02 Office
          address1: 20 Roster Avenue
          city: Sample City
          state: NY
          zip: '10002'
          country: USA
