# Golden scenarios: requests only; responses are whatever legacy answers at capture. Capture and replay follow this order, except that scenarios declaring acrossTransition run first and the GS-PE-RH rehearsal scenarios last.
# Scenario: id, title, service, role, sessions{name: {login, via}}, seedRefs[{as, source, path, where, index}], steps[], compare[], rows[{table, where}], normalisationOverrides, covers[]; optional purpose, tableVersion, fixtures, expected, decisionListRef, exceptionId, acrossTransition, replayFaults, browser.
# Step: name, method, route, as, auth, csrf, csrfFrom, mergeHidden, headers, form | body | multipart{fields, files[{field, fixture | fromStep, filename, contentType}]}, extract, poll, settle, matrix, knownIssue, expected, decisionListRef, exceptionId, compare, candidates.
# A multipart file's fromStep uploads the body of that earlier step's last response in the same scenario.
# auth: session | anonymous | basic:<user>:<secret> | bearer:<token>; csrf: fetch-form | json-api:<context> | none; extract: {from: body | header:<Name> | dom | location-query, path | selector, attr, param | pattern} (dom path: JSON body string holding the markup; dom pattern: regular expression whose first capture group, matched against the attr value or text, is the value).
# seedRefs index is 0-based and negative from the end; a reserved ref resolves to a scalar, read as ${seed.<as>}.
# Placeholders: ${secret:admin|qa_editor|appreload|seed:<user>|oauth:<clientId>|generated:<name>}, ${user:<site>:<role>}, ${seed.<as>.<field>}, ${<step>.<binding>}, ${matrix.<var>}, ${asOf}, ${nodash:<value>} (<value> without '-'), ${urlencode:<value>} (legacy esapiEncode('url')); keys resolve like values.
sourceSha: 696383140578f8dea3ece26f80cd7bfb370ddf0f
version: 1
defaults:
  tableVersion: v0002
  compare: [status, headers, auth]
scenarios:
  - id: GS-ID-01
    title: Admin login and logout
    service: identity
    role: admin (S2)
    sessions:
      browser: {login: none, via: admin}
    seedRefs: []
    steps:
      - name: login-form
        method: GET
        route: /admin/?muraAction=clogin.main
        as: browser
        auth: session
      - name: login
        method: POST
        route: /admin/index.cfm
        as: browser
        auth: session
        csrf: fetch-form
        csrfFrom: login-form
        form:
          username: admin
          'password': ${secret:admin}
          muraAction: cLogin.login
          isAdminLogin: 'true'
          returnUrl: ''
          compactDisplay: 'false'
      - name: home
        method: GET
        route: /admin/
        as: browser
      - name: logout
        method: GET
        route: /admin/?muraAction=cLogin.logout
        as: browser
      - name: protected-after-logout
        method: GET
        route: /admin/?muraAction=cArch.list&siteid=default&moduleid=00000000000000000000000000000000000&topid=00000000000000000000000000000000001
        as: browser
    compare: [status, headers, auth, dom]
    normalisationOverrides: {}
    covers:
      - admin:clogin.main
      - admin:clogin.login
      - admin:home.redirect
      - admin:clogin.logout
      - admin:carch.list
  - id: GS-ID-02
    title: Editor login with role-limited access
    service: identity
    role: qa_editor
    sessions:
      editor: {login: qa_editor, via: admin}
    seedRefs: []
    steps:
      - name: nav
        method: GET
        route: /admin/?muraAction=cArch.list&siteid=default&moduleid=00000000000000000000000000000000000&topid=00000000000000000000000000000000001
        as: editor
      - name: users-denied
        method: GET
        route: /admin/?muraAction=cUsers.list&siteid=default
        as: editor
      - name: noaccess
        method: GET
        route: /admin/?muraAction=cMessage.noaccess&siteid=default
        as: editor
    compare: [status, auth, dom]
    normalisationOverrides: {}
    covers:
      - admin:carch.list
      - admin:cusers.list
      - admin:cmessage.noaccess
  - id: GS-ID-09
    title: Session and CSRF continuity across the seam
    service: identity
    role: admin
    sessions:
      admin: {login: none, via: admin, site: tenant-a}
      member: {login: none, via: admin, site: tenant-a}
    seedRefs:
      - {as: group, source: dataset, path: masa.groups, where: {siteID: tenant-a}, index: -1}
      - {as: memberUser, source: dataset, path: masa.users, where: {username: '${user:tenant-a:system-user}'}}
    acrossTransition:
      - {before: adopt-continue, from: v0001, to: v0002}
    steps:
      - name: admin-login-form
        method: GET
        route: /admin/?muraAction=clogin.main
        as: admin
        auth: session
      - name: admin-login
        method: POST
        route: /admin/index.cfm
        as: admin
        auth: session
        csrf: fetch-form
        csrfFrom: admin-login-form
        form:
          username: admin
          'password': ${secret:admin}
          muraAction: cLogin.login
          isAdminLogin: 'true'
          returnUrl: ''
          compactDisplay: 'false'
      - name: adopt-open
        method: GET
        route: /admin/?muraAction=cArch.list&siteid=tenant-a&moduleid=00000000000000000000000000000000000&topid=00000000000000000000000000000000001
        as: admin
      - name: adopt-continue
        method: GET
        route: /admin/?muraAction=cUsers.listUsers&siteid=tenant-a&ispublic=0
        as: admin
      - name: seam-user-form
        method: GET
        route: /admin/?muraAction=cUsers.editUser&siteid=tenant-a&userid=&ispublic=0
        as: admin
        extract:
          userid: {from: dom, selector: 'form[name=form1]', attr: action, param: userid}
      - name: seam-user
        method: POST
        route: /admin/?muraAction=cUsers.update&userid=${seam-user-form.userid}&routeid=
        as: admin
        csrf: fetch-form
        csrfFrom: seam-user-form
        form:
          type: '2'
          action: Add
          siteid: tenant-a
          isPublic: '0'
          fname: GS
          lname: ID-09
          email: gs-id-09-1@seed.opt2.test
          usernameNoCache: gs-id-09-1
          InActive: '0'
          subscribe: '0'
          passwordNoCache: ${secret:generated:gs-id-09}
          password2: ${secret:generated:gs-id-09}
      - name: seam-user-edit
        method: GET
        route: /admin/?muraAction=cUsers.editUser&siteid=tenant-a&userid=${seam-user-form.userid}
        as: admin
        extract:
          csrfToken: {from: dom, selector: 'form[name=form1] input[name=csrf_token]', attr: value}
          csrfExpires: {from: dom, selector: 'form[name=form1] input[name=csrf_token_expires]', attr: value}
      - name: carried-form-to-withheld
        method: POST
        route: /admin/?muraAction=cUsers.update&userid=${seam-user-form.userid}&routeid=
        as: admin
        form:
          type: '2'
          action: Delete
          siteid: tenant-a
          csrf_token: ${seam-user-edit.csrfToken}
          csrf_token_expires: ${seam-user-edit.csrfExpires}
        expected: withheld
        decisionListRef: admin:cusers.update{type=2,action=delete}
      - name: withheld-token-resubmitted
        method: POST
        route: /admin/?muraAction=cUsers.update&userid=${seam-user-form.userid}&routeid=
        as: admin
        form:
          type: '2'
          action: Update
          siteid: tenant-a
          isPublic: '0'
          fname: GS
          lname: ID-09
          email: gs-id-09-1@seed.opt2.test
          usernameNoCache: gs-id-09-1
          InActive: '0'
          subscribe: '0'
          csrf_token: ${seam-user-edit.csrfToken}
          csrf_token_expires: ${seam-user-edit.csrfExpires}
      - name: legacy-login-page
        method: GET
        route: /?display=login
        as: member
        auth: session
        extract:
          csrfToken: {from: dom, selector: 'form:has(input[name=password]) input[name=csrf_token]', attr: value}
          csrfExpires: {from: dom, selector: 'form:has(input[name=password]) input[name=csrf_token_expires]', attr: value}
        expected: withheld
        decisionListRef: page:render
      - name: legacy-token-to-carried-login
        method: POST
        route: /admin/index.cfm
        as: member
        auth: session
        form:
          username: ${user:tenant-a:system-user}
          'password': ${secret:seed:${user:tenant-a:system-user}}
          muraAction: cLogin.login
          isAdminLogin: 'true'
          returnUrl: ''
          compactDisplay: 'false'
          csrf_token: ${legacy-login-page.csrfToken}
          csrf_token_expires: ${legacy-login-page.csrfExpires}
      - name: membership-tokens
        method: GET
        route: /_api/json/v1/tenant-a/generateCSRFTokens?context=${seed.memberUser.userID}${seed.group.groupID}addtogroup
        as: admin
        extract:
          csrfToken: {from: body, path: data.csrf_token}
          csrfExpires: {from: body, path: data.csrf_token_expires}
      - name: membership-change
        method: POST
        route: /admin/?muraAction=cUsers.addToGroup
        as: admin
        form:
          userid: ${seed.memberUser.userID}
          groupid: ${seed.group.groupID}
          siteid: tenant-a
          routeid: ''
          returnurl: ''
          csrf_token: ${membership-tokens.csrfToken}
          csrf_token_expires: ${membership-tokens.csrfExpires}
      - name: member-first-legacy-request
        method: GET
        route: /
        as: member
        auth: session
        expected: withheld
        decisionListRef: page:render
      - name: member-carried-request
        method: GET
        route: /admin/?muraAction=cUsers.listUsers&siteid=tenant-a&ispublic=0
        as: member
      - name: carried-token-resubmitted-to-legacy
        method: POST
        route: /
        as: member
        auth: session
        form:
          doaction: login
          username: ${user:tenant-a:system-user}
          'password': ${secret:seed:${user:tenant-a:system-user}}
          csrf_token: ${legacy-login-page.csrfToken}
          csrf_token_expires: ${legacy-login-page.csrfExpires}
      - name: membership-restore
        method: GET
        route: /admin/?muraAction=cUsers.removeFromGroup&userid=${seed.memberUser.userID}&groupid=${seed.group.groupID}&siteid=tenant-a
        as: admin
      - name: profile-form
        method: GET
        route: /admin/?muraAction=cEditProfile.edit
        as: admin
        extract:
          csrfToken: {from: dom, selector: 'form[name=form1] input[name=csrf_token]', attr: value}
          csrfExpires: {from: dom, selector: 'form[name=form1] input[name=csrf_token_expires]', attr: value}
          fname: {from: dom, selector: 'form[name=form1] input[name=fname]', attr: value}
          lname: {from: dom, selector: 'form[name=form1] input[name=lname]', attr: value}
          email: {from: dom, selector: 'form[name=form1] input[name=email]', attr: value}
          username: {from: dom, selector: 'form[name=form1] input[name=usernameNoCache]', attr: value}
      - name: token-to-nonvalidating-legacy
        method: POST
        route: /admin/?muraAction=cEmail.update
        as: admin
        form:
          siteid: tenant-a
          action: ''
          csrf_token: ${profile-form.csrfToken}
          csrf_token_expires: ${profile-form.csrfExpires}
      - name: same-token-on-carried-form
        method: POST
        route: /admin/?muraAction=cEditProfile.update
        as: admin
        form:
          fname: ${profile-form.fname}
          lname: ${profile-form.lname}
          email: ${profile-form.email}
          usernameNoCache: ${profile-form.username}
          type: '2'
          action: ''
          contact: '0'
          csrf_token: ${profile-form.csrfToken}
          csrf_token_expires: ${profile-form.csrfExpires}
      - name: approval-form
        method: GET
        route: /admin/?muraAction=cEditProfile.edit
        as: admin
        extract:
          csrfToken: {from: dom, selector: 'form[name=form1] input[name=csrf_token]', attr: value}
          csrfExpires: {from: dom, selector: 'form[name=form1] input[name=csrf_token_expires]', attr: value}
          fname: {from: dom, selector: 'form[name=form1] input[name=fname]', attr: value}
          lname: {from: dom, selector: 'form[name=form1] input[name=lname]', attr: value}
          email: {from: dom, selector: 'form[name=form1] input[name=email]', attr: value}
          username: {from: dom, selector: 'form[name=form1] input[name=usernameNoCache]', attr: value}
      - name: approval-bypass
        method: POST
        route: /admin/?muraAction=carch.approvalaction
        as: admin
        form:
          requestid: ''
          action: reject
          comment: GS-ID-09
          siteid: tenant-a
          csrf_token: ${approval-form.csrfToken}
          csrf_token_expires: ${approval-form.csrfExpires}
      - name: bypassed-token-accepted-on-carried-form
        method: POST
        route: /admin/?muraAction=cEditProfile.update
        as: admin
        form:
          fname: ${approval-form.fname}
          lname: ${approval-form.lname}
          email: ${approval-form.email}
          usernameNoCache: ${approval-form.username}
          type: '2'
          action: ''
          contact: '0'
          csrf_token: ${approval-form.csrfToken}
          csrf_token_expires: ${approval-form.csrfExpires}
      - name: consumed-token-rejected-on-legacy-variant
        method: POST
        route: /admin/?muraAction=cEditProfile.update
        as: admin
        form:
          fname: ${approval-form.fname}
          lname: ${approval-form.lname}
          email: ${approval-form.email}
          usernameNoCache: ${approval-form.username}
          type: '2'
          action: ''
          contact: '0'
          extendSetID: gs-id-09-no-extend-set
          csrf_token: ${approval-form.csrfToken}
          csrf_token_expires: ${approval-form.csrfExpires}
        expected: withheld
        decisionListRef: admin:ceditprofile.update{extdata}
      - name: carried-logout
        method: GET
        route: /admin/?muraAction=cLogin.logout
        as: member
      - name: legacy-after-carried-logout
        method: GET
        route: /
        as: member
        auth: session
        expected: withheld
        decisionListRef: page:render
      - name: legacy-logout
        method: POST
        route: /
        as: admin
        auth: session
        form:
          doaction: logout
      - name: carried-after-legacy-logout
        method: GET
        route: /admin/?muraAction=cArch.list&siteid=tenant-a&moduleid=00000000000000000000000000000000000&topid=00000000000000000000000000000000001
        as: admin
    compare: [status, auth, dom]
    normalisationOverrides: {}
    covers:
      - admin:clogin.main
      - admin:clogin.login
      - admin:carch.list
      - admin:cusers.listusers
      - admin:cusers.edituser
      - admin:cusers.update{type=2,action=add}
      - admin:cusers.update{type=2,action=delete}
      - admin:cusers.update{type=2,action=update}
      - page:render
      - api:generatecsrftokens
      - admin:cusers.addtogroup
      - page:login
      - admin:cusers.removefromgroup
      - admin:ceditprofile.edit
      - admin:cemail.update
      - admin:ceditprofile.update
      - admin:carch.approvalaction
      - admin:ceditprofile.update{extdata}
      - admin:clogin.logout
      - page:logout
  - id: GS-PE-01
    title: People roster create
    service: people
    role: site-admin
    sessions:
      siteAdmin: {login: 'seed:tenant-a:site-admin', via: admin}
    seedRefs: []
    steps:
      - name: create-form
        method: GET
        route: /admin/?muraAction=cUsers.editUser&siteid=tenant-a&userid=&ispublic=0
        as: siteAdmin
        extract:
          userid: {from: dom, selector: 'form[name=form1]', attr: action, param: userid}
      - name: create
        method: POST
        route: /admin/?muraAction=cUsers.update&userid=${create-form.userid}&routeid=
        as: siteAdmin
        csrf: fetch-form
        csrfFrom: create-form
        form:
          type: '2'
          action: Add
          siteid: tenant-a
          isPublic: '0'
          fname: GS
          lname: PE-01
          email: gs-pe-01-1@seed.opt2.test
          usernameNoCache: gs-pe-01-1
          InActive: '0'
          subscribe: '0'
          passwordNoCache: ${secret:generated:gs-pe-01}
          password2: ${secret:generated:gs-pe-01}
          address1: 10 Roster Street
          address2: Suite 2
          city: Sample City
          state: NY
          zip: '10001'
          country: USA
          phone: 555-0100
          addressEmail: office@seed.opt2.test
          isPrimary: '1'
    compare: [status, auth, dom, rows]
    rows:
      - {table: tusers, where: {userid: '${create-form.userid}'}}
      - {table: tuseraddresses, where: {userid: '${create-form.userid}'}}
      - {table: tusersmemb, where: {userid: '${create-form.userid}'}}
    normalisationOverrides: {}
    covers:
      - admin:cusers.edituser
      - admin:cusers.update{type=2,action=add}
  - id: GS-PE-02
    title: People roster edit with address
    service: people
    role: site-admin
    sessions:
      siteAdmin: {login: 'seed:tenant-a:site-admin', via: admin}
    seedRefs:
      - {as: person, source: dataset, path: masa.users, where: {siteID: tenant-a, isPublic: 0}, index: -2}
    steps:
      - name: edit
