# Golden scenarios: requests only; responses are whatever legacy answers at capture. Order is capture order.
# Scenario: id, title, service, role, sessions{name: {login, via}}, seedRefs[{as, source, path, where, index}], steps[], compare[], rows[{table, where}], normalisationOverrides, covers[]; optional purpose, tableVersion, fixtures, expected, decisionListRef, exceptionId, acrossTransition, replayFaults, browser, tasks.
# Step: name, method, route, as, auth, csrf, csrfFrom, headers, form | body | multipart{fields, files[{field, fixture, filename, contentType}]}, extract, poll, settle, matrix, knownIssue, expected, decisionListRef, exceptionId, compare, candidates.
# auth: session | anonymous | basic:<user>:<secret> | bearer:<token>; csrf: fetch-form | json-api:<context> | none; extract: {from: body | header:<Name> | dom | location-query, path | selector, attr, param}.
# seedRefs index is 0-based and negative from the end; a reserved ref resolves to a scalar, read as ${seed.<as>}.
# Placeholders: ${secret:admin|qa_editor|appreload|seed:<user>|oauth:<clientId>|generated:<name>}, ${user:<site>:<role>}, ${seed.<as>.<field>}, ${<step>.<binding>}, ${matrix.<var>}, ${asOf}, ${nodash:<value>} (<value> without '-'), ${urlencode:<value>} (legacy esapiEncode('url')); keys resolve like values.
sourceSha: 696383140578f8dea3ece26f80cd7bfb370ddf0f
version: 1
defaults:
  tableVersion: v0002
  compare: [status, headers, auth]
scenarios:
  - id: GS-ID-01
    title: Admin login and logout
    service: identity
    role: admin (S2)
    sessions:
      browser: {login: none, via: admin}
    seedRefs: []
    steps:
      - name: login-form
        method: GET
        route: /admin/?muraAction=clogin.main
        as: browser
        auth: session
      - name: login
        method: POST
        route: /admin/index.cfm
        as: browser
        auth: session
        csrf: fetch-form
        csrfFrom: login-form
        form:
          username: admin
          'password': ${secret:admin}
          muraAction: cLogin.login
          isAdminLogin: 'true'
          returnUrl: ''
          compactDisplay: 'false'
      - name: home
        method: GET
        route: /admin/
        as: browser
      - name: logout
        method: GET
        route: /admin/?muraAction=cLogin.logout
        as: browser
      - name: protected-after-logout
        method: GET
        route: /admin/?muraAction=cArch.list&siteid=default&moduleid=00000000000000000000000000000000000&topid=00000000000000000000000000000000001
        as: browser
    compare: [status, headers, auth, dom]
    normalisationOverrides: {}
    covers:
      - admin:clogin.main
      - admin:clogin.login
      - admin:home.redirect
      - admin:clogin.logout
      - admin:carch.list
  - id: GS-ID-02
    title: Editor login with role-limited access
    service: identity
    role: qa_editor
    sessions:
      editor: {login: qa_editor, via: admin}
    seedRefs: []
    steps:
      - name: nav
