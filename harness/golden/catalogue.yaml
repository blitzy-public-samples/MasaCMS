# Golden scenarios: requests only; responses are whatever legacy answers at capture. Capture and replay follow this order, except the GS-PE-RH rehearsal scenarios, which run last.
# Scenario: id, title, service, role, sessions{name: {login, via}}, seedRefs[{as, source, path, where, index}], steps[], compare[], rows[{table, where}], normalisationOverrides, covers[]; optional purpose, tableVersion, fixtures, expected, decisionListRef, exceptionId, acrossTransition, replayFaults, browser, tasks.
# Step: name, method, route, as, auth, csrf, csrfFrom, mergeHidden, headers, form | body | multipart{fields, files[{field, fixture | fromStep, filename, contentType}]}, extract, poll, settle, matrix, knownIssue, expected, decisionListRef, exceptionId, compare, candidates.
# A multipart file's fromStep uploads the body of that earlier step's last response in the same scenario.
# auth: session | anonymous | basic:<user>:<secret> | bearer:<token>; csrf: fetch-form | json-api:<context> | none; extract: {from: body | header:<Name> | dom | location-query, path | selector, attr, param | pattern} (dom path: JSON body string holding the markup; dom pattern: regular expression whose first capture group, matched against the attr value or text, is the value).
# seedRefs index is 0-based and negative from the end; a reserved ref resolves to a scalar, read as ${seed.<as>}.
# Placeholders: ${secret:admin|qa_editor|appreload|seed:<user>|oauth:<clientId>|generated:<name>}, ${user:<site>:<role>}, ${seed.<as>.<field>}, ${<step>.<binding>}, ${matrix.<var>}, ${asOf}, ${nodash:<value>} (<value> without '-'), ${urlencode:<value>} (legacy esapiEncode('url')); keys resolve like values.
sourceSha: 696383140578f8dea3ece26f80cd7bfb370ddf0f
version: 1
defaults:
  tableVersion: v0002
  compare: [status, headers, auth]
scenarios:
  - id: GS-ID-01
    title: Admin login and logout
    service: identity
    role: admin (S2)
    sessions:
      browser: {login: none, via: admin}
    seedRefs: []
    steps:
      - name: login-form
        method: GET
        route: /admin/?muraAction=clogin.main
        as: browser
        auth: session
      - name: login
        method: POST
        route: /admin/index.cfm
        as: browser
        auth: session
        csrf: fetch-form
        csrfFrom: login-form
        form:
          username: admin
          'password': ${secret:admin}
          muraAction: cLogin.login
          isAdminLogin: 'true'
          returnUrl: ''
          compactDisplay: 'false'
      - name: home
        method: GET
        route: /admin/
        as: browser
      - name: logout
        method: GET
        route: /admin/?muraAction=cLogin.logout
        as: browser
      - name: protected-after-logout
        method: GET
        route: /admin/?muraAction=cArch.list&siteid=default&moduleid=00000000000000000000000000000000000&topid=00000000000000000000000000000000001
        as: browser
    compare: [status, headers, auth, dom]
    normalisationOverrides: {}
    covers:
      - admin:clogin.main
      - admin:clogin.login
      - admin:home.redirect
      - admin:clogin.logout
      - admin:carch.list
  - id: GS-ID-02
    title: Editor login with role-limited access
    service: identity
    role: qa_editor
    sessions:
      editor: {login: qa_editor, via: admin}
    seedRefs: []
    steps:
      - name: nav
        method: GET
        route: /admin/?muraAction=cArch.list&siteid=default&moduleid=00000000000000000000000000000000000&topid=00000000000000000000000000000000001
        as: editor
      - name: users-denied
        method: GET
        route: /admin/?muraAction=cUsers.list&siteid=default
        as: editor
      - name: noaccess
        method: GET
        route: /admin/?muraAction=cMessage.noaccess&siteid=default
        as: editor
    compare: [status, auth, dom]
    normalisationOverrides: {}
    covers:
      - admin:carch.list
      - admin:cusers.list
      - admin:cmessage.noaccess
  - id: GS-ID-03
    title: Permission denials
    service: identity
    role: anonymous, qa_editor, tenant-a site admin
    sessions:
      anon: {login: none, via: public}
      editor: {login: qa_editor, via: admin}
      siteAdminA: {login: 'seed:tenant-a:site-admin', via: jsonapi}
    seedRefs:
      - {as: pageB, source: dataset, path: masa.content, where: {siteID: tenant-b, type: Page}, index: 0}
    steps:
      - name: anonymous-save
        method: POST
        route: /_api/json/v1/tenant-a/content/
        as: anon
        auth: anonymous
        form:
          title: GS-ID-03 anonymous save
          parentid: '00000000000000000000000000000000001'
          type: Page
          siteid: tenant-a
        expected: withheld
        decisionListRef: api:content.save
      - name: editor-edit-site
        method: GET
        route: /admin/?muraAction=cSettings.editSite&siteid=default
        as: editor
      - name: rest-bad-token
        method: GET
        route: /_api/rest/v1/tenant-a/content/
        as: anon
        auth: anonymous
        headers:
          Authorization: Bearer opt2-invalid-token
      - name: other-tenant-read
        method: GET
        route: /_api/json/v1/tenant-b/content/${seed.pageB.contentID}
        as: siteAdminA
    compare: [status, envelope, headers, auth, dom]
    normalisationOverrides: {}
    covers:
      - api:content.save
      - admin:csettings.editsite
      - rest:content.findall
      - api:content.findone
  - id: GS-ID-04
    title: Forgot-password mail captured in Mailpit
    service: identity
    role: anonymous
    sessions:
      anon: {login: none, via: admin}
    seedRefs:
      - {as: member, source: dataset, path: masa.users, where: {username: '${user:umbrella:member}'}}
    steps:
      - name: login-page
        method: GET
        route: /admin/?muraAction=cLogin.main
        as: anon
      - name: send-login
        method: POST
        route: /admin/?muraAction=cLogin.main
        as: anon
        csrf: none
        form:
          status: sendlogin
          email: ${seed.member.email}
          isAdminLogin: 'true'
          returnURL: ''
          compactDisplay: 'false'
        expected: withheld
        decisionListRef: admin:clogin.main{status=sendlogin}
      - name: send-login-via-login
        method: POST
        route: /admin/index.cfm
        as: anon
        csrf: fetch-form
        csrfFrom: login-page
        form:
          muraAction: cLogin.login
          status: sendlogin
          email: ${seed.member.email}
          isAdminLogin: 'true'
          returnUrl: ''
          compactDisplay: 'false'
        expected: withheld
        decisionListRef: admin:clogin.login{status=sendlogin}
    compare: [status, dom, mail]
    normalisationOverrides: {}
    covers:
      - admin:clogin.main
      - admin:clogin.main{status=sendlogin}
      - admin:clogin.login{status=sendlogin}
  - id: GS-ID-05
    title: User CRUD
    service: people
    role: admin, site-admin
    sessions:
      admin: {login: admin, via: admin}
      siteAdmin: {login: 'seed:tenant-a:site-admin', via: admin}
    seedRefs: []
    steps:
