  - id: GS-PE-05
    title: User exports
    service: people
    role: admin
    sessions:
      admin: {login: admin, via: admin}
    seedRefs:
      - {as: group, source: dataset, path: masa.groups, where: {siteID: tenant-a}, index: -1}
    steps:
      - name: advanced-search
        method: GET
        route: /admin/?muraAction=cUsers.advancedSearch&siteid=tenant-a&ispublic=0
        as: admin
      - name: advanced-csv
        method: GET
        route: /admin/?muraAction=cUsers.advancedSearchToCSV&siteid=tenant-a&ispublic=0
        as: admin
      - name: download
        method: GET
        route: /admin/?muraAction=cUsers.download&siteid=tenant-a&ispublic=0&unassigned=0
        as: admin
      - name: group-members
        method: GET
        route: /admin/?muraAction=cUsers.downloadGroupMembers&siteid=tenant-a&userid=${seed.group.groupID}
        as: admin
    compare: [status, headers, export]
    # Legacy orders these exports by name alone (userGateway.cfc:567-580 with userFeedBean.cfc:86-87, 712-713; userDAO.cfc:657).
    normalisationOverrides:
