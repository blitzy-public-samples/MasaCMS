  - id: GS-CO-15
    title: REST authentication and the error envelope
    service: strategies-content
    role: system user; OAuth client; anonymous
    sessions:
      rest: {login: 'seed:tenant-a:system-user', via: rest-basic}
      client: {login: none, via: client-credentials}
      anon: {login: none, via: public}
      author: {login: 'seed:tenant-a:site-admin', via: jsonapi}
    seedRefs:
      - {as: oauthClient, source: dataset, path: masa.oauthClients, where: {siteID: tenant-a}, index: 0}
      - {as: page, source: dataset, path: masa.content, where: {siteID: tenant-a, type: Page}, index: 0}
    steps:
      - name: basic
        method: GET
        route: /_api/rest/v1/tenant-a/content/${seed.page.contentID}
        as: rest
        auth: basic:${user:tenant-a:system-user}:${secret:seed:${user:tenant-a:system-user}}
      - name: token
        method: POST
        route: /_api/rest/v1/tenant-a/oauth2
        as: client
        auth: anonymous
        form:
          grant_type: client_credentials
          client_id: ${seed.oauthClient.clientID}
          client_secret: ${secret:oauth:${seed.oauthClient.clientID}}
        extract:
          accessToken: {from: body, path: access_token}
      - name: bearer
        method: GET
        route: /_api/rest/v1/tenant-a/content/${seed.page.contentID}
        as: client
        auth: bearer:${token.accessToken}
      - name: invalid-parameters
        method: GET
        route: /_api/json/v1/tenant-a/content/?siteid=gs-no-such-site
        as: anon
        auth: anonymous
      - name: invalid-method-call
        method: POST
        route: /_api/json/v1/tenant-a/content/
        as: anon
        auth: anonymous
        form:
          method: user.save
      # No badRequest step: legacy never raises it on the JSON API (isValidRequest() is always true); GS-PE-03 answers it.
      - name: unauthorized
        method: GET
        route: /_api/rest/v1/tenant-a/user/
        as: anon
        auth: anonymous
      - name: forbidden-validation-errors
        method: POST
        route: /_api/json/v1/tenant-a/content/
        as: author
        csrf: json-api:new
        form:
          title: ''
          type: Page
          parentid: '00000000000000000000000000000000001'
          siteid: tenant-a
      - name: not-found-path
        method: GET
        route: /_api/json/v1/tenant-a/content/?_path=gs-co-15/does-not-exist
        as: anon
        auth: anonymous
      - name: server-error
        method: GET
        route: /_api/json/v1/tenant-a/content/?pageIndex=gs
        as: anon
        auth: anonymous
        expected: gap
        candidates:
          - {method: GET, route: '/_api/json/v1/tenant-a/content/?pageIndex=gs'}
          - {method: GET, route: '/_api/json/v1/tenant-a/content/?itemsPerPage=gs'}
          - {method: GET, route: '/_api/json/v1/tenant-a/content/?sort=%27'}
    compare: [status, envelope, headers, auth]
    normalisationOverrides:
      applyRules: [error-stacktrace]
    covers:
      - rest:content.findone
      - rest:oauth2
      - rest:user.findall
      - api:content.save
      - api:content.findquery
      - api:!invalidparameters
      - api:!invalidmethodcall
