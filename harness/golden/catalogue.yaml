        csrf: fetch-form
        csrfFrom: create-form
        form:
          type: '2'
          action: Add
          siteid: tenant-a
          isPublic: '0'
          fname: GS
          lname: ID-05
          email: gs-id-05-1@seed.opt2.test
          usernameNoCache: gs-id-05-1
          InActive: '0'
          subscribe: '0'
          passwordNoCache: ${secret:generated:gs-id-05}
          password2: ${secret:generated:gs-id-05}
          address1: 1 Golden Way
          city: Sample City
          state: CA
          zip: '94000'
          country: USA
          isPrimary: '1'
      - name: edit-created
        method: GET
        route: /admin/?muraAction=cUsers.editUser&siteid=tenant-a&userid=${create-form.userid}
        as: admin
      - name: update
        method: POST
        route: /admin/?muraAction=cUsers.update&userid=${create-form.userid}&routeid=
        as: admin
        csrf: fetch-form
        csrfFrom: edit-created
        form:
          type: '2'
          action: Update
          siteid: tenant-a
          isPublic: '0'
          fname: GS
          lname: ID-05 edited
          email: gs-id-05-1@seed.opt2.test
          usernameNoCache: gs-id-05-1
          InActive: '0'
          subscribe: '0'
          jobtitle: Golden analyst
      - name: edit-photo
        method: GET
        route: /admin/?muraAction=cUsers.editUser&siteid=tenant-a&userid=${create-form.userid}
        as: admin
      - name: photo-upload
        method: POST
        route: /admin/?muraAction=cUsers.update&userid=${create-form.userid}&routeid=
        as: admin
        csrf: fetch-form
        csrfFrom: edit-photo
        multipart:
          fields:
            type: '2'
            action: Update
            siteid: tenant-a
            isPublic: '0'
            fname: GS
            lname: ID-05 edited
            email: gs-id-05-1@seed.opt2.test
            usernameNoCache: gs-id-05-1
            InActive: '0'
            subscribe: '0'
          files:
            - {field: newfile, fixture: image-png-8x8, filename: gs-photo.png, contentType: image/png}
        expected: withheld
        decisionListRef: admin:cusers.update{photo}
      - name: edit-photo-remove
        method: GET
        route: /admin/?muraAction=cUsers.editUser&siteid=tenant-a&userid=${create-form.userid}
        as: admin
      - name: photo-remove
        method: POST
        route: /admin/?muraAction=cUsers.update&userid=${create-form.userid}&routeid=
        as: admin
        csrf: fetch-form
        csrfFrom: edit-photo-remove
        form:
          type: '2'
          action: Update
          siteid: tenant-a
          isPublic: '0'
          fname: GS
          lname: ID-05 edited
          email: gs-id-05-1@seed.opt2.test
          usernameNoCache: gs-id-05-1
          InActive: '0'
          subscribe: '0'
          removePhotoFile: 'true'
        expected: withheld
        decisionListRef: admin:cusers.update{photo}
      - name: edit-delete
        method: GET
        route: /admin/?muraAction=cUsers.editUser&siteid=tenant-a&userid=${create-form.userid}
        as: admin
      - name: delete
        method: POST
        route: /admin/?muraAction=cUsers.update&userid=${create-form.userid}&routeid=
        as: admin
        csrf: fetch-form
        csrfFrom: edit-delete
        form:
          type: '2'
          action: Delete
          siteid: tenant-a
        expected: withheld
        decisionListRef: admin:cusers.update{type=2,action=delete}
      - name: sa-create-form
        method: GET
        route: /admin/?muraAction=cUsers.editUser&siteid=tenant-a&userid=&ispublic=0
        as: siteAdmin
        extract:
          userid: {from: dom, selector: 'form[name=form1]', attr: action, param: userid}
      - name: sa-create
        method: POST
        route: /admin/?muraAction=cUsers.update&userid=${sa-create-form.userid}&routeid=
        as: siteAdmin
        csrf: fetch-form
        csrfFrom: sa-create-form
        form:
          type: '2'
          action: Add
          siteid: tenant-a
          isPublic: '0'
          fname: GS
          lname: ID-05 site admin
          email: gs-id-05-2@seed.opt2.test
          usernameNoCache: gs-id-05-2
          InActive: '0'
          subscribe: '0'
          passwordNoCache: ${secret:generated:gs-id-05}
          password2: ${secret:generated:gs-id-05}
      - name: sa-edit
        method: GET
        route: /admin/?muraAction=cUsers.editUser&siteid=tenant-a&userid=${sa-create-form.userid}
        as: siteAdmin
      - name: sa-update
        method: POST
        route: /admin/?muraAction=cUsers.update&userid=${sa-create-form.userid}&routeid=
        as: siteAdmin
        csrf: fetch-form
        csrfFrom: sa-edit
        form:
          type: '2'
          action: Update
          siteid: tenant-a
          isPublic: '0'
          fname: GS
          lname: ID-05 site admin edited
          email: gs-id-05-2@seed.opt2.test
          usernameNoCache: gs-id-05-2
          InActive: '0'
          subscribe: '0'
    compare: [status, auth, dom, rows]
    rows:
      - {table: tusers, where: {userid: '${create-form.userid}'}}
      - {table: tuseraddresses, where: {userid: '${create-form.userid}'}}
      - {table: tusersmemb, where: {userid: '${create-form.userid}'}}
      - {table: tusers, where: {userid: '${sa-create-form.userid}'}}
      - {table: tuseraddresses, where: {userid: '${sa-create-form.userid}'}}
      - {table: tusersmemb, where: {userid: '${sa-create-form.userid}'}}
    normalisationOverrides: {}
    covers:
      - admin:cusers.listusers
      - admin:cusers.search
      - admin:cusers.advancedsearch
      - admin:cusers.edituser
      - admin:cusers.update{type=2,action=add}
      - admin:cusers.update{type=2,action=update}
      - admin:cusers.update{photo}
      - admin:cusers.update{type=2,action=delete}
  - id: GS-ID-06
    title: Group CRUD and membership
    service: identity
    role: admin
    sessions:
      admin: {login: admin, via: admin}
    seedRefs:
      - {as: person, source: dataset, path: masa.users, where: {siteID: tenant-a, isPublic: 0}, index: -2}
    steps:
      - name: new-group
        method: GET
        route: /admin/?muraAction=cUsers.editGroup&siteid=tenant-a&userid=&ispublic=0
        as: admin
        extract:
          groupid: {from: dom, selector: 'form[name=form1]', attr: action, param: userid}
      - name: create-group
        method: POST
        route: /admin/?muraAction=cUsers.update&userid=${new-group.groupid}
        as: admin
        csrf: fetch-form
        csrfFrom: new-group
        form:
          type: '1'
          action: Add
          siteid: tenant-a
          isPublic: '0'
          groupname: GS-ID-06 Group
          email: ''
      - name: edit-group
        method: GET
        route: /admin/?muraAction=cUsers.editGroup&siteid=tenant-a&userid=${new-group.groupid}
        as: admin
      - name: update-group
        method: POST
        route: /admin/?muraAction=cUsers.update&userid=${new-group.groupid}
        as: admin
        csrf: fetch-form
        csrfFrom: edit-group
        form:
          type: '1'
          action: Update
          siteid: tenant-a
          isPublic: '0'
          groupname: GS-ID-06 Group edited
          email: ''
      - name: members
        method: GET
        route: /admin/?muraAction=cUsers.editGroupMembers&siteid=tenant-a&groupid=${new-group.groupid}
        as: admin
      - name: add-tokens
        method: GET
        route: /_api/json/v1/tenant-a/generateCSRFTokens?context=${seed.person.userID}${new-group.groupid}addtogroup
        as: admin
        extract:
          csrfToken: {from: body, path: data.csrf_token}
          csrfExpires: {from: body, path: data.csrf_token_expires}
      - name: add-to-group
        method: POST
        route: /admin/?muraAction=cUsers.addToGroup
        as: admin
        form:
          userid: ${seed.person.userID}
          groupid: ${new-group.groupid}
          siteid: tenant-a
          routeid: ${new-group.groupid}
          returnurl: ''
          csrf_token: ${add-tokens.csrfToken}
          csrf_token_expires: ${add-tokens.csrfExpires}
      - name: members-after-add
        method: GET
        route: /admin/?muraAction=cUsers.editGroupMembers&siteid=tenant-a&groupid=${new-group.groupid}
        as: admin
      - name: remove-from-group
        method: GET
        route: /admin/?muraAction=cUsers.removeFromGroup&userid=${seed.person.userID}&groupid=${new-group.groupid}&siteid=tenant-a
        as: admin
      - name: edit-group-delete
        method: GET
        route: /admin/?muraAction=cUsers.editGroup&siteid=tenant-a&userid=${new-group.groupid}
        as: admin
      - name: delete-group
        method: POST
        route: /admin/?muraAction=cUsers.update&userid=${new-group.groupid}
        as: admin
        csrf: fetch-form
        csrfFrom: edit-group-delete
        form:
          type: '1'
          action: Delete
          siteid: tenant-a
        expected: withheld
        decisionListRef: admin:cusers.update{type=1,action=delete}
    compare: [status, auth, dom, rows]
    rows:
      - {table: tusers, where: {userid: '${new-group.groupid}'}}
      - {table: tusersmemb, where: {groupid: '${new-group.groupid}'}}
    normalisationOverrides: {}
    covers:
      - admin:cusers.editgroup
      - admin:cusers.update{type=1}
      - admin:cusers.editgroupmembers
      - api:generatecsrftokens
      - admin:cusers.addtogroup
      - admin:cusers.removefromgroup
      - admin:cusers.update{type=1,action=delete}
  - id: GS-ID-07
    title: Content and module permissions
    service: identity
    role: admin
    sessions:
      admin: {login: admin, via: admin}
    seedRefs:
      - {as: page, source: dataset, path: masa.content, where: {siteID: tenant-a, type: Page}, index: 0}
      - {as: group, source: dataset, path: masa.groups, where: {siteID: tenant-a}, index: -1}
    steps:
      - name: node
        method: GET
        route: /admin/?muraAction=cPerm.main&siteid=tenant-a&contentid=${seed.page.contentID}&parentid=00000000000000000000000000000000001&topid=00000000000000000000000000000000001&moduleid=00000000000000000000000000000000000
        as: admin
      - name: grant-node
        method: POST
        route: /admin/?muraAction=cPerm.update&siteid=tenant-a&contentid=${seed.page.contentID}&parentid=00000000000000000000000000000000001&topid=00000000000000000000000000000000001&moduleid=00000000000000000000000000000000000
        as: admin
        csrf: fetch-form
        csrfFrom: node
        form:
          p${nodash:${seed.group.groupID}}: author
          chainID: ''
          siteid: tenant-a
          topid: '00000000000000000000000000000000001'
          moduleid: '00000000000000000000000000000000000'
        expected: withheld
        decisionListRef: admin:cperm.update
      - name: node-after
        method: GET
        route: /admin/?muraAction=cPerm.main&siteid=tenant-a&contentid=${seed.page.contentID}&parentid=00000000000000000000000000000000001&topid=00000000000000000000000000000000001&moduleid=00000000000000000000000000000000000
        as: admin
      - name: restore-node
        method: POST
        route: /admin/?muraAction=cPerm.update&siteid=tenant-a&contentid=${seed.page.contentID}&parentid=00000000000000000000000000000000001&topid=00000000000000000000000000000000001&moduleid=00000000000000000000000000000000000
        as: admin
        csrf: fetch-form
        csrfFrom: node-after
        form:
          p${nodash:${seed.group.groupID}}: none
          chainID: ''
          siteid: tenant-a
          topid: '00000000000000000000000000000000001'
          moduleid: '00000000000000000000000000000000000'
        expected: withheld
        decisionListRef: admin:cperm.update
      - name: module
        method: GET
        route: /admin/?muraAction=cPerm.module&siteid=tenant-a&contentid=00000000000000000000000000000000008&moduleid=00000000000000000000000000000000008
        as: admin
      - name: grant-module
        method: POST
        route: /admin/?muraAction=cPerm.updatemodule&contentid=00000000000000000000000000000000008
        as: admin
        csrf: fetch-form
        csrfFrom: module
        form:
          groupid: ${seed.group.groupID}
          siteid: tenant-a
          moduleid: '00000000000000000000000000000000008'
          topid: ''
      - name: module-after
        method: GET
        route: /admin/?muraAction=cPerm.module&siteid=tenant-a&contentid=00000000000000000000000000000000008&moduleid=00000000000000000000000000000000008
        as: admin
      - name: restore-module
        method: POST
        route: /admin/?muraAction=cPerm.updatemodule&contentid=00000000000000000000000000000000008
        as: admin
        csrf: fetch-form
        csrfFrom: module-after
        form:
          groupid: ''
          siteid: tenant-a
          moduleid: '00000000000000000000000000000000008'
          topid: ''
    compare: [status, auth, dom, rows]
    rows:
      - {table: tpermissions, where: {contentid: '${seed.page.contentID}', siteid: tenant-a}}
      - {table: tpermissions, where: {contentid: '00000000000000000000000000000000008', siteid: tenant-a}}
    normalisationOverrides: {}
    covers:
      - admin:cperm.main
      - admin:cperm.update
      - admin:cperm.module
      - admin:cperm.updatemodule
  - id: GS-ID-08
    title: OAuth clients and REST tokens
    service: identity
    role: admin; OAuth client
    sessions:
      admin: {login: admin, via: admin}
      client: {login: none, via: client-credentials}
      rest: {login: admin, via: rest-basic}
    seedRefs:
      - {as: oauthClient, source: dataset, path: masa.oauthClients, where: {siteID: tenant-a}, index: 0}
    steps:
      - name: list
        method: GET
        route: /admin/?muraAction=cwebservice.list&siteid=tenant-a
        as: admin
      - name: new
        method: GET
        route: /admin/?muraAction=cwebservice.edit&clientid=&siteid=tenant-a
        as: admin
        extract:
          clientid: {from: dom, selector: 'form[name=form1] input[name=clientid]', attr: value}
      - name: save
        method: POST
        route: /admin/?muraAction=cwebservice.save
        as: admin
        csrf: fetch-form
        csrfFrom: new
        form:
          name: GS-ID-08 client
          description: Golden scenario client
          granttype: client_credentials
          userid: ${seed.oauthClient.userID}
          redirectURL: ''
          siteid: tenant-a
          clientid: ${new.clientid}
      - name: edit-existing
        method: GET
        route: /admin/?muraAction=cwebservice.edit&clientid=${new.clientid}&siteid=tenant-a
        as: admin
        extract:
          csrfToken: {from: dom, selector: 'form[name=form1] input[name=csrf_token]', attr: value}
          csrfExpires: {from: dom, selector: 'form[name=form1] input[name=csrf_token_expires]', attr: value}
      - name: delete
        method: GET
        route: /admin/?muraAction=cwebservice.delete&clientid=${new.clientid}&siteid=tenant-a&csrf_token=${edit-existing.csrfToken}&csrf_token_expires=${edit-existing.csrfExpires}
        as: admin
      - name: rest-login
        method: POST
        route: /_api/rest/v1/tenant-a/login
        as: rest
        auth: basic:admin:${secret:admin}
        form:
          username: admin
          'password': ${secret:admin}
      # Legacy answers a valid client_credentials grant 500 server_error: the sessionless REST login builds a
      # renderer that reads the session scope. No token is issued, so the Bearer steps send an unissued one.
      - name: token
        method: POST
        route: /_api/rest/v1/tenant-a/oauth2
        as: client
        auth: anonymous
        form:
          grant_type: client_credentials
          client_id: ${seed.oauthClient.clientID}
          client_secret: ${secret:oauth:${seed.oauthClient.clientID}}
      - name: token-v1
        method: POST
        route: /_api/rest/v1/tenant-a/oauth
        as: client
        auth: anonymous
        form:
          grant_type: client_credentials
          client_id: ${seed.oauthClient.clientID}
          client_secret: ${secret:oauth:${seed.oauthClient.clientID}}
      - name: rest-read
        method: GET
        route: /_api/rest/v1/tenant-a/content/
        as: client
        auth: anonymous
        headers:
          Authorization: Bearer opt2-invalid-token
      - name: tokeninfo
        method: GET
        route: /_api/rest/v1/tenant-a/tokeninfo?access_token=opt2-invalid-token&client_id=${seed.oauthClient.clientID}
        as: client
        auth: anonymous
