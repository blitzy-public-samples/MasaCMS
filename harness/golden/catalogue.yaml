  - id: GS-PS-09
    title: Site bundle download and scaffolder site assignment
    service: programs-sites
    role: admin (S2)
    purpose: coverage
    sessions:
      admin: {login: admin, via: admin}
    seedRefs: []
    steps:
      - name: bundle-options
        method: GET
        route: /admin/?muraAction=cSettings.selectBundleOptions&siteID=tenant-b
        as: admin
      # bundleFiles=false skips BundleFiles (settingsBundle.cfc:1855), whose theme step writes back into the web root
      # (settingsBundle.cfc:300-312), a file state capture and replay do not reset between them.
      - name: create-bundle
        method: POST
        route: /admin/?muraAction=cSettings.createBundle&bundleFiles=false
        as: admin
        csrf: fetch-form
        csrfFrom: bundle-options
        form:
          BundleName: gs-ps-09
      - name: scaffold-assembler
        method: GET
        route: /admin/?muraAction=scaffold.assembler&siteid=tenant-b
        as: admin
      - name: scaffold-sites
        method: GET
        route: /admin/?muraAction=scaffold.sites&siteid=tenant-b&entityname=gsps09entity
        as: admin
      - name: scaffold-update-sites
        method: POST
        route: /admin/?muraAction=scaffold.updateSites
        as: admin
        csrf: fetch-form
        csrfFrom: scaffold-sites
        form:
          siteAssignID: tenant-b
    compare: [status, auth, dom, export]
    normalisationOverrides: {}
    covers:
      - admin:csettings.selectbundleoptions
      - admin:csettings.createbundle
      - admin:scaffold.assembler
      - admin:scaffold.sites
      - admin:scaffold.updatesites
  - id: GS-CO-22
    title: Component export imported back as a new component
    service: strategies-content
    role: admin
    purpose: coverage
    sessions:
      admin: {login: admin, via: admin}
    seedRefs:
      - {as: page, source: dataset, path: masa.content, where: {siteID: tenant-a, type: Page}, index: 3}
    steps:
      # The seed holds no component; exportcomponent packs the body of any content id (carch.cfc:154-171).
      - name: export-component
        method: GET
        route: /admin/?muraAction=cArch.exportcomponent&contentid=${seed.page.contentID}&siteid=tenant-a
        as: admin
      - name: import-form
        method: GET
        route: /admin/?muraAction=cArch.importcomponent&siteid=tenant-a&moduleid=00000000000000000000000000000000003
        as: admin
      - name: import-component
        method: POST
        route: /admin/?muraAction=cArch.importcomponent&siteid=tenant-a
        as: admin
        multipart:
          fields:
            title: GS-CO-22 Component
          files:
            - {field: componentzip, fromStep: export-component, filename: gs-co-22-component.zip, contentType: application/zip}
    compare: [status, auth, dom, export, rows]
    rows:
      - {table: tcontent, where: {siteid: tenant-a, moduleid: '00000000000000000000000000000000003', title: GS-CO-22 Component}, minRows: 1}
    normalisationOverrides: {}
    covers:
      - admin:carch.exportcomponent
      - admin:carch.importcomponent
