          feedID: ${new-local.feedID}
          siteid: tenant-a
          action: add
          type: Local
          name: GS-CO-13 Local Feed
          isActive: '1'
          isPublic: '1'
          maxItems: '20'
          contentID: ${seed.folder.contentID}
          # The empty advanced-filter row a browser posts beside the hidden param=1 (admin/Application.cfc:479).
          paramRelationship1: and
          paramField1: ''
          paramCondition1: Equals
