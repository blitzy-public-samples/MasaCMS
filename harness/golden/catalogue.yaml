  - id: GS-CO-17
    title: File uploads through the JSON API and REST, image details and rendition tools
    service: strategies-content
    role: admin
    purpose: coverage
    sessions:
      admin: {login: admin, via: admin}
      rest: {login: admin, via: rest-basic}
    seedRefs:
      - {as: page, source: dataset, path: masa.content, where: {siteID: tenant-a, type: Page}, index: 0}
    steps:
      - name: page-version
        method: GET
        route: /_api/json/v1/tenant-a/content/${seed.page.contentID}
        as: admin
        extract:
          contenthistid: {from: body, path: data.contenthistid}
      - name: image-new
        method: GET
        route: /_api/json/v1/tenant-a/file/new
        as: admin
        extract:
          id: {from: body, path: data.id}
      - name: upload-image
        method: POST
        route: /_api/json/v1/tenant-a/
        as: admin
        csrf: json-api:${image-new.id}
        multipart:
          fields:
            method: save
            entityname: file
            siteid: tenant-a
            id: ${image-new.id}
            moduleid: '00000000000000000000000000000000000'
          files:
            - {field: newfile, fixture: image-png-8x8, filename: gs-photo.png, contentType: image/png}
        extract:
          fileid: {from: body, path: data.fileid}
        expected: halted
        exceptionId: EX-FILE-RENDITION
      - name: pdf-new
        method: GET
        route: /_api/json/v1/tenant-a/file/new
        as: admin
        extract:
          id: {from: body, path: data.id}
      - name: upload-pdf
        method: POST
        route: /_api/json/v1/tenant-a/
        as: admin
        csrf: json-api:${pdf-new.id}
        multipart:
          fields:
            method: save
            entityname: file
            siteid: tenant-a
            id: ${pdf-new.id}
            moduleid: '00000000000000000000000000000000000'
          files:
            - {field: newfile, fixture: pdf-one-page, filename: gs-document.pdf, contentType: application/pdf}
        extract:
          fileid: {from: body, path: data.fileid}
      - name: metadata-new
        method: GET
        route: /_api/json/v1/tenant-a/fileMetaData/new
        as: admin
        extract:
          id: {from: body, path: data.id}
      - name: metadata-save
        method: POST
        route: /_api/json/v1/tenant-a/
        as: admin
        csrf: json-api:${metadata-new.id}
        form:
          method: save
          entityname: fileMetaData
          siteid: tenant-a
          id: ${metadata-new.id}
          metaid: ${metadata-new.id}
          fileid: ${upload-pdf.fileid}
          contentid: ${seed.page.contentID}
          contenthistid: ${page-version.contenthistid}
          alttext: GS-CO-17 PDF
          caption: GS-CO-17 caption
          credits: ''
      # Legacy answers REST Basic 500 at its credential lookup, so REST steps extract nothing and address JSON API ids.
      - name: rest-metadata
        method: POST
        route: /_api/rest/v1/tenant-a/fileMetaData/
        as: rest
        auth: basic:admin:${secret:admin}
        form:
          siteid: tenant-a
          fileid: ${upload-pdf.fileid}
          contentid: ${seed.page.contentID}
          contenthistid: ${page-version.contenthistid}
          alttext: GS-CO-17 REST PDF
          caption: GS-CO-17 REST caption
          credits: ''
        expected: halted
        exceptionId: EX-REST-SITEID-STARTUP
      # The same call without `siteid` reaches legacy's credential lookup, which the target serves. It answers the
      # server_error envelope, or the error page when it runs application start, so it compares status and auth.
      - name: rest-metadata-path-site
        method: POST
        route: /_api/rest/v1/tenant-a/fileMetaData/
        as: rest
        auth: basic:admin:${secret:admin}
        form:
          fileid: ${upload-pdf.fileid}
          contentid: ${seed.page.contentID}
          contenthistid: ${page-version.contenthistid}
          alttext: GS-CO-17 REST PDF
          caption: GS-CO-17 REST caption
          credits: ''
        compare: [status, auth]
      - name: rest-metadata-delete
        method: DELETE
        route: /_api/rest/v1/tenant-a/fileMetaData/${metadata-new.id}
        as: rest
        auth: basic:admin:${secret:admin}
      - name: metadata-delete
        method: POST
        route: /_api/json/v1/tenant-a/
        as: admin
        csrf: json-api:${metadata-new.id}
        form:
          method: delete
          entityname: fileMetaData
          siteid: tenant-a
          id: ${metadata-new.id}
      - name: rest-upload-image
        method: POST
        route: /_api/rest/v1/tenant-a/file/
        as: rest
        auth: basic:admin:${secret:admin}
        multipart:
          fields:
            siteid: tenant-a
            moduleid: '00000000000000000000000000000000000'
          files:
            - {field: newfile, fixture: image-png-8x8, filename: gs-rest-photo.png, contentType: image/png}
        expected: halted
        exceptionId: EX-FILE-RENDITION
      - name: rest-upload-pdf
        method: POST
        route: /_api/rest/v1/tenant-a/file/
        as: rest
        auth: basic:admin:${secret:admin}
        multipart:
          fields:
            siteid: tenant-a
            moduleid: '00000000000000000000000000000000000'
          files:
            - {field: newfile, fixture: pdf-one-page, filename: gs-rest-document.pdf, contentType: application/pdf}
        expected: halted
        exceptionId: EX-REST-SITEID-STARTUP
      - name: rest-upload-pdf-path-site
        method: POST
        route: /_api/rest/v1/tenant-a/file/
        as: rest
        auth: basic:admin:${secret:admin}
        multipart:
          fields:
            moduleid: '00000000000000000000000000000000000'
          files:
            - {field: newfile, fixture: pdf-one-page, filename: gs-rest-document.pdf, contentType: application/pdf}
        compare: [status, auth]
      - name: imagedetails
        method: GET
        route: /admin/?muraAction=cArch.imagedetails&siteid=tenant-a&fileid=${upload-image.fileid}&compactDisplay=true
        as: admin
      - name: image-size-url
        method: GET
        route: /admin/?muraAction=carch.getImageSizeURL&siteid=tenant-a&fileid=${upload-image.fileid}&size=small
        as: admin
      - name: file-metadata
        method: GET
        route: /admin/?muraAction=cArch.loadfilemetadata&fileid=${upload-image.fileid}&property=fileid&contenthistid=${page-version.contenthistid}&siteid=tenant-a
        as: admin
      - name: crop-tokens
        method: GET
        route: /_api/json/v1/tenant-a/generateCSRFTokens?context=${upload-image.fileid}
        as: admin
        extract:
          csrfToken: {from: body, path: data.csrf_token}
          csrfExpires: {from: body, path: data.csrf_token_expires}
      - name: crop
        method: GET
        route: /admin/?muraAction=carch.cropimage&fileid=${upload-image.fileid}&size=small&x=0&y=0&width=4&height=4&siteid=tenant-a&csrf_token=${crop-tokens.csrfToken}&csrf_token_expires=${crop-tokens.csrfExpires}
        as: admin
        expected: halted
        exceptionId: EX-FILE-RENDITION
      - name: flip-tokens
        method: GET
        route: /_api/json/v1/tenant-a/generateCSRFTokens?context=${upload-image.fileid}
        as: admin
        extract:
          csrfToken: {from: body, path: data.csrf_token}
          csrfExpires: {from: body, path: data.csrf_token_expires}
      - name: flip
        method: GET
        route: /admin/?muraAction=carch.flipimage&fileid=${upload-image.fileid}&siteid=tenant-a&transpose=horizontal&csrf_token=${flip-tokens.csrfToken}&csrf_token_expires=${flip-tokens.csrfExpires}
        as: admin
        expected: halted
        exceptionId: EX-FILE-RENDITION
      - name: rotate-tokens
        method: GET
        route: /_api/json/v1/tenant-a/generateCSRFTokens?context=${upload-image.fileid}
        as: admin
        extract:
          csrfToken: {from: body, path: data.csrf_token}
          csrfExpires: {from: body, path: data.csrf_token_expires}
      - name: rotate
        method: GET
        route: /admin/?muraAction=carch.rotateimage&fileid=${upload-image.fileid}&siteid=tenant-a&degrees=90&csrf_token=${rotate-tokens.csrfToken}&csrf_token_expires=${rotate-tokens.csrfExpires}
        as: admin
        expected: halted
        exceptionId: EX-FILE-RENDITION
      - name: render-small
        method: GET
        route: /_api/render/small/?fileid=${upload-image.fileid}
        as: admin
      - name: rest-delete-pdf
        method: DELETE
        route: /_api/rest/v1/tenant-a/file/${upload-pdf.fileid}
        as: rest
        auth: basic:admin:${secret:admin}
      - name: delete-pdf
        method: POST
        route: /_api/json/v1/tenant-a/
        as: admin
        csrf: json-api:${upload-pdf.fileid}
        form:
          method: delete
          entityname: file
          siteid: tenant-a
          id: ${upload-pdf.fileid}
      - name: delete-image
        method: POST
        route: /_api/json/v1/tenant-a/
        as: admin
        csrf: json-api:${upload-image.fileid}
        form:
          method: delete
          entityname: file
          siteid: tenant-a
          id: ${upload-image.fileid}
    compare: [status, headers, envelope, dom, files]
    normalisationOverrides:
      applyRules: [error-stacktrace]
    covers:
      - api:content.findone
      - api:file.findnew
      - api:file.save{upload=image}
      - api:file.save
      - api:filemetadata.findnew
      - api:filemetadata.save
      - api:filemetadata.delete
      - rest:file.save{upload=image}
      - rest:file.save
      - rest:filemetadata.save
      - rest:filemetadata.delete
      - rest:file.delete
      - admin:carch.imagedetails
      - admin:carch.getimagesizeurl
      - admin:carch.loadfilemetadata
      - api:generatecsrftokens
      - admin:carch.cropimage
      - admin:carch.flipimage
      - admin:carch.rotateimage
      - render:small
      - api:file.delete
      - rest:filemetadata.save{siteid}
      - rest:file.save{siteid}
