      - admin:cusers.list
      - admin:cmessage.noaccess
  - id: GS-ID-03
    title: Permission denials
    service: identity
    role: anonymous, qa_editor, tenant-a site admin
    sessions:
      anon: {login: none, via: public}
      editor: {login: qa_editor, via: admin}
      siteAdminA: {login: 'seed:tenant-a:site-admin', via: jsonapi}
    seedRefs:
      - {as: pageB, source: dataset, path: masa.content, where: {siteID: tenant-b, type: Page}, index: 0}
    steps:
      - name: anonymous-save
        method: POST
        route: /_api/json/v1/tenant-a/content/
        as: anon
        auth: anonymous
        form:
          title: GS-ID-03 anonymous save
          parentid: '00000000000000000000000000000000001'
          type: Page
          siteid: tenant-a
      - name: editor-edit-site
        method: GET
        route: /admin/?muraAction=cSettings.editSite&siteid=default
        as: editor
      - name: rest-bad-token
        method: GET
        route: /_api/rest/v1/tenant-a/content/
        as: anon
        auth: anonymous
        headers:
          Authorization: Bearer opt2-invalid-token
      - name: other-tenant-read
        method: GET
        route: /_api/json/v1/tenant-b/content/${seed.pageB.contentID}
        as: siteAdminA
    compare: [status, envelope, headers, auth, dom]
    normalisationOverrides: {}
    covers:
      - api:content.save
      - admin:csettings.editsite
      - rest:content.findall
      - api:content.findone
