          csrfExpires: {from: body, path: data.csrf_token_expires}
      - name: deploy-plugin
        method: POST
        route: /admin/?muraAction=cSettings.deployPlugin
        as: admin
        multipart:
          fields:
            csrf_token: ${deploy-tokens.csrfToken}
            csrf_token_expires: ${deploy-tokens.csrfExpires}
          files:
            - {field: newPlugin, fixture: masa-plugin-zip, filename: gs-ps-10-plugin.zip, contentType: application/zip}
        extract:
          moduleid: {from: location-query, param: moduleid}
        expected: withheld
        decisionListRef: admin:csettings.deployplugin
      - name: update-plugin
        method: POST
        route: /admin/?muraAction=cSettings.updatePlugin
        as: admin
        csrf: fetch-form
        csrfFrom: deploy-plugin
        form:
          pluginalias: GS-PS-10 Plugin
          loadPriority: '5'
          siteAssignID: tenant-b
          greeting: GS-PS-10 greeting
        expected: withheld
        decisionListRef: admin:csettings.updateplugin
      - name: edit-plugin
        method: GET
        route: /admin/?muraAction=cSettings.editPlugin&moduleID=${deploy-plugin.moduleid}
        as: admin
        extract:
          bundleName: {from: dom, selector: 'a[href*="cSettings.createBundle"]', attr: href, param: BundleName}
          bundleToken: {from: dom, selector: 'a[href*="cSettings.createBundle"]', attr: href, param: csrf_token}
          bundleExpires: {from: dom, selector: 'a[href*="cSettings.createBundle"]', attr: href, param: csrf_token_expires}
      - name: plugin-bundle
        method: GET
        route: /admin/index.cfm?muraAction=cSettings.createBundle&moduleid=${deploy-plugin.moduleid}&siteID=&BundleName=${edit-plugin.bundleName}&bundleMode=plugin&csrf_token=${edit-plugin.bundleToken}&csrf_token_expires=${edit-plugin.bundleExpires}
        as: admin
      - name: delete-tokens
        method: GET
        route: /_api/json/v1/tenant-b/generateCSRFTokens?context=${deploy-plugin.moduleid}
        as: admin
        extract:
          csrfToken: {from: body, path: data.csrf_token}
          csrfExpires: {from: body, path: data.csrf_token_expires}
      - name: delete-plugin
        method: GET
        route: /admin/?muraAction=cSettings.deletePlugin&moduleID=${deploy-plugin.moduleid}&csrf_token=${delete-tokens.csrfToken}&csrf_token_expires=${delete-tokens.csrfExpires}
        as: admin
        expected: withheld
        decisionListRef: admin:csettings.deleteplugin
    compare: [status, auth, dom, export, rows]
    rows:
      - {table: tcontent, where: {moduleid: '${deploy-plugin.moduleid}'}}
    normalisationOverrides: {}
    covers:
      - api:generatecsrftokens
      - admin:csettings.deployplugin
      - admin:csettings.updateplugin
      - admin:csettings.editplugin
      - admin:csettings.createbundle
      - admin:csettings.deleteplugin
  - id: GS-CO-21
