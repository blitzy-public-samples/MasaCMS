        method: GET
        route: /admin/?muraAction=cUsers.listUsers&siteid=tenant-a&ispublic=0
        as: admin
      - name: search
        method: GET
        route: /admin/?muraAction=cUsers.search&siteid=tenant-a&ispublic=0&search=gs
        as: admin
      - name: advancedsearch
        method: GET
        route: /admin/?muraAction=cUsers.advancedSearch&siteid=tenant-a&ispublic=0
        as: admin
      - name: create-form
        method: GET
        route: /admin/?muraAction=cUsers.editUser&siteid=tenant-a&userid=&ispublic=0
        as: admin
        extract:
          userid: {from: dom, selector: 'form[name=form1]', attr: action, param: userid}
      - name: create
        method: POST
        route: /admin/?muraAction=cUsers.update&userid=${create-form.userid}&routeid=
