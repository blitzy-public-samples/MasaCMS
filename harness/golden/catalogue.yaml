  - id: GS-CO-14
    title: Forms dialogs and data manager
    service: strategies-content
    role: admin
    sessions:
      admin: {login: admin, via: admin}
    seedRefs:
      - {as: formNode, source: dataset, path: masa.content, where: {siteID: tenant-a, type: Form}, index: 0}
      - {as: formPage, source: dataset, path: masa.content, where: {siteID: tenant-a, title: OPT-2 Seed Contact Page}, index: 0}
      - {as: response, source: dataset, path: masa.formResponses, where: {formID: '${seed.formNode.contentID}'}, index: 0}
    steps:
      # The draft comes first, so every admin page's header Drafts count holds it on a first run as on a re-run.
      - name: page-version
        method: GET
        route: /_api/json/v1/tenant-a/content/${seed.formPage.contentID}
        as: admin
        extract:
          contenthistid: {from: body, path: data.contenthistid}
      - name: form-object-params
        method: POST
        route: /admin/?muraAction=cArch.updateObjectParams
        as: admin
        form:
          contenthistid: ${page-version.contenthistid}
          objectid: ${seed.formNode.contentID}
          regionid: '2'
          orderno: '1'
          siteid: tenant-a
          params: '{"source":"GS-CO-14 draft"}'
          approved: '0'
          object: form
          name: OPT-2 Seed Contact Form
          changesetid: ''
          removepreviouschangeset: 'false'
          preview: '0'
      # The import saves a draft Form, which later admin headers count, so it runs early too. On a re-run its title is
      # taken and nothing is saved, so only the import form, fetched before it, can show another count: it compares status.
      - name: import-form
        method: GET
        route: /admin/?muraAction=cForm.importForm&siteid=tenant-a
        as: admin
        compare: [status]
      - name: import-zip
        method: POST
        route: /admin/?muraAction=cForm.importForm
        as: admin
        csrf: fetch-form
        csrfFrom: import-form
        multipart:
          fields:
            siteid: tenant-a
            title: GS-CO-14 Imported Form
          files:
            - {field: formzip, fixture: form-export-zip, filename: gs-co-14-form.zip, contentType: application/zip}
        expected: halted
        exceptionId: EX-FORM-IMPORT
      # The published version's edit form links its latest draft, the one updateObjectParams just saved.
      - name: page-edit
        method: GET
        route: /admin/?muraAction=cArch.edit&siteid=tenant-a&moduleid=00000000000000000000000000000000000&parentid=00000000000000000000000000000000001&topid=00000000000000000000000000000000001&type=Page&contentid=${seed.formPage.contentID}&contenthistid=${page-version.contenthistid}
        as: admin
        extract:
          draft: {from: dom, selector: 'div.alert-info a[href*="contenthistid="]', attr: href, param: contenthistid}
        expected: halted
        exceptionId: EX-CARCH-EDIT-FORM
      - name: draft-version
        method: GET
        route: /_api/json/v1/tenant-a/content/${seed.formPage.contentID}?contenthistid=${page-edit.draft}
        as: admin
      - name: dialogs
        method: GET
        route: /admin/?muraAction=${matrix.action}&siteid=tenant-a&formid=${seed.formNode.contentID}&dialog=message-delete-row&fieldtype=field-textfield
        as: admin
        matrix:
          action: [cForm.getDialog, cForm.getForm, cForm.getField, cForm.getFieldType, cForm.getFieldTemplate]
      - name: dataset
        method: GET
        route: /admin/?muraAction=cForm.getDataset&siteid=tenant-a&formid=${seed.formNode.contentID}&datasetid=&fieldid=${seed.formNode.fieldIDs.0}
        as: admin
      - name: export
        method: GET
        route: /admin/?muraAction=cForm.export&siteid=tenant-a&contentid=${seed.formNode.contentID}
        as: admin
      - name: import
        method: POST
        route: /admin/?muraAction=cForm.importForm
        as: admin
        form:
          siteid: tenant-a
          formzip: ''
          contentid: ${seed.formNode.contentID}
      - name: data-manager
        method: GET
        route: /admin/?muraAction=cArch.datamanager&siteid=tenant-a&contentid=${seed.formNode.contentID}&moduleid=00000000000000000000000000000000004
        as: admin
      # Updating before the later reads lets every run, the first included, read the marker; the post carries the
      # fields of the response's edit form (dsp_edit.cfm) and its CSRF pair.
      # Only status is compared: the edit form shows the message an earlier run left.
      - name: response-form
        method: GET
        route: /admin/?muraAction=cArch.datamanager&siteid=tenant-a&contentid=${seed.formNode.contentID}&moduleid=00000000000000000000000000000000004&date1=&hour1=0&minute1=0&date2=&hour2=23&minute2=59&responseid=${seed.response.responseID}&action=edit&sortBy=Entered&sortDirection=asc&filterBy=&keywords=
        as: admin
        compare: [status]
      - name: response-update
        method: POST
        route: /admin/?muraAction=cArch.datamanager
        as: admin
        csrf: fetch-form
        csrfFrom: response-form
        form:
          fullname: ${seed.response.fields.0.value}
          email: ${seed.response.fields.1.value}
          message: GS-CO-14 updated message
          formid: ${seed.formNode.contentID}
          contentid: ${seed.formNode.contentID}
          siteid: tenant-a
          muraAction: cArch.datamanager
          responseID: ${seed.response.responseID}
          hour1: '0'
          hour2: '23'
          minute1: '0'
          minute2: '59'
          date1: ''
          date2: ''
          fieldlist: email,fullname,message
          sortBy: Entered
          sortDirection: asc
          filterBy: ''
          keywords: ''
          entered: ${seed.response.entered}
          moduleid: '00000000000000000000000000000000004'
          action: update
      - name: responses
        method: GET
        route: /admin/?muraAction=cArch.datamanager&siteid=tenant-a&contentid=${seed.formNode.contentID}&moduleid=00000000000000000000000000000000004&date1=&hour1=0&minute1=0&date2=&hour2=23&minute2=59&sortBy=Entered&sortDirection=asc&filterBy=&keywords=&newSearch=1
        as: admin
      - name: response-edit
        method: GET
        route: /admin/?muraAction=cArch.datamanager&siteid=tenant-a&contentid=${seed.formNode.contentID}&moduleid=00000000000000000000000000000000004&date1=&hour1=0&minute1=0&date2=&hour2=23&minute2=59&responseid=${seed.response.responseID}&action=edit&sortBy=Entered&sortDirection=asc&filterBy=&keywords=
        as: admin
      - name: download-data
        method: GET
        route: /admin/?muraAction=cArch.downloaddata&siteid=tenant-a&contentid=${seed.formNode.contentID}&date1=&hour1=0&minute1=0&date2=&hour2=23&minute2=59&sortBy=Entered&sortDirection=asc&filterBy=&keywords=&columns=fixed
        as: admin
    compare: [status, headers, dom, export, rows]
    rows:
      - {table: tformresponsepackets, where: {formid: '${seed.formNode.contentID}'}, minRows: 12}
      - {table: tformresponsequestions, where: {formid: '${seed.formNode.contentID}'}, minRows: 36}
      - {table: tcontentobjects, where: {contenthistid: '${page-version.contenthistid}'}, minRows: 1}
      - {table: tcontentobjects, where: {contenthistid: '${page-edit.draft}'}, minRows: 1}
    normalisationOverrides: {}
    covers:
      - admin:cform.getdialog
      - admin:cform.getform
      - admin:cform.getfield
      - admin:cform.getfieldtype
      - admin:cform.getfieldtemplate
      - admin:cform.getdataset
      - admin:cform.export
      - admin:cform.importform
      - admin:cform.importform{formzip}
      - admin:carch.datamanager
      - admin:carch.downloaddata
      - api:content.findone
      - admin:carch.edit
      - admin:carch.updateobjectparams
  - id: GS-CO-15
    title: REST authentication and the error envelope
    service: strategies-content
    role: system user; OAuth client; anonymous
    sessions:
      rest: {login: 'seed:tenant-a:system-user', via: rest-basic}
      client: {login: none, via: client-credentials}
      anon: {login: none, via: public}
      author: {login: 'seed:tenant-a:site-admin', via: jsonapi}
    seedRefs:
      - {as: oauthClient, source: dataset, path: masa.oauthClients, where: {siteID: tenant-a}, index: 0}
      - {as: page, source: dataset, path: masa.content, where: {siteID: tenant-a, type: Page}, index: 0}
    steps:
      - name: basic
        method: GET
        route: /_api/rest/v1/tenant-a/content/${seed.page.contentID}
        as: rest
        auth: basic:${user:tenant-a:system-user}:${secret:seed:${user:tenant-a:system-user}}
      # Legacy issues no token (500 server_error, as in GS-ID-08), so the Bearer step sends an unissued one.
      - name: token
        method: POST
        route: /_api/rest/v1/tenant-a/oauth2
        as: client
        auth: anonymous
        form:
          grant_type: client_credentials
          client_id: ${seed.oauthClient.clientID}
          client_secret: ${secret:oauth:${seed.oauthClient.clientID}}
      - name: bearer
        method: GET
        route: /_api/rest/v1/tenant-a/content/${seed.page.contentID}
        as: client
        auth: anonymous
        headers:
          Authorization: Bearer opt2-invalid-token
      - name: invalid-parameters
        method: GET
        route: /_api/json/v1/tenant-a/content/?siteid=gs-no-such-site
        as: anon
        auth: anonymous
      - name: invalid-method-call
        method: POST
        route: /_api/json/v1/tenant-a/content/
        as: anon
        auth: anonymous
        form:
          method: user.save
      # No badRequest step: legacy never raises it on the JSON API (isValidRequest() is always true); GS-PE-03 answers it.
      - name: unauthorized
        method: GET
        route: /_api/rest/v1/tenant-a/user/
        as: anon
        auth: anonymous
      # 403: a template with a path separator fails contentBean.validate, so the save answers its errors and writes nothing.
      - name: forbidden-validation-errors
        method: POST
        route: /_api/json/v1/tenant-a/content/
        as: author
        csrf: json-api:new
        form:
          title: GS-CO-15 invalid template
          type: Page
          parentid: '00000000000000000000000000000000001'
          siteid: tenant-a
          template: gs-co-15/invalid.cfm
        expected: withheld
        decisionListRef: api:content.save
      # 404: an unknown _path renders the site's 404 content.
      - name: not-found-path
        method: GET
        route: /_api/json/v1/tenant-a/content/_path/gs-co-15/does-not-exist
        as: anon
        auth: anonymous
      - name: server-error
        method: GET
        route: /_api/json/v1/tenant-a/content/?pageIndex=gs
        as: anon
        auth: anonymous
        expected: gap
        candidates:
          - {method: GET, route: '/_api/json/v1/tenant-a/content/?pageIndex=gs'}
          - {method: GET, route: '/_api/json/v1/tenant-a/content/?itemsPerPage=gs'}
          - {method: GET, route: '/_api/json/v1/tenant-a/content/?sort=%27'}
    compare: [status, envelope, headers, auth]
    normalisationOverrides:
      applyRules: [error-stacktrace]
    covers:
      - rest:content.findone
      - rest:oauth2
      - rest:user.findall
      - api:content.save
      - api:content.findone
      - api:content.findquery
      - api:!invalidparameters
      - api:!invalidmethodcall
