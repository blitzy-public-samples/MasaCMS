    acrossTransition:
      - {before: adopt-continue, from: v0001, to: v0002}
    steps:
      - name: admin-login-form
        method: GET
        route: /admin/?muraAction=clogin.main
        as: admin
        auth: session
      - name: admin-login
        method: POST
        route: /admin/index.cfm
        as: admin
        auth: session
        csrf: fetch-form
        csrfFrom: admin-login-form
        form:
          username: admin
          'password': ${secret:admin}
          muraAction: cLogin.login
