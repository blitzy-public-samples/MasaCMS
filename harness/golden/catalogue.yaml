  - id: GS-CO-20
    title: Seeded comments and their commenters
    service: strategies-content
    role: admin
    sessions:
      admin: {login: admin, via: admin}
      anon: {login: none, via: public}
    seedRefs:
      - {as: formPage, source: dataset, path: masa.content, where: {siteID: tenant-a, title: OPT-2 Seed Contact Page}, index: 0}
    steps:
      - name: comments
        method: GET
        route: /_api/json/v1/tenant-a/comment/?contentid=${seed.formPage.contentID}
        as: admin
        extract:
          commentid: {from: body, path: data.items.0.id}
          member1: {from: body, path: data.items.0.userid}
          member2: {from: body, path: data.items.1.userid}
          visitor1: {from: body, path: data.items.2.userid}
          visitor2: {from: body, path: data.items.3.userid}
          pending: {from: body, path: data.items.5.id}
      - name: comments-page
        method: GET
        route: /admin/?muraAction=cComments.loadCommentsPage&siteid=tenant-a&contentid=${seed.formPage.contentID}&lowerID=${comments.commentid}
        as: admin
      - name: proxy-page
        method: POST
        route: /core/modules/v1/comments/ajax/commentsProxy.cfc
        as: anon
        auth: anonymous
        form:
          method: renderCommentsPage
          contentID: ${seed.formPage.contentID}
          pageNo: '1'
          nextN: '10'
          sortDirection: asc
          siteid: tenant-a
      - name: proxy-get
        method: POST
        route: /core/modules/v1/comments/ajax/commentsProxy.cfc
        as: anon
        auth: anonymous
        form:
          method: get
          commentID: ${comments.commentid}
          siteid: tenant-a
      - name: proxy-stats
        method: POST
        route: /core/modules/v1/comments/ajax/commentsProxy.cfc
        as: anon
        auth: anonymous
        form:
          method: getContentStats
          contentID: ${seed.formPage.contentID}
          siteid: tenant-a
      # Each mutation is undone before the scenario ends, so a re-run starts from the seeded comments.
      - name: approve
        method: GET
        route: /admin/?muraAction=cComments.approve&siteid=tenant-a&commentid=${comments.pending}
        as: admin
      - name: approved
        method: GET
        route: /_api/json/v1/tenant-a/comment/${comments.pending}
        as: admin
      - name: approved-page
        method: GET
        route: /admin/?muraAction=cComments.loadCommentsPage&siteid=tenant-a&contentid=${seed.formPage.contentID}&commentID=${comments.pending}
        as: admin
      - name: unapprove
        method: POST
        route: /admin/?muraAction=cComments.singleEdit
        as: admin
        form:
          siteid: tenant-a
          commentid: ${comments.pending}
          updateAction: unapprove
      - name: unapproved
        method: GET
        route: /_api/json/v1/tenant-a/comment/${comments.pending}
        as: admin
      # A visitor's JSON API comment creates its commenter keyed by e-mail, or reuses the one a run before left;
      # an edit of the comment renames the commenter its userid names (standardEventsHandler.cfc:158-183).
      - name: visitor-comment
        method: POST
        route: /_api/json/v1/tenant-a/comment/
        as: anon
        csrf: json-api:new
        form:
          contentid: ${seed.formPage.contentID}
          siteid: tenant-a
          name: GS-CO-20 Visitor
          email: gs-co-20.visitor@seed.opt2.test
          comments: GS-CO-20 visitor comment
        extract:
          commentid: {from: body, path: data.id}
      - name: visitor-rename
        method: POST
        route: /_api/json/v1/tenant-a/comment/
        as: admin
        csrf: json-api:new
        form:
          commentid: ${visitor-comment.commentid}
          siteid: tenant-a
          name: GS-CO-20 Visitor Renamed
      - name: visitor-read
        method: GET
        route: /_api/json/v1/tenant-a/comment/${visitor-comment.commentid}
        as: admin
      - name: visitor-delete
        method: POST
        route: /admin/?muraAction=cComments.bulkEdit
        as: admin
        form:
          siteid: tenant-a
          ckUpdate: ${visitor-comment.commentid}
          bulkedit: delete
      - name: purge
        method: GET
        route: /admin/?muraAction=cComments.purgeDeletedComments&siteid=tenant-a
        as: admin
      - name: after
        method: GET
        route: /_api/json/v1/tenant-a/comment/?contentid=${seed.formPage.contentID}
        as: admin
    compare: [status, dom, envelope, rows]
    rows:
      - {table: tcontentcomments, where: {contentid: '${seed.formPage.contentID}'}, minRows: 6}
      - {table: tcontentcommentcommenters, where: {commenterid: '${comments.member1}'}, minRows: 1}
      - {table: tcontentcommentcommenters, where: {commenterid: '${comments.member2}'}, minRows: 1}
      - {table: tcontentcommentcommenters, where: {commenterid: '${comments.visitor1}'}, minRows: 1}
      - {table: tcontentcommentcommenters, where: {commenterid: '${comments.visitor2}'}, minRows: 1}
      - {table: tcontentcommentcommenters, where: {remoteid: gs-co-20.visitor@seed.opt2.test}, minRows: 1}
    normalisationOverrides: {}
    covers:
      - api:comment.findquery
      - api:comment.findone
      - api:comment.save
      - admin:ccomments.loadcommentspage
      - admin:ccomments.approve
      - admin:ccomments.singleedit
      - admin:ccomments.bulkedit
      - admin:ccomments.purgedeletedcomments
      - cfc:/core/modules/v1/comments/ajax/commentsproxy.cfc?method=rendercommentspage
      - cfc:/core/modules/v1/comments/ajax/commentsproxy.cfc?method=get
      - cfc:/core/modules/v1/comments/ajax/commentsproxy.cfc?method=getcontentstats
