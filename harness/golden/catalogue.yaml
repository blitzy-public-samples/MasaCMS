            import_status: Draft
            changeset_name: ''
          files:
            - {field: newFile, fromStep: export-content, filename: gs-co-21-export.zip, contentType: application/zip}
        expected: withheld
        decisionListRef: admin:carch.importcontent
    compare: [status, auth, dom, export, rows]
    rows:
      - {table: tcontent, where: {parentid: '${seed.page.contentID}'}}
    normalisationOverrides: {}
    covers:
      - admin:carch.exportcontent
      - admin:carch.import
      - admin:carch.importcontent
