          addressid: {from: dom, selector: 'a[href*=''editAddress'']', attr: href, param: addressID}
      - name: existing-address
        method: GET
        route: /admin/?muraAction=cUsers.editAddress&siteid=tenant-a&userid=${seed.person.userID}&addressid=${add-address.addressid}&routeid=
        as: siteAdmin
      - name: update-address
        method: POST
        route: /admin/?muraAction=cUsers.updateAddress&userid=${seed.person.userID}&routeid=&siteid=tenant-a
        as: siteAdmin
        csrf: fetch-form
        csrfFrom: existing-address
        form:
          action: Update
          siteid: tenant-a
          isPublic: '0'
          addressName: GS-PE-02 Office
          address1: 20 Roster Avenue
          city: Sample City
          state: NY
          zip: '10002'
          country: USA
          addressID: ${add-address.addressid}
          phone: 555-0102
    compare: [status, auth, dom, rows]
    rows:
      - {table: tusers, where: {userid: '${seed.person.userID}'}}
      - {table: tuseraddresses, where: {userid: '${seed.person.userID}'}}
    normalisationOverrides: {}
    covers:
      - admin:cusers.edituser
      - admin:cusers.update{type=2,action=update}
      - admin:cusers.editaddress
      - admin:cusers.updateaddress
  - id: GS-PE-03
    title: People roster archive
    service: people
    role: site-admin
    fixtures: required
    sessions:
      siteAdmin: {login: 'seed:tenant-a:site-admin', via: admin}
    seedRefs:
      - {as: archivePerson, source: dataset, path: masa.users, where: {siteID: tenant-a, isPublic: 0}, index: -20}
