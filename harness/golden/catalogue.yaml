  - id: GS-CO-19
    title: Variation targeting through the admin, JSON API and REST
    service: strategies-content
    role: admin
    purpose: coverage
    sessions:
      admin: {login: admin, via: admin}
      rest: {login: admin, via: rest-basic}
      anon: {login: none, via: public}
    seedRefs:
      - {as: person, source: dataset, path: masa.users, where: {siteID: tenant-a, isPublic: 0}, index: -2}
    steps:
      - name: variation-form
        method: GET
        route: /admin/?muraAction=carch.variationTargeting&siteid=tenant-a&remoteid=gs-co-19-variation&remoteurl=https://tenant-a.seed.opt2.test/gs-co-19&title=GS-CO-19 Variation&compactDisplay=true
        as: admin
        extract:
          contentid: {from: dom, selector: 'form input[name=contentid]', attr: value}
        expected: withheld
        decisionListRef: admin:carch.variationtargeting
      - name: variation-save
        method: POST
        route: /admin/?muraAction=carch.variationTargeting
        as: admin
        form:
          siteid: tenant-a
          remoteid: gs-co-19-variation
          remoteurl: https://tenant-a.seed.opt2.test/gs-co-19
          title: GS-CO-19 Variation
          parentid: '00000000000000000000000000000000099'
          moduleid: '00000000000000000000000000000000099'
          type: Variation
          compactDisplay: 'true'
          contentid: ${variation-form.contentid}
          muraAction: carch.variationTargeting
          saveTargeting: 'true'
          initjs: Mura('.gs-co-19').addClass('mxp-editable')
        expected: withheld
        decisionListRef: admin:carch.variationtargeting
      - name: variation-save-notify
        method: POST
        route: /admin/?muraAction=carch.variationTargeting
        as: admin
        form:
          siteid: tenant-a
          remoteid: gs-co-19-variation
          remoteurl: https://tenant-a.seed.opt2.test/gs-co-19
          title: GS-CO-19 Variation
          parentid: '00000000000000000000000000000000099'
          moduleid: '00000000000000000000000000000000099'
          type: Variation
          compactDisplay: 'true'
          contentid: ${variation-form.contentid}
          muraAction: carch.variationTargeting
          saveTargeting: 'true'
          initjs: Mura('.gs-co-19-notify').addClass('mxp-editable')
          notify: ${seed.person.userID}
        expected: withheld
        decisionListRef: admin:carch.variationtargeting{notify}
      # findNew and findOne answer 401: legacy registers variationTargeting only while `variations` is on
      # (jsonApiUtility.cfc:103-105, 1714-1715) and settings.ini.cfm turns it off; save and delete skip that check.
      - name: targeting-new
        method: GET
        route: /_api/json/v1/tenant-a/variationtargeting/new
        as: admin
      - name: targeting-save
        method: POST
        route: /_api/json/v1/tenant-a/
        as: admin
        csrf: json-api:new
        form:
          method: save
          entityname: variationTargeting
          siteid: tenant-a
          contentid: ${variation-form.contentid}
          initjs: ''
          targetingjs: return true;
        extract:
          id: {from: body, path: data.id}
      - name: targeting-read
        method: GET
        route: /_api/json/v1/tenant-a/variationtargeting/${targeting-save.id}
        as: admin
      - name: targeting-delete
        method: POST
        route: /_api/json/v1/tenant-a/
        as: admin
        csrf: json-api:${targeting-save.id}
        form:
          method: delete
          entityname: variationTargeting
          siteid: tenant-a
          id: ${targeting-save.id}
      # Every /_api/rest/ request answers 500 on ACF: contentRenderer init reads the session scope
      # (contentRenderer.cfc:701) that /_api/rest/ disables (applicationSettings.cfm:179), at a point that varies by
      # run, so the body is either the HTML error page or the server_error envelope. The steps reuse the JSON API id.
      - name: rest-targeting
        method: POST
        route: /_api/rest/v1/tenant-a/variationtargeting/
        as: rest
        auth: basic:admin:${secret:admin}
        form:
          siteid: tenant-a
          targetingid: ${targeting-save.id}
          contentid: ${variation-form.contentid}
          initjs: ''
          targetingjs: return true;
        compare: [status, auth]
        expected: halted
        exceptionId: EX-REST-SITEID-STARTUP
      # The same call without `siteid` reaches legacy's credential lookup, which the target serves. It answers the
      # server_error envelope, or the error page when it runs application start, so it compares status and auth.
      - name: rest-targeting-path-site
        method: POST
        route: /_api/rest/v1/tenant-a/variationtargeting/
        as: rest
        auth: basic:admin:${secret:admin}
