    routeKeys: ["sitemonitor:run"]
    keyScope: table
    trigger: scheduler
    sessionEffects: none
    condition: "the ACF task exists only when registered with ping true, every 900 s with a 600 s request timeout (core/appcfc/onApplicationStart_include.cfm:561-575); each step's own writes resolve through application.<manager>"
    preventedBy: native-sitemonitor-task
    reason: "The ACF scheduler, not an inventoried request, calls the /_api/sitemonitor handler, so the extractor cannot give its steps a scheduler trigger."

