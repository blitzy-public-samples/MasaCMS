# Local trace sink: OTLP/HTTP on 127.0.0.1:4319 to ${OPT2_STATE_DIR}/otel/traces.jsonl for trace assertions.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4319

processors:
  batch:
    timeout: 1s

exporters:
  file:
    path: ${env:OPT2_STATE_DIR}/otel/traces.jsonl
    flush_interval: 1s
    # A restart keeps earlier traces and the byte offsets readers hold; the exporter allows no rotation with append.
    append: true

service:
  telemetry:
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [file]
