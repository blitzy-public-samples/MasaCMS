<div class="mura-header">
	<h1>Advanced User Search</h1>

	
	<div class="nav-module-specific btn-group">
		<a class="btn" href="/admin/index.cfm?muraAction=cusers.search&siteid=default" onclick="actionModal();">
			<i class="mi-search"></i> 
			Basic Search
		</a>
	</div>

</div> <!-- /.mura-header -->


<div class="block block-constrain">

<form class="mura-search" novalidate="novalidate" id="advancedMemberSearch" action="index.cfm" method="get" name="form2">

		
			<div class="mura-control-group" id="searchParams">
					<label>Search Criteria</label>

					
					<div class="mura-control justify">
						<select name="paramRelationship1" style="display:none;">
							<option value="and">And</option>
							<option value="or">Or</option>
						</select>

						<input type="hidden" name="param" value="1" />

						<select name="paramField1">
							<option value="">Select Field</option>
							
								<option value="tusers.fname^varchar">First Name</option>
							
								<option value="tusers.lname^varchar">Last Name</option>
							
								<option value="tusers.username^varchar">Username</option>
							
								<option value="tusers.email^varchar">Email</option>
							
								<option value="tusers.company^varchar">Company</option>
							
								<option value="tusers.jobTitle^varchar">Job Title</option>
							
								<option value="tusers.website^varchar">Website</option>
							
								<option value="tusers.mobilePhone^varchar">Mobile Phone</option>
							
								<option value="tuseraddresses.address1^varchar">Street Address 1</option>
							
								<option value="tuseraddresses.address2^varchar">Street Address 2</option>
							
								<option value="tuseraddresses.city^varchar">City</option>
							
								<option value="tuseraddresses.state^varchar">State</option>
							
								<option value="tuseraddresses.Zip^varchar">Zip</option>
							
								<option value="tusers.created^date">Created</option>
							
								<option value="tusers.tags^varchar">Tag</option>
							
						</select>
							
						<select name="paramCondition1">
							
								<option value="Equals">Equals</option>
							
								<option value="GT">Greater Than</option>
							
								<option value="GTE">Greater Than or Equal To</option>
							
								<option value="LT">Less Than</option>
							
								<option value="LTE">Less Than or Equal To</option>
							
								<option value="NEQ">Not Equal To</option>
							
								<option value="Begins">Begins With</option>
							
								<option value="Contains">Contains</option>
							
						</select>
				
						<input type="text" name="paramCriteria1">

						
						<a class="criteria remove" href="javascript:;" onclick="$searchParams.removeSeachParam(this.parentNode);$searchParams.setSearchButtons();return false;" style="display:none;" title="Remove Criteria">
							<i class="mi-minus-circle"></i>
						</a>
						
						<a class="criteria add" href="javascript:;" onclick="$searchParams.addSearchParam();$searchParams.setSearchButtons();return false;" title="Add Criteria">
							<i class="mi-plus-circle"></i>
						</a>
					</div> 
				
			</div> 

		
			<div class="mura-control-group">
				<label>Active</label>
				<select name="inActive">
					<option value="">All</option>
					<option value="0" >Yes</option>
					<option value="1" >No</option>
				</select>
			</div>
		

	
		<div class="mura-actions">
			<div class="form-actions">
				<input type="hidden" name="muraAction" value="cUsers.advancedSearch">
				<input type="hidden" name="siteid" value="default">
				<input type="hidden" name="ispublic" value="0">
				
				
					<button type="button" class="btn mura-primary" onclick="document.forms.form2.muraAction.value='cUsers.advancedSearch';submitForm(document.forms.form2);">
						<i class="mi-search"></i> 
						Search
					</button>
				
				
					
						<button type="button" class="btn" onclick="document.forms.form2.muraAction.value='cUsers.advancedSearchToCSV';submitForm(document.forms.form2);$('#action-modal').remove();">
							<i class="mi-download"></i> 
							Download
						</button>
					
			</div>
		</div>

</form>

</div>
