openapi: 3.1.0
info:
  title: openapi-components
  version: 1.0.0
  description: Components the service, gateway and migration contracts share; each contract aliases every one it uses under the same name.
  license:
    name: GPL-2.0-only
    identifier: GPL-2.0-only
  x-source-sha: 696383140578f8dea3ece26f80cd7bfb370ddf0f
servers:
  - url: /
components:
  securitySchemes:
    invocationCredential:
      type: apiKey
      in: header
      name: X-Serverless-Authorization
      description: Caller's invocation credential; a Google-signed ID token in the cloud, a local service token locally.
    localPushKey:
      type: apiKey
      in: query
      name: key
      description: Local emulator push key, compared in constant time.
    pubsubPushOidc:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC token of `pubsub-invoker` in `Authorization`, addressed to the push endpoint.
    tasksInvokerOidc:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC token of `tasks-invoker` in `Authorization` in the cloud; a local `tasks-invoker` service token locally.
    userToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Site-scoped user token in `Authorization`, minted by identity and attached by the gateway.
  headers:
    AccessControlAllowCredentials:
      description: Sent with an echoed origin.
      schema:
        type: string
        const: 'true'
    AccessControlAllowOrigin:
      description: The request `Origin`, echoed when its host is a site domain, a domain alias or a sub-domain of one.
      schema:
        type: string
    ETag:
      description: Uppercase hex SHA-256 of the exact body, unquoted, as ColdFusion `hash()` computes it.
      schema:
        type: string
        pattern: '^[0-9A-F]{64}$'
    Generator:
      description: Legacy generator header.
      schema:
        type: string
        const: Masa CMS 7.6.1
    StrictTransportSecurity:
      description: Legacy HSTS header.
      schema:
        type: string
        const: max-age=1200
    UsersCsvDisposition:
      description: Legacy download disposition.
      schema:
        type: string
        const: attachment;filename=users.csv
    WWWAuthenticate:
      description: Challenge legacy sets before an authentication failure.
      schema:
        type: string
    XOpt2UnpublishedEvents:
      description: Count of the events of a committed batch left to the outbox sweep because their in-request publish was incomplete; a re-send of the same batch id answers `duplicate`.
      schema:
        type: integer
        minimum: 1
    XOpt2WritePosition:
      description: Committed write positions `<owner>=<xid>[,<owner>=<xid>…]`; the gateway strips it from client responses.
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9-]*=[0-9]+(,[a-z0-9][a-z0-9-]*=[0-9]+)*$'
  parameters:
    CloudTasksEta:
      name: X-CloudTasks-TaskETA
      in: header
      required: false
      description: Scheduled time in epoch seconds.
      schema:
        type: string
    CloudTasksExecutionCount:
      name: X-CloudTasks-TaskExecutionCount
      in: header
      required: false
      schema:
        type: string
        pattern: '^[0-9]+$'
    CloudTasksQueueName:
      name: X-CloudTasks-QueueName
      in: header
      required: false
      description: Queue name; the body's `queue` when absent.
      schema:
        type: string
    CloudTasksRetryCount:
      name: X-CloudTasks-TaskRetryCount
      in: header
      required: false
      schema:
        type: string
        pattern: '^[0-9]+$'
    CloudTasksTaskName:
      name: X-CloudTasks-TaskName
      in: header
      required: false
      description: Task id; the body's `name` when absent.
      schema:
        type: string
    CsrfExpiresHeader:
      name: X-csrf_token_expires
      in: header
      required: false
      description: CSRF token expiry `yyMMddHHnnsslll`, an alternative to the `csrf_token_expires` field.
      schema:
        type: string
    CsrfTokenHeader:
      name: X-csrf_token
      in: header
      required: false
      description: CSRF token, an alternative to the `csrf_token` field.
      schema:
        type: string
    LegacySiteId:
      name: siteid
      in: path
      required: true
      description: Legacy site id, equal to the token's `site` when a user is present (403 otherwise); legacy serves a value that names no site under `default`, and reads a method name here as the method.
      schema:
        type: string
        minLength: 1
        examples:
          - default
    MethodOverrideHeader:
      name: X-HTTP-Method-Override
      in: header
      required: false
      description: Verb legacy resolves the entity operation with in place of the request method.
      schema:
        type: string
        examples:
          - PUT
          - DELETE
    MigrationSiteId:
      name: siteId
      in: query
      required: false
      description: Legacy site id resolved to its tenant; exactly one of `tenantId` and `siteId` is required.
      schema:
        type: string
        minLength: 1
    MigrationTenantId:
      name: tenantId
      in: query
      required: false
      description: Tenant UUID; exactly one of `tenantId` and `siteId` is required.
      schema:
        type: string
        format: uuid
        pattern: '^([0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[1-8][0-9A-Fa-f]{3}-[89ABab][0-9A-Fa-f]{3}-[0-9A-Fa-f]{12}|00000000-0000-0000-0000-000000000000|[Ff]{8}-[Ff]{4}-[Ff]{4}-[Ff]{4}-[Ff]{12})$'
    PageLimit:
      name: limit
      in: query
      required: false
      description: Page size, 1 to 10000; 1000 when omitted.
      schema:
        $ref: '#/components/schemas/DigitString'
    PushKey:
      name: key
      in: query
      required: false
      description: Local emulator push key; absent in the cloud.
      schema:
        type: string
    SiteIdQuery:
      name: siteid
      in: query
      required: false
      description: Legacy site id, equal to the token's `site` (403 otherwise); the token's site when omitted.
      schema:
        type: string
        minLength: 1
        examples:
          - tenant-a
  requestBodies:
    LegacyCall:
      required: false
      description: Merged with the query string as legacy merges url, form and a JSON body; later sources win.
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/LegacyCallBody'
        multipart/form-data:
          schema:
            $ref: '#/components/schemas/LegacyCallBody'
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyCallBody'
    SystemTask:
      required: true
      description: Task wire body of a tenant-less system task.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SystemTaskWireBody'
  responses:
    ApplyUnavailable:
      description: Legacy-shaped 503 after a fail-closed or wait-timeout condition, or for a batch committed with its events left to the outbox sweep, which carries X-Opt2-Unpublished-Events and its write position; a re-send of the same batch id answers `duplicate`.
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
        X-Opt2-Write-Position:
          $ref: '#/components/headers/XOpt2WritePosition'
        X-Opt2-Unpublished-Events:
          $ref: '#/components/headers/XOpt2UnpublishedEvents'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyUnavailable'
    BadRequest:
      description: 'Legacy 400: `invalidParameters` or `badRequest`.'
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyError'
    ErrorPage:
      description: The ColdFusion error page.
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
      content:
        text/html;charset=UTF-8:
          schema:
            $ref: '#/components/schemas/LegacyHtml'
    Forbidden:
      description: The identity holds none of the required roles, or a supplied `siteid` differs from the token's site.
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyError'
    LegacyNotFound:
      description: Legacy 404 (`mura404`) in the error envelope.
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyError'
    ServerError:
      description: Legacy 500 `server_error`.
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyError'
    Unauthorized:
      description: 'Legacy 401: `authorization` without a qualifying identity, or `invalidAccessToken`/`accessTokenExpired` for a bad credential.'
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticate'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyError'
    Unavailable:
      description: Legacy-shaped 503 after a fail-closed or wait-timeout condition.
      headers:
        Generator:
          $ref: '#/components/headers/Generator'
        Strict-Transport-Security:
          $ref: '#/components/headers/StrictTransportSecurity'
        ETag:
          $ref: '#/components/headers/ETag'
      content:
        application/json;charset=utf-8:
          schema:
            $ref: '#/components/schemas/LegacyUnavailable'
  schemas:
    AdminRedirect:
      type: object
      description: A legacy admin redirect, rendered by the admin URL builder.
      required:
        - action
        - params
      additionalProperties: false
      properties:
        action:
          type: string
          examples:
            - home.redirect
            - cUsers.list
        params:
          type: object
          additionalProperties:
            type: string
    ApplyRequest:
      type: object
      description: One batch of canonical legacy rows for one legacy table and tenant; exactly one of `tenantId` and `siteId` is required.
      required:
        - batchId
        - origin
        - legacyTable
        - columns
        - rows
      oneOf:
        - required:
            - tenantId
        - required:
            - siteId
      additionalProperties: false
      properties:
        batchId:
          type: string
          minLength: 1
        origin:
          type: string
          enum:
            - backfill
            - migration-feed
            - legacy-window
        legacyTable:
          type: string
          minLength: 1
        tenantId:
          type: string
          format: uuid
          pattern: '^([0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[1-8][0-9A-Fa-f]{3}-[89ABab][0-9A-Fa-f]{3}-[0-9A-Fa-f]{12}|00000000-0000-0000-0000-000000000000|[Ff]{8}-[Ff]{4}-[Ff]{4}-[Ff]{4}-[Ff]{12})$'
        siteId:
          type: string
          minLength: 1
        legacyProgramId:
          type: integer
          minimum: 0
        columns:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CanonicalColumn'
        units:
          type: array
          items:
            type: string
            minLength: 1
        holderId:
          type: string
          minLength: 1
        rows:
          type: array
          items:
            type: object
            required:
              - op
              - row
            additionalProperties: false
            properties:
              op:
                type: string
                enum:
                  - upsert
                  - delete
                  - insert
              row:
                type: string
              discriminator:
                type:
                  - string
                  - number
        watermark:
          allOf:
            - $ref: '#/components/schemas/WatermarkFields'
          unevaluatedProperties: false
    ApplyResponse:
      type: object
      required:
        - batchId
        - duplicate
        - applied
        - skipped
      additionalProperties: false
      properties:
        batchId:
          type: string
        duplicate:
          type: boolean
        applied:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
    BeanFlag:
      description: A numeric flag column; a failed save's bean keeps the text its form posted.
      type:
        - integer
        - string
        - 'null'
    CanonicalColumn:
      type: object
      required:
        - name
        - type
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        type:
          $ref: '#/components/schemas/CanonicalType'
        scale:
          type: integer
          minimum: 0
    CanonicalType:
      type: string
      description: Canonical encoding tag.
      enum:
        - s
        - i
        - f
        - d
        - t
        - b
    CfId:
      type: string
      description: ColdFusion `createUUID()` id.
      minLength: 35
      maxLength: 35
      pattern: '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{16}$'
    CfUuid:
      type: string
      description: ColdFusion `createUUID()` id; legacy compares ids ignoring case.
      minLength: 35
      maxLength: 35
      pattern: '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{16}$'
    ChangeOp:
      type: string
      enum:
        - insert
        - update
        - delete
    ChangeOrigin:
      type: string
      enum:
        - target
        - legacy-window
        - migration-feed
        - backfill
    ChangesResponse:
      type: object
      description: Rows below `horizon` in `(xid, seq)` order; `horizon` counts as applied only when `complete`.
      required:
        - rows
        - cursor
        - horizon
        - complete
        - operations
      additionalProperties: false
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ProjectedChangeRow'
        cursor:
          type: string
          pattern: '^[0-9]+:[0-9]+$'
        horizon:
          type: string
          pattern: '^[0-9]+$'
        complete:
          type: boolean
        operations:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/OperationStatus'
    DigitString:
      type: string
      description: Non-negative decimal integer without leading zeros.
      pattern: '^(0|[1-9][0-9]{0,14})$'
    EmptyBody:
      type: string
      maxLength: 0
    EnsureRecurringResult:
      type: object
      required:
        - queue
        - name
        - created
        - reason
      additionalProperties: false
      properties:
        queue:
          type: string
        name:
          type: string
        created:
          type: boolean
        reason:
          type: string
          enum:
            - live
            - created-current
            - created-next
    ExportResponse:
      type: object
      description: One export page; `next` is null after the last page, and `objects` comes with the first page only.
      required:
        - unit
        - tenantId
        - tables
        - next
      additionalProperties: false
      properties:
        unit:
          type: string
        tenantId:
          type: string
          format: uuid
        tables:
          type: array
          items:
            $ref: '#/components/schemas/ExportTable'
        next:
          type:
            - string
            - 'null'
        objects:
          type: array
          items:
            $ref: '#/components/schemas/ObjectManifestEntry'
    ExportRow:
      type: object
      description: One row in legacy form; `key` is the whole-row encoding for keyless tables.
      required:
        - key
        - row
        - hash
      additionalProperties: false
      properties:
        key:
          type: string
        row:
          type: string
        hash:
          type: string
        legacyProgramId:
          type: integer
    ExportTable:
      type: object
      required:
        - unit
        - legacyTable
        - targetTable
        - keyless
        - columns
        - rows
      additionalProperties: false
      properties:
        unit:
          type: string
        legacyTable:
          type: string
        targetTable:
          type: string
        keyless:
          type: boolean
        columns:
          type: array
          items:
            $ref: '#/components/schemas/CanonicalColumn'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ExportRow'
    FormValue:
      description: One form field as a CFML scope holds it; JSON callers may send numbers and booleans.
      type:
        - string
        - number
        - boolean
    GateClose:
      type: object
      description: Closes the units' gates for a holder; `allowLegacy` lets a transition close units still `legacy`.
      required:
        - op
        - units
        - holderId
      additionalProperties: false
      properties:
        op:
          type: string
          const: close
        units:
          $ref: '#/components/schemas/UnitList'
        holderId:
          type: string
          minLength: 1
        phase:
          $ref: '#/components/schemas/GatePhase'
        allowLegacy:
          type: boolean
        timeoutMs:
          type: integer
          minimum: 1
          maximum: 30000
    GateConflict:
      type: object
      description: The units whose gate another holder owns.
      required:
        - error
        - units
      additionalProperties: false
      properties:
        error:
          type: string
          const: gate-conflict
        units:
          type: array
          items:
            type: string
    GateOpen:
      type: object
      description: Reopens the holder's gates as `open`, or sets them to `legacy`.
      required:
        - op
        - units
        - holderId
      additionalProperties: false
      properties:
        op:
          type: string
          const: open
        units:
          $ref: '#/components/schemas/UnitList'
        holderId:
          type: string
          minLength: 1
        state:
          type: string
          enum:
            - open
            - legacy
    GatePhase:
      type: string
      enum:
        - quiet
        - executing
        - importing
        - import-pending
    GatePhaseChange:
      type: object
      description: Sets the phase of gates the holder closed.
      required:
        - op
        - units
        - holderId
        - phase
      additionalProperties: false
      properties:
        op:
          type: string
          const: phase
        units:
          $ref: '#/components/schemas/UnitList'
        holderId:
          type: string
          minLength: 1
        phase:
          $ref: '#/components/schemas/GatePhase'
    GateRequest:
      description: One gate operation, selected by `op`.
      oneOf:
        - $ref: '#/components/schemas/GateClose'
        - $ref: '#/components/schemas/GatePhaseChange'
        - $ref: '#/components/schemas/GateOpen'
        - $ref: '#/components/schemas/GateStatus'
      discriminator:
        propertyName: op
        mapping:
          close: '#/components/schemas/GateClose'
          phase: '#/components/schemas/GatePhaseChange'
          open: '#/components/schemas/GateOpen'
          status: '#/components/schemas/GateStatus'
    GateResponse:
      type: object
      required:
        - units
      additionalProperties: false
      properties:
        units:
          type: array
          items:
            $ref: '#/components/schemas/UnitGate'
    GateState:
      type: string
      enum:
        - legacy
        - open
        - closed
    GateStatus:
      type: object
      description: Reads the gates; every unit of this owner when `units` is omitted.
      required:
        - op
      additionalProperties: false
      properties:
        op:
          type: string
          const: status
        units:
          $ref: '#/components/schemas/UnitList'
        holderId:
          type: string
          minLength: 1
    Health:
      type: object
      required:
        - status
      additionalProperties: false
      properties:
        status:
          type: string
          const: ok
    InboxCounts:
      type: object
      description: Inbox receipts over every tenant the registry has known, deleted sites included; `receipts` maps each asked event id to the tenants that applied it.
      required:
        - total
        - bySubscription
      additionalProperties: false
      properties:
        total:
          type: integer
          minimum: 0
        bySubscription:
          type: object
          additionalProperties:
            type: integer
        receipts:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    LegacyCallBody:
      type: object
      description: A JSON API call; method arguments and entity fields are further parameters.
      additionalProperties: true
      properties:
        method:
          type: string
        entityname:
          type: string
        siteid:
          type: string
        csrf_token:
          type: string
        csrf_token_expires:
          type: string
        client_id:
          type: string
        client_secret:
          type: string
        grant_type:
          type: string
          examples:
            - client_credentials
            - password
            - authorization_code
            - refresh_token
        access_token:
          type: string
        refresh_token:
          type: string
        username:
          type: string
        password:
          type: string
          format: password
        code:
          type: string
        redirect_uri:
          type: string
    LegacyChange:
      type: object
      description: A changelog row in the legacy form of one mapping; `columns` are legacy names.
      required:
        - unit
        - legacyTable
        - key
        - before
        - after
        - columns
      additionalProperties: false
      properties:
        unit:
          type: string
        legacyTable:
          type: string
        key:
          type: string
        before:
          $ref: '#/components/schemas/NullableString'
        after:
          $ref: '#/components/schemas/NullableString'
        columns:
          type: array
          items:
            type: string
        legacyProgramId:
          type: integer
    LegacyEnvelope:
      type: object
      description: Legacy JSON API success envelope; `params` is absent under `suppressAPIParams`, and `data` keys move to the top level when `useDataNamespace` is false.
      required:
        - apiversion
        - method
      additionalProperties: true
      properties:
        apiversion:
          type: string
          const: v1
        method:
          type: string
        params:
          type: object
        data: {}
        layout:
          description: The shunter layout, copied from `data.layout` when `data.shunter` is true.
    LegacyError:
      type: object
      description: 'Legacy JSON API error envelope; types map to status and code as authorization 401, invalidAccessToken and accessTokenExpired 401 invalid_token, disabled, invalidParameters, invalidEntityCall, invalidMethodCall, badRequest and invalidTokens 400 invalid_request, server_error 500.'
      required:
        - apiversion
        - method
        - error
      additionalProperties: true
      properties:
        apiversion:
          type: string
          const: v1
        method:
          type: string
        params:
          type: object
        error:
          type: object
          required:
            - message
            - code
          additionalProperties: true
          properties:
            message:
              type: string
            code:
              type: string
              enum:
                - invalid_request
                - invalid_token
                - server_error
    LegacyErrorBody:
      type: object
      description: Error of a legacy JSON API catch block; types map to status and code as authorization 401 and invalidAccessToken and accessTokenExpired 401 invalid_token, disabled, invalidParameters, invalidEntityCall, invalidMethodCall, badRequest and invalidTokens 400 invalid_request, and anything else 500 server_error.
      required:
        - message
        - code
      additionalProperties: true
      properties:
        message:
          type: string
          examples:
            - Insufficient Account Permissions
            - Invalid Access Token
            - Access Token Expired
            - The JSON API disabled
            - Invalid parameters
            - Invalid reference to persisted entity
            - Invalid method call
            - Bad Request
            - Invalid CSRF tokens
            - Unhandled Exception
        code:
          type: string
          enum:
            - invalid_request
            - invalid_token
            - server_error
        stacktrace: {}
    LegacyErrors:
      type: object
      description: Field name to legacy validation message, as the admin views render them.
      additionalProperties:
        type: string
    LegacyHtml:
      type: string
      description: Markup exactly as legacy renders it.
    LegacyUnavailable:
      type: object
      description: Legacy JSON API `server_error` envelope sent with status 503.
      required:
        - apiversion
        - method
        - error
      additionalProperties: false
      properties:
        apiversion:
          type: string
          const: v1
        method:
          type: string
        params:
          type: object
        error:
          type: object
          required:
            - message
            - code
          additionalProperties: false
          properties:
            message:
              type: string
              const: Unhandled Exception
            code:
              type: string
              const: server_error
    LocalTimestamp:
      type: string
      description: Wall-clock time in the legacy server's zone, without an offset.
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}$'
      examples:
        - '2026-06-30T09:15:00.000'
    NullableInteger:
      type:
        - integer
        - 'null'
    NullableString:
      type:
        - string
        - 'null'
    NullableTimestamp:
      oneOf:
        - $ref: '#/components/schemas/LocalTimestamp'
        - type: 'null'
    ObjectManifestEntry:
      type: object
      required:
        - key
        - size
        - sha256
      additionalProperties: false
      properties:
        key:
          type: string
        size:
          type: integer
          minimum: 0
        sha256:
          type: string
        contentType:
          type: string
        legacyPath:
          type: string
    OperationStatus:
      type: string
      enum:
        - open
        - done
        - rolled-back
    OutboxDrainCounts:
      type: object
      required:
        - tenants
        - unpublished
        - held
      additionalProperties: false
      properties:
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/TenantDrainCount'
        unpublished:
          type: integer
          minimum: 0
        held:
          type: integer
          minimum: 0
    ProjectedChangeRow:
      type: object
      description: One changelog row; `xid` and `seq` are decimal strings, `at` is `YYYY-MM-DD HH:MM:SS.mmm`.
      required:
        - xid
        - seq
        - table
        - op
        - key
        - before
        - after
        - columns
        - origin
        - actorUserId
        - actorService
        - at
        - requestId
        - operationId
        - legacy
      additionalProperties: false
      properties:
        xid:
          type: string
          pattern: '^[0-9]+$'
        seq:
          type: string
          pattern: '^[0-9]+$'
        table:
          type: string
        op:
          $ref: '#/components/schemas/ChangeOp'
        key:
          type: string
        before:
          $ref: '#/components/schemas/NullableString'
        after:
          $ref: '#/components/schemas/NullableString'
        columns:
          type: array
          items:
            type: string
        origin:
          $ref: '#/components/schemas/ChangeOrigin'
        actorUserId:
          $ref: '#/components/schemas/NullableString'
        actorService:
          $ref: '#/components/schemas/NullableString'
        at:
          type: string
        requestId:
          $ref: '#/components/schemas/NullableString'
        operationId:
          $ref: '#/components/schemas/NullableString'
        legacy:
          type: array
          items:
            $ref: '#/components/schemas/LegacyChange'
    PublishedEvent:
      type: object
      description: A published outbox event, the tenant of its envelope, its kind and its outbox `seq`.
      required:
        - eventId
        - topic
        - tenantId
        - kind
        - seq
      additionalProperties: false
      properties:
        eventId:
          type: string
          format: uuid
        topic:
          type: string
        tenantId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [state, process]
          description: The topic's `x-opt2-kind`, as the outbox row records it.
        seq:
          type: string
          pattern: '^[0-9]+$'
          description: The outbox row's `seq`; a page lists its events in ascending `seq`.
    SiteId:
      type: string
      description: Legacy site id.
      minLength: 1
      examples:
        - default
        - tenant-a
    SweepResult:
      type: object
      description: Totals of one sweep and each recovery hook's outcome in run order.
      required:
        - published
        - failed
        - skipped
        - tenants
        - hooks
      additionalProperties: false
      properties:
        published:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
        tenants:
          type: integer
          minimum: 0
        hooks:
          type: array
          items:
            type: object
            required:
              - name
              - ok
            additionalProperties: false
            properties:
              name:
                type: string
              ok:
                type: boolean
    SystemTaskWireBody:
      description: Task wire body of a recurring system task, which names no tenant.
      allOf:
        - $ref: '#/components/schemas/TaskWireBody'
        - type: object
          required:
            - tenantId
          properties:
            tenantId:
              type: 'null'
    TaskWireBody:
      type: object
      description: JSON body both task adapters post; `tenantId` is null on system tasks.
      required:
        - queue
        - name
        - tenantId
      additionalProperties: true
      properties:
        queue:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        tenantId:
          type:
            - string
            - 'null'
          format: uuid
        payload: {}
    TenantDrainCount:
      type: object
      required:
        - tenantId
        - unpublished
        - held
      additionalProperties: false
      properties:
        tenantId:
          type: string
        unpublished:
          type: integer
          minimum: 0
        held:
          type: integer
          minimum: 0
    UnitGate:
      type: object
      required:
        - unit
        - state
        - holderId
        - phase
      additionalProperties: false
      properties:
        unit:
          type: string
        state:
          $ref: '#/components/schemas/GateState'
        holderId:
          $ref: '#/components/schemas/NullableString'
        phase:
          $ref: '#/components/schemas/GatePhase'
    UnitList:
      type: array
      minItems: 1
      items:
        type: string
        minLength: 1
    WallClock:
      type: string
      description: Wall-clock time without a zone, `YYYY-MM-DD HH:MM[:SS[.fff]]` with a space or `T`.
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}[ T][0-9]{2}:[0-9]{2}(:[0-9]{2}(\.[0-9]+)?)?$'
    WatermarkDirection:
      type: string
      enum:
        - forward
        - reverse
    WatermarkFields:
      type: object
      required:
        - direction
        - finishedAt
      properties:
        direction:
          $ref: '#/components/schemas/WatermarkDirection'
        snapshotSeq:
          type: integer
          minimum: 0
        backupLsn:
          type: string
          pattern: '^[0-9]{1,25}$'
        finishedAt:
          $ref: '#/components/schemas/WallClock'
    WatermarkInput:
      description: A watermark to record for one legacy table.
      allOf:
        - $ref: '#/components/schemas/WatermarkFields'
        - type: object
          required:
            - legacyTable
          properties:
            legacyTable:
              type: string
              minLength: 1
      unevaluatedProperties: false
    WatermarkRecord:
      type: object
      required:
        - legacyTable
        - direction
        - snapshotSeq
        - backupLsn
        - finishedAt
      additionalProperties: false
      properties:
        legacyTable:
          type: string
        direction:
          $ref: '#/components/schemas/WatermarkDirection'
        snapshotSeq:
          type:
            - integer
            - 'null'
        backupLsn:
          $ref: '#/components/schemas/NullableString'
        finishedAt:
          $ref: '#/components/schemas/LocalTimestamp'
